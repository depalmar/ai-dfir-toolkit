name: framework-refresh

# Weekly re-pin of the reference data the gates validate against: MITRE ATLAS,
# Enterprise ATT&CK and the CISA KEV catalog. Every derived file is regenerated
# and every gate CI runs is run on the refreshed tree. If the diff is confined
# to pinned data and its derivatives (scripts/refresh_guard.py), the PR is set
# to auto-merge; anything else - or a gate that fails because upstream dropped
# an id something still cites - is left for a person.
#
# Auto-merge needs, once, in the repository settings:
#   - Settings > General > Allow auto-merge
#   - a branch protection rule on main requiring the artifact-catalog checks
#   - an AUTOMATION_TOKEN secret (fine-grained PAT or GitHub App token with
#     contents + pull-requests write). PRs opened with the default GITHUB_TOKEN
#     do not trigger CI, so without it the PR is opened but never auto-merges.
# Optional: a FORBIDDEN_TERMS secret (comma-separated) that holds a refresh for
# review when an added line contains any of the terms.

on:
  schedule:
    - cron: '17 6 * * 1'    # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: framework-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r artifacts/requirements.txt

      - name: Re-pin ATLAS, ATT&CK and CISA KEV
        working-directory: artifacts
        run: |
          python scripts/validate_techniques.py --refresh
          python scripts/cve_status.py --refresh

      - name: Regenerate everything derived from the pins
        working-directory: artifacts
        run: |
          python scripts/sync_mappings.py
          python scripts/export.py
          python scripts/export_forensicartifacts.py
          python scripts/export_kape.py
          python scripts/export_velociraptor.py
          python scripts/intel_graph.py --export
          python ../collectors/gen_credential_targets.py

      - name: Run every gate on the refreshed tree
        working-directory: artifacts
        run: |
          python scripts/validate.py
          python scripts/validate_techniques.py
          python scripts/cve_status.py
          python scripts/sync_mappings.py --check
          python scripts/intel_graph.py --check
          python scripts/data_sources.py --check
          python scripts/export_kape.py --check
          python scripts/export_velociraptor.py --check
          python scripts/normalize_notes.py --check
          python scripts/readme_counts.py --check
          python scripts/build_site.py --check
          (cd .. && python artifacts/scripts/validate_mappings.py)
          (cd .. && python collectors/gen_credential_targets.py --check)
          (cd .. && python collectors/check_target_drift.py)

      - name: Classify the diff
        id: guard
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set +e
          python artifacts/scripts/refresh_guard.py --base HEAD --summary "$RUNNER_TEMP/refresh.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh PR
        id: cpr
        if: steps.guard.outputs.code == '0' || steps.guard.outputs.code == '2'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/framework-refresh
          delete-branch: true
          title: "Framework refresh: ATLAS, ATT&CK and CISA KEV pins"
          body-path: ${{ runner.temp }}/refresh.md
          labels: framework-refresh
          commit-message: |
            Refresh pinned ATLAS, ATT&CK and CISA KEV data

            Generated by .github/workflows/framework-refresh.yml.

      - name: Enable auto-merge
        if: steps.guard.outputs.code == '0' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTOMATION_TOKEN is not set - PR #$PR is open for a person to merge."
            exit 0
          fi
          gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"

      # A gate that fails on refreshed data is the case auto-merge must never
      # paper over: usually upstream renamed or dropped an id that something
      # here still cites. That needs a person, so it becomes an issue.
      - name: Report a refresh that breaks a gate
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create framework-refresh --color 5319e7 --force --repo "$GITHUB_REPOSITORY" || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label framework-refresh \
            --title "Framework refresh needs attention ($(date -u +%Y-%m-%d))" \
            --body "The weekly refresh re-pinned upstream data and a gate failed on the result. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The usual cause is an upstream rename or removal of an id this repository cites - follow the ATLAS or ATT&CK changelog, update the citing files, and record the change in artifacts/docs/VERIFICATION.md."
