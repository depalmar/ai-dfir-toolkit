name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yara-validation:
    name: YARA compile + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YARA
        run: sudo apt-get update && sudo apt-get install -y yara

      - name: Compile all YARA rules (syntax check)
        run: |
          for f in $(find . -name '*.yar'); do
            echo "Compiling $f"
            yara -w "$f" /dev/null
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pickle fixtures and run smoke tests
        run: |
          cd tests
          python3 generate_test_pickles.py
          chmod +x validate.sh
          ./validate.sh

  sigma-validation:
    name: Sigma rule validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sigma-cli and backends
        run: |
          # Two backends on purpose. Elastic/lucene is the per-rule syntax gate.
          # It has no correlation support at all, so correlation rules are
          # checked with Splunk, which does. Neither is a platform endorsement -
          # the repo ships Sigma only and no vendor dialect. See CLAUDE.md.
          pip install sigma-cli pysigma-backend-elasticsearch pysigma-backend-splunk pyyaml

      - name: Validate every Sigma rule parses and converts
        run: |
          failed=0
          # Sigma rules live in the numbered attack-class directories and in
          # artifacts/detections/. Everything else in the repo that happens to be
          # YAML - catalog entries, case studies, the schema template, the
          # collector registry, CACAO playbooks, the data-source table - is data,
          # validated by scripts/validate.py in the artifact-catalog workflow.
          #
          # This was a deny-list of those data directories until a new YAML data
          # file landed in one that was not on it and got parsed as a rule. An
          # allow-list cannot fail that way: adding a data file anywhere is
          # invisible here, and adding a rule directory is a deliberate edit.
          # scripts/validate_mappings.py and scripts/data_sources.py both
          # discover rules the same way.
          for f in $(find ./0*-* ./artifacts/detections -name '*.yml'); do
            # Correlation rules reference sibling rules by name, so they cannot
            # resolve one file at a time, and lucene cannot express them at all.
            # They are validated as collections in the next step instead.
            if grep -q '^correlation:' "$f"; then
              echo "=== $f (correlation - deferred to the collection pass)"
              continue
            fi
            echo "=== $f ==="
            if ! sigma convert -t lucene --without-pipeline "$f" > /dev/null 2>&1; then
              echo "FAILED: $f"
              sigma convert -t lucene --without-pipeline "$f" 2>&1 | head -5
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed Sigma rules failed validation"
            exit 1
          fi
          echo "All Sigma rules validated successfully"

      - name: Validate Sigma correlation rules as collections
        run: |
          # A correlation rule only resolves alongside the rules it names, so
          # each containing directory is converted as one collection. Splunk is
          # used because the Elastic backend has no correlation support; the
          # choice is arbitrary and nothing vendor-specific is committed.
          #
          # The load order is fixed here rather than left to `sigma convert
          # <dir>`. pySigma converts a collection in load order, and a
          # correlation converted after only some of the rules it names fails
          # with "Conversion result not available". The CLI loads a directory
          # in filesystem listing order, which can differ between runners, so
          # the same unchanged rules passed on one run and failed on later ones.
          # Plain rules first, correlation rules last, is valid on every runner.
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml
          from sigma.backends.splunk import SplunkBackend
          from sigma.collection import SigmaCollection

          def is_correlation(p):
              return any(l.startswith("correlation:") for l in p.read_text().splitlines())

          dirs = sorted({p.parent for p in Path(".").rglob("*.yml")
                         if not {".git", ".github"} & set(p.parts) and is_correlation(p)})
          if not dirs:
              print("No correlation rules present.")
              sys.exit(0)
          failed = 0
          for d in dirs:
              print(f"=== {d} ===")
              files = sorted(d.glob("*.yml"), key=lambda p: (is_correlation(p), p.name))
              docs = [doc for f in files for doc in yaml.safe_load_all(f.read_text()) if doc]
              try:
                  SplunkBackend().convert(SigmaCollection.from_dicts(docs))
              except Exception as exc:
                  print(f"FAILED: {d}: {exc}"[:600])
                  failed += 1
          if failed:
              print(f"{failed} correlation collection(s) failed validation")
              sys.exit(1)
          print("All correlation rules validated successfully")
          PY

  suricata-validation:
    name: Suricata syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Suricata
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata
          suricata -V

      - name: Validate all Suricata rules
        run: |
          mkdir -p /tmp/suricata-rules
          cp $(find . -name '*.rules') /tmp/suricata-rules/
          cat /tmp/suricata-rules/*.rules > /tmp/combined.rules
          suricata -T -S /tmp/combined.rules -l /tmp/
