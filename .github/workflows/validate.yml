name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yara-validation:
    name: YARA compile + smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YARA
        run: sudo apt-get update && sudo apt-get install -y yara

      - name: Compile all YARA rules (syntax check)
        run: |
          for f in $(find . -name '*.yar'); do
            echo "Compiling $f"
            yara -w "$f" /dev/null
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pickle fixtures and run smoke tests
        run: |
          cd tests
          python3 generate_test_pickles.py
          chmod +x validate.sh
          ./validate.sh

  sigma-validation:
    name: Sigma rule validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sigma-cli and backends
        run: |
          # Two backends on purpose. Elastic/lucene is the per-rule syntax gate.
          # It has no correlation support at all, so correlation rules are
          # checked with Splunk, which does. Neither is a platform endorsement -
          # the repo ships Sigma only and no vendor dialect. See CLAUDE.md.
          pip install sigma-cli pysigma-backend-elasticsearch pysigma-backend-splunk pyyaml

      - name: Validate every Sigma rule parses and converts
        run: |
          failed=0
          # Not every YAML file in the repo is a Sigma rule. The artifact catalog
          # stores entries, case studies, and its schema template as YAML data;
          # those are validated by scripts/validate.py in the artifact-catalog
          # workflow. Sigma rules shipped with the catalog live in
          # artifacts/detections/sigma/ and stay in scope here.
          # collectors/ and playbooks/ hold data files, not detection content -
          # a target registry and CACAO playbooks are validated by their own
          # checks in the artifact-catalog workflow.
          for f in $(find . -name '*.yml' \
                       -not -path './.github/*' \
                       -not -path './artifacts/catalog/*' \
                       -not -path './artifacts/case-studies/*' \
                       -not -path './artifacts/schema/*' \
                       -not -path './collectors/*' \
                       -not -path './playbooks/*'); do
            # Correlation rules reference sibling rules by name, so they cannot
            # resolve one file at a time, and lucene cannot express them at all.
            # They are validated as collections in the next step instead.
            if grep -q '^correlation:' "$f"; then
              echo "=== $f (correlation - deferred to the collection pass)"
              continue
            fi
            echo "=== $f ==="
            if ! sigma convert -t lucene --without-pipeline "$f" > /dev/null 2>&1; then
              echo "FAILED: $f"
              sigma convert -t lucene --without-pipeline "$f" 2>&1 | head -5
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed Sigma rules failed validation"
            exit 1
          fi
          echo "All Sigma rules validated successfully"

      - name: Validate Sigma correlation rules as collections
        run: |
          # A correlation rule only resolves alongside the rules it names, so
          # each containing directory is converted as one collection. Splunk is
          # used because the Elastic backend has no correlation support; the
          # choice is arbitrary and nothing vendor-specific is committed.
          failed=0
          dirs=$(grep -rl '^correlation:' --include='*.yml' . \
                   | grep -v '^./.github/' | xargs -r -n1 dirname | sort -u)
          if [ -z "$dirs" ]; then
            echo "No correlation rules present."
            exit 0
          fi
          for d in $dirs; do
            echo "=== $d ==="
            if ! sigma convert -t splunk --without-pipeline "$d" > /dev/null 2>&1; then
              echo "FAILED: $d"
              sigma convert -t splunk --without-pipeline "$d" 2>&1 | head -8
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed correlation collection(s) failed validation"
            exit 1
          fi
          echo "All correlation rules validated successfully"

  suricata-validation:
    name: Suricata syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Suricata
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata
          suricata -V

      - name: Validate all Suricata rules
        run: |
          mkdir -p /tmp/suricata-rules
          cp $(find . -name '*.rules') /tmp/suricata-rules/
          cat /tmp/suricata-rules/*.rules > /tmp/combined.rules
          suricata -T -S /tmp/combined.rules -l /tmp/
