name: pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/catalog/**'
      - 'artifacts/docs/api/**'
      - 'artifacts/case-studies/**'
      - 'artifacts/detections/**'
      - 'artifacts/scripts/build_site.py'
      - 'artifacts/scripts/site_data.py'
      - 'artifacts/requirements.txt'
      - 'docs/ai-dfir-investigation-guide.md'
      - 'MAPPINGS.md'
      - '0*/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The site is generated from docs/api/catalog.json, which is validated
      # and staleness-checked by the artifact-catalog workflow. Building at
      # deploy time means the page can never drift from the catalog.
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: artifacts
      - name: Build site
        run: python scripts/build_site.py
        working-directory: artifacts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/docs/site
      - uses: actions/deploy-pages@v4
        id: deployment
