name: intel-watch

# Weekly poll of threat-intel sources (artifacts/intel/watch-sources.yml). New
# items become issues labelled intel-candidate, with facts and a link. Nothing
# here writes to the repository or merges anything: a new incident or actor
# needs a person to read the source, find corroboration and decide scope.

on:
  schedule:
    - cron: '41 7 * * 3'    # Wednesdays 07:41 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO date to look back to (default: lookback_days in the config)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r artifacts/requirements.txt
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create intel-candidate --color 0e8a16 --force --repo "$GITHUB_REPOSITORY"
      - name: Poll sources and open issues
        working-directory: artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE: ${{ github.event.inputs.since }}
        run: python scripts/intel_watch.py ${SINCE:+--since "$SINCE"}
