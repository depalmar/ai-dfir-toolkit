name: artifact-catalog

# No path filter: this workflow's `validate` job is a required status check on
# main, and a required check that never runs blocks the merge forever. A PR
# touching only workflows or docs would deadlock. The job is ~1 minute, so
# running it on every PR is cheaper than the alternative.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: artifacts

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog and detections
        run: python scripts/validate.py
      # Names the project deliberately does not publish, held in a secret so the
      # list itself is never committed. Passes with a notice when unset.
      - name: Check for forbidden terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: python scripts/forbidden_terms.py
      # The schema checks technique ids by shape, so AML.T9999 and a technique
      # MITRE deprecated three releases ago both pass it. This resolves them
      # against pinned framework data. Offline on purpose: a gate that followed
      # upstream live would break the build on a MITRE rename with no diff to
      # explain it, and would fail CI for network reasons unrelated to the
      # change under test. Bump the pin with --refresh, which shows up in review.
      - name: Resolve ATLAS and ATT&CK technique ids
        run: python scripts/validate_techniques.py
      # Same pattern for CISA KEV: "on KEV" is a claim a responder triages by,
      # and two files once disagreed about it for the same CVE.
      - name: Check KEV claims against the pinned CISA catalog
        run: python scripts/cve_status.py
      # MAPPINGS index tables are derived from the rows and the pinned titles.
      - name: Check MAPPINGS indexes and rule tags
        run: python scripts/sync_mappings.py --check
      # Actor profiles and case studies against their closed schemas, and every
      # cross-reference between them, the catalog and the rule corpus.
      - name: Check threat-intel layer
        run: python scripts/intel_graph.py --check
      # The Contents block is the first thing a reader sees and every number in
      # it was hand-typed and had drifted - 44 tools against 51, 258 artifacts
      # against 601. Derived and gated now, like the feeds.
      - name: Check README counts against the catalog
        run: python scripts/readme_counts.py --check
      # validate_mappings.py walks the repository root to find the 0N-* rule
      # directories, so it cannot run under this job's `artifacts` default.
      - name: Validate MAPPINGS.md against rules on disk
        working-directory: .
        run: python artifacts/scripts/validate_mappings.py
      # The page itself is only built on push to main, so without this a change
      # that breaks the site's data contract would not surface until deploy.
      - name: Check site data contract
        run: python scripts/build_site.py --check
      # The credential half of collectors/targets.yaml is generated from the
      # catalog, so the first command fails if it was not regenerated after a
      # catalog change. The second covers what generation does not: the
      # hand-authored targets, and any catalogued credential the collector would
      # miss entirely or copy whole instead of hashing.
      - name: Check collector targets against the catalog
        working-directory: .
        run: |
          python collectors/gen_credential_targets.py --check
          python collectors/check_target_drift.py
      - name: Validate CACAO playbooks
        working-directory: .
        run: python playbooks/validate_cacao.py playbooks/pb-*.json
      - name: Verify Sigma rules convert to a real backend
        run: |
          pip install sigma-cli pysigma-backend-splunk
          python - <<'PY'
          from sigma.collection import SigmaCollection
          from sigma.backends.splunk import SplunkBackend
          import glob, sys
          backend, failed = SplunkBackend(), 0
          for path in sorted(glob.glob("detections/sigma/*.yml")):
              try:
                  backend.convert(SigmaCollection.from_yaml(open(path).read()))
              except Exception as exc:
                  print(f"::error::{path} does not convert: {exc}")
                  failed += 1
          sys.exit(1 if failed else 0)
          PY
      - name: Rebuild export feeds
        run: |
          python scripts/export.py
          python scripts/export_forensicartifacts.py
          python scripts/export_kape.py
          python scripts/export_velociraptor.py
          python scripts/intel_graph.py --export
      - name: Fail if feeds are stale
        run: |
          if ! git diff --quiet docs/api; then
            echo "::error::artifacts/docs/api is stale. Run the export scripts and commit."
            git diff --stat docs/api
            exit 1
          fi
