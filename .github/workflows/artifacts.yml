name: artifact-catalog

# No path filter: this workflow's `validate` job is a required status check on
# main, and a required check that never runs blocks the merge forever. A PR
# touching only workflows or docs would deadlock. The job is ~1 minute, so
# running it on every PR is cheaper than the alternative.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: artifacts

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog and detections
        run: python scripts/validate.py
      # validate_mappings.py walks the repository root to find the 0N-* rule
      # directories, so it cannot run under this job's `artifacts` default.
      - name: Validate MAPPINGS.md against rules on disk
        working-directory: .
        run: python artifacts/scripts/validate_mappings.py
      # The page itself is only built on push to main, so without this a change
      # that breaks the site's data contract would not surface until deploy.
      - name: Check site data contract
        run: python scripts/build_site.py --check
      # The credential half of collectors/targets.yaml is generated from the
      # catalog, so the first command fails if it was not regenerated after a
      # catalog change. The second covers what generation does not: the
      # hand-authored targets, and any catalogued credential the collector would
      # miss entirely or copy whole instead of hashing.
      - name: Check collector targets against the catalog
        working-directory: .
        run: |
          python collectors/gen_credential_targets.py --check
          python collectors/check_target_drift.py
      - name: Validate CACAO playbooks
        working-directory: .
        run: python playbooks/validate_cacao.py playbooks/pb-*.json
      - name: Verify Sigma rules convert to a real backend
        run: |
          pip install sigma-cli pysigma-backend-splunk
          python - <<'PY'
          from sigma.collection import SigmaCollection
          from sigma.backends.splunk import SplunkBackend
          import glob, sys
          backend, failed = SplunkBackend(), 0
          for path in sorted(glob.glob("detections/sigma/*.yml")):
              try:
                  backend.convert(SigmaCollection.from_yaml(open(path).read()))
              except Exception as exc:
                  print(f"::error::{path} does not convert: {exc}")
                  failed += 1
          sys.exit(1 if failed else 0)
          PY
      - name: Rebuild export feeds
        run: |
          python scripts/export.py
          python scripts/export_forensicartifacts.py
          python scripts/export_kape.py
          python scripts/export_velociraptor.py
      - name: Fail if feeds are stale
        run: |
          if ! git diff --quiet docs/api; then
            echo "::error::artifacts/docs/api is stale. Run the export scripts and commit."
            git diff --stat docs/api
            exit 1
          fi
