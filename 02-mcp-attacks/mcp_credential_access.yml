title: MCP Server Process Accessing Credential Files
id: 2b3c4d5e-6f70-8192-a3b4-c5d6e7f80910
status: experimental
description: |
  Detects MCP server processes (typically spawned via npx/uvx/python)
  reading credential files such as SSH keys, AWS credentials, .env files,
  or browser cookie databases. This pattern indicates a poisoned MCP
  tool exfiltrating secrets via the LLM-as-proxy technique documented
  by Invariant Labs and Cyata.
references:
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://cyata.ai/blog/whispering-secrets-loudly-inside-mcps-quiet-crisis-of-credential-exposure/
  - https://atlas.mitre.org/techniques/AML.T0086
author: Raymond DePalma (ai-dfir-detections)
date: 2026-04-15
tags:
  - attack.credential_access
  - attack.t1552
  - attack.atlas.t0086
  - owasp.llm02
logsource:
  category: file_event
detection:
  selection_mcp_processes:
    ParentImage|endswith:
      - '/node'
      - '/npx'
      - '/python'
      - '/python3'
      - '/uvx'
      - '/uv'
      - '\node.exe'
      - '\python.exe'
    ParentCommandLine|contains:
      - 'mcp'
      - '@modelcontextprotocol'
      - 'mcp-server'
      - 'fastmcp'
  selection_credential_targets:
    TargetFilename|contains:
      - '/.ssh/id_rsa'
      - '/.ssh/id_ed25519'
      - '/.ssh/id_ecdsa'
      - '/.ssh/known_hosts'
      - '/.aws/credentials'
      - '/.aws/config'
      - '/.config/gh/hosts.yml'
      - '/.netrc'
      - '/.kube/config'
      - '/.docker/config.json'
      - '/.npmrc'
      - '/.pypirc'
      - '\.aws\credentials'
      - '\.ssh\id_rsa'
      - 'Cookies-journal'
      - 'Login Data'
      - 'Keychains/login.keychain-db'
  selection_dotenv:
    TargetFilename|endswith:
      - '/.env'
      - '/.env.local'
      - '/.env.production'
      - '/.env.secrets'
  condition: selection_mcp_processes and (selection_credential_targets or selection_dotenv)
fields:
  - User
  - Image
  - ParentImage
  - ParentCommandLine
  - TargetFilename
falsepositives:
  - Legitimate MCP servers designed to read .env files (verify by name and source)
  - SSH MCP servers reading known_hosts (rare but possible)
  - AWS/cloud-management MCP servers with documented credential access
level: critical
