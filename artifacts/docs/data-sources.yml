  - id: openai-org-audit
    name: OpenAI API Platform audit logs
    kind: network
    enable: >-
      An organization owner enables audit logging under organization settings,
      data controls. Once on it cannot be turned off in settings. The Audit
      Logs API then exposes administrative events - API key, project, member
      and setting changes.
    default_state: Off until an owner enables it.
    retention: >-
      No fixed period. OpenAI states that API Platform audit logs are retained
      on a best-effort basis with no guarantee of permanent availability, and
      advises exporting them. Zero Data Retention agreements do not change
      this.
    volatility: rotating
    without_it: >-
      Who created the API key the Codex CLI or an agent framework is using, and
      whether it was rotated after the incident. The host-side credential rows
      say where the key sits; this is the only record of its lifecycle.
    covers:
      classes: []
      hosts:
        - api.openai.com
        - chatgpt.com
      sigma: []
      eventlog: []
    confidence: high
    references:
