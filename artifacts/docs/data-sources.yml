        url: https://help.openai.com/en/articles/9687866-admin-and-audit-logs-api-for-the-api-platform
        accessed: "2026-11-02"

  - id: aws-cloudtrail-bedrock
    name: AWS CloudTrail and Bedrock model invocation logging
    kind: network
    enable: >-
      Two different things. CloudTrail records Bedrock runtime calls -
      InvokeModel, Converse and their streaming forms - as management events
      with no setup; a trail or a CloudTrail Lake store is needed to keep them
      past the console's window. Model invocation logging, which captures the
      prompt and response bodies to S3 or CloudWatch Logs, is disabled by
      default and is switched on per Region in the Bedrock settings.
    default_state: >-
      CloudTrail event history on; invocation logging off.
    retention: >-
      Event history covers the past 90 days of management events and cannot be
      extended; a trail delivers to S3 under your own lifecycle. Invocation logs
      stay until the logging configuration or the destination is deleted.
    volatility: rotating
    without_it: >-
      What was sent to a Bedrock-hosted model, by which principal, from which
      address. For Amazon Q and for any agent framework pointed at Bedrock,
      CloudTrail is the record of the call and invocation logging is the only
      record of its content.
    covers:
      classes: []
      hosts:
        - amazonaws.com
        - awsapps.com
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: Monitor model invocation using CloudWatch Logs and Amazon S3 - Amazon Bedrock
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
        accessed: "2026-11-02"
      - title: Monitor Amazon Bedrock API calls using CloudTrail
        url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
        accessed: "2026-11-02"
      - title: How CloudTrail works - Event history
        url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/how-cloudtrail-works.html
        accessed: "2026-11-02"

  - id: google-cloud-audit-logs
    name: Google Cloud audit logs for Gemini and Vertex AI
    kind: network
    enable: >-
      Admin Activity audit logs cannot be disabled. Data Access audit logs,
      which record the model calls themselves, must be enabled explicitly for
      the Vertex AI service. Calls made through the Gemini Developer API with an
      API key from AI Studio are attributed to the project the key belongs to,
      and a key with no project behind it has no audit trail at all.
    default_state: Admin Activity on; Data Access off.
    retention: >-
      Admin Activity logs land in the _Required bucket, retained 400 days and
      not configurable. Data Access logs land in _Default, retained 30 days
      unless the bucket's retention is raised.
    volatility: rotating
    without_it: >-
      The provider-side record of the Gemini CLI and of any framework calling
      Gemini: which project, which principal, which model, how often. The host
      has an OAuth credential cache and a connection; neither says what was
      asked.
    covers:
      classes: []
      hosts:
        - generativelanguage.googleapis.com
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: Vertex AI audit logging information
        url: https://docs.cloud.google.com/vertex-ai/docs/general/audit-logging
        accessed: "2026-11-02"
      - title: Store log entries - log bucket retention (Cloud Logging)
        url: https://docs.cloud.google.com/logging/docs/store-log-entries
        accessed: "2026-11-02"

  - id: github-copilot-audit
    name: GitHub audit log - Copilot events
    kind: network
    enable: >-
      Nothing for Copilot Business and Enterprise: the organization or
      enterprise audit log records Copilot seat, policy and settings changes and
      agent activity on github.com under action:copilot. Client-side activity -
      the prompts a user sent from the IDE or the CLI - is not in it, and needs
      a hook that forwards events to your own logging.
    default_state: On for Business and Enterprise plans.
    retention: >-
      180 days, after which GitHub recommends streaming the audit log to a SIEM
      for longer history.
    volatility: rotating
    without_it: >-
      Who held a Copilot seat when, which policies allowed agent mode and
      third-party models, and what the coding agent did on github.com. The host
      rows record the extension and its token; the audit log records the
      entitlement that made them work.
    covers:
      classes: []
      hosts:
        - api.githubcopilot.com
        - copilot-proxy.githubusercontent.com
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: Reviewing audit logs for GitHub Copilot
        url: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/review-audit-logs
        accessed: "2026-11-02"

  - id: purview-copilot-audit
    name: Microsoft Purview audit - Copilot and Copilot Studio interactions
    kind: network
    enable: >-
      Nothing beyond auditing being on for the tenant, which it is for
      enterprise licences. Every interaction with a Copilot Studio agent, like
      every Microsoft 365 Copilot prompt, writes a CopilotInteraction record
      naming the user, the host application and the resources the agent read.
      The prompt and response text are stored separately, as Teams messages in
      the user's mailbox, under the tenant's retention policies.
    default_state: On, under Audit (Standard).
    retention: >-
      180 days under Audit (Standard) for records generated since 17 October
      2023; up to a year under Audit (Premium) and longer with a custom
      retention policy. Interactions with non-Microsoft AI applications are a
      separate, pay-as-you-go record type, also 180 days.
    volatility: rotating
    without_it: >-
      What a Copilot Studio agent read and said, on whose behalf. The catalog
      has nothing on the endpoint for a cloud agent but its channel endpoints;
      this is the whole record.
    covers:
      classes: []
      hosts:
        - directline.botframework.com
        - powerapps.com
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: Audit logs for Copilot and AI applications - Microsoft Purview
        url: https://learn.microsoft.com/en-us/purview/audit-copilot
        accessed: "2026-11-02"
      - title: Learn about auditing solutions in Microsoft Purview - retention
        url: https://learn.microsoft.com/en-us/purview/audit-solutions-overview
        accessed: "2026-11-02"

  - id: identity-provider-logs
    name: Identity provider sign-in and consent logs
    kind: network
    enable: >-
      Nothing to switch on, but a short clock to beat. Agents and MCP servers
      that act through a user's cloud identity - the Gemini CLI's Google
      sign-in, Copilot Studio connections, any connector granted through an
      OAuth consent - leave a sign-in and a consent grant in the identity
      provider. Export them to a SIEM or Log Analytics; the native windows are
      days.
    default_state: On in every tenant.
    retention: >-
      Microsoft Entra keeps sign-in and audit logs for seven days on the Free
      tier and thirty on P1 and P2; upgrading does not recover what has already
      aged out. Google Workspace token events sit in the admin console's audit
      and investigation tool; its retention window was not found in the
      vendor's documentation when this was written, so confirm it for the
      tenant rather than assuming parity with Entra.
    volatility: rotating
    without_it: >-
      Whether an application was consented to, by whom, and what scopes it
      holds. An agent's OAuth credential on disk is a consequence of a consent
      event; the event is where the scope, the time and the approving user are
      written down, and it is the record that says the token survived rotation.
    covers:
      classes: []
      hosts:
        - oauth2.googleapis.com
        - accounts.google.com
      sigma: []
      eventlog: []
    confidence: medium
    references:
      - title: Microsoft Entra data retention
        url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-reports-data-retention
        accessed: "2026-11-02"
