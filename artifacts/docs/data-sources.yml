# Telemetry sources the catalog depends on.
#
# The catalog answers "what did this tool leave on the host." This file answers
# the question that comes before it: "will any of that still be there when I go
# looking, and what did I have to switch on beforehand."
#
# Only the prose lives here - what a source is, how you enable it, what it costs
# to keep, and what you cannot answer without it. Every number that describes
# coverage (how many rows, how many rules, which tools) is DERIVED from the
# catalog and the rule corpus by scripts/data_sources.py, and the audit in that
# script fails if a source claims coverage that does not exist or if a row or a
# rule maps to no source at all. A hand-maintained coverage table drifts out of
# true the first time somebody adds a rule; this one cannot.
#
# Fields
#   id             stable slug, referenced by the site and by the audit
#   name           display name
#   kind           eventlog | file | live | network - how you get at it
#   enable         what has to be switched on. "" means nothing does.
#   default_state  what a stock host does before anyone configures it
#   retention      how long the source holds evidence, and what to raise it to
#   volatility     live | rotating | stable - see scripts/data_sources.py
#   without_it     the investigative question that becomes unanswerable
#   covers:
#     classes      catalog row classes this source makes visible
#     os           optional - narrows `classes` to rows naming these platforms,
#                  so a macOS-only source is not credited with Windows rows
#     sigma        Sigma logsource categories this source satisfies
#     eventlog     [channel, event_id] pairs, matched against catalog rows
#     hosts        hostnames or parent domains that network rows name. This is
#                  how a provider's own audit log is tied to the catalogued
#                  tools that talk to it - the link is derived from the rows,
#                  and a host nothing names fails the audit
#     locators     locator prefixes such as repo, for sources that exist only
#                  where a row is scoped to a checkout
#   confidence     provenance of the facts in `enable` and `retention`
#   references     where those facts came from

sources:
  - id: sysmon-process-creation
    name: Sysmon Event ID 1 - process creation
    kind: eventlog
    enable: >-
      Install Sysmon and load a configuration that does not exclude the image.
      Most published baseline configurations filter aggressively on ProcessCreate
      to control volume, and several exclude common developer binaries by name -
      check that node.exe, python.exe and the agent binaries in this catalog are
      not among them before relying on this source.
    default_state: Absent. Sysmon is not installed on a stock Windows host.
    retention: >-
      The channel defaults to 64 MB, which on a workstation running a coding
      agent is days rather than months - these tools spawn a child process per
      tool call. Raise the channel or forward the events off the host; the
      default assumes a machine that starts a few dozen processes an hour.
    volatility: rotating
    without_it: >-
      Whether the agent ran at all, and what it spawned. Disk artifacts prove a
      tool is installed; only a process creation record proves it executed, and
      the child processes of that record are the only evidence of what the agent
      actually did with its shell access.
    covers:
      classes:
        - process
      os:
        - windows
      sigma:
        - process_creation
      eventlog:
        - ["Microsoft-Windows-Sysmon/Operational", "1"]
    confidence: medium
    references:
      - title: Sysmon - Sysinternals
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        accessed: "2026-08-13"
      - title: "Windows Event Logging and Forwarding (ACSC)"
        url: https://www.cyber.gov.au/sites/default/files/2023-03/PROTECT%20-%20Windows%20Event%20Logging%20and%20Forwarding%20(October%202021).pdf
        accessed: "2026-08-13"

  - id: security-4688
    name: Security 4688 - process creation, with command line
    kind: eventlog
    enable: >-
      Two settings, not one. Audit Process Creation under Advanced Audit
      Configuration - Detailed Tracking turns the event on; Include command line
      in process creation events, under Administrative Templates - System - Audit
      Process Creation, is what puts the command line in it. Enabling only the
      first produces events that cannot distinguish one agent from another.
    default_state: >-
      Not configured. The event is off, and the Process Command Line field is
      empty even where the event has been switched on separately.
    retention: >-
      The Security log defaults to 20 MB and cannot be configured below it.
      Process creation is high volume and shares that channel with
      authentication, so 4688 is usually the first thing to age out.
    volatility: rotating
    without_it: >-
      The fallback when Sysmon is not deployed. Roughly half this catalog runs
      under a shared interpreter - node or python - so without the command line
      one agent process is indistinguishable from another, and from any other
      program on the host that happens to use the same runtime.
    covers:
      classes:
        - process
      os:
        - windows
      sigma:
        - process_creation
      eventlog: []
    confidence: high
    references:
      - title: Command line process auditing
        url: https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/component-updates/command-line-process-auditing
        accessed: "2026-08-13"
      - title: "Event Log Service: Security maximum log size forces a minimum of 20480 KB"
        url: https://learn.microsoft.com/en-us/archive/blogs/asiasupp/event-log-service-security-maximum-log-size-kb-forces-a-minimum-size-of-20480-kb
        accessed: "2026-08-13"

  - id: sysmon-network
    name: Sysmon Event ID 3 - network connection
    kind: eventlog
    enable: >-
      Sysmon with NetworkConnect enabled. It is off in some baseline
      configurations because it is the highest-volume event Sysmon produces.
    default_state: Absent.
    retention: >-
      Shares the Sysmon channel, and outweighs every other event in it. Sizing
      the channel for process creation alone will not survive NetworkConnect
      being switched on.
    volatility: rotating
    without_it: >-
      Which model endpoint the agent actually talked to. The catalog records the
      default endpoints, but the interesting finding is a local runtime pointed
      at somewhere other than its default, and that is a connection record rather
      than a file.
    covers:
      classes:
        - network
      os:
        - windows
      sigma:
        - network_connection
      eventlog: []
    confidence: medium
    references:
      - title: Sysmon - Sysinternals
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        accessed: "2026-08-13"

  - id: sysmon-file-create
    name: Sysmon Event ID 11 - file create
    kind: eventlog
    enable: Sysmon with FileCreate rules covering the agent data directories.
    default_state: Absent.
    retention: Shares the Sysmon channel.
    volatility: rotating
    without_it: >-
      When a config or a session transcript first appeared. The file is still on
      disk either way, but its creation time is the only thing that dates the
      config change, and a rewritten file carries the time of the rewrite.
    covers:
      classes: []
      sigma:
        - file_event
      eventlog: []
    confidence: medium
    references:
      - title: Sysmon - Sysinternals
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        accessed: "2026-08-13"

  - id: sysmon-registry
    name: Sysmon Event IDs 12-14 - registry
    kind: eventlog
    enable: Sysmon with RegistryEvent rules covering the keys in this catalog.
    default_state: Absent.
    retention: Shares the Sysmon channel.
    volatility: rotating
    without_it: >-
      When a Run key or a protocol handler was written. The key itself survives,
      so this source buys the timeline rather than the fact.
    covers:
      classes:
        - registry
      os:
        - windows
      sigma:
        - registry_set
      eventlog: []
    confidence: medium
    references:
      - title: Sysmon - Sysinternals
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        accessed: "2026-08-13"

  - id: file-collection
    name: Host file collection
    kind: file
    enable: >-
      Nothing on the host. This is an acquisition capability rather than a
      logging one - KAPE targets and Velociraptor artifacts for every path in
      this catalog are generated under docs/api/, and most EDR platforms can
      fetch a named file.
    default_state: >-
      Available on any host you can reach. The constraint is reaching it before
      the tool is uninstalled, not switching anything on.
    retention: >-
      Until somebody uninstalls the tool or clears its data directory, with the
      exception of the rows that carry an explicit retention window - those are
      flagged as rotating in the catalog and are the ones to collect first.
    volatility: stable
    without_it: >-
      Almost everything. This is the source the catalog is mostly about: configs,
      credentials, MCP definitions, session transcripts, and the record of what
      the agent was authorised to run.
    covers:
      classes:
        - disk
        - credential
        - mcp-config
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: "ai-dfir-toolkit: generated KAPE targets and Velociraptor artifacts"
        url: https://github.com/depalmar/ai-dfir-toolkit/tree/main/artifacts/docs/api
        accessed: "2026-08-13"

  - id: file-access-telemetry
    name: File read telemetry on credential paths
    kind: file
    enable: >-
      EDR file-access events, or a Windows SACL on the credential paths with
      Audit Object Access enabled. Neither is on by default, and the SACL route
      needs the audit entry applied per path.
    default_state: Absent.
    retention: >-
      Wherever the EDR keeps it, which is usually the shortest retention in the
      estate. Object access auditing lands in the Security log and competes with
      everything else there.
    volatility: rotating
    without_it: >-
      Whether anything other than the owning agent opened the token. Every
      plaintext credential location in this catalog is a target; without read telemetry
      the only available answer to "was it taken" is "assume yes and rotate",
      which is the answer most incidents end on.
    covers:
      classes: []
      sigma:
        - file_access
      eventlog: []
    confidence: medium
    references:
      - title: Apply a basic audit policy on a file or folder
        url: https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/apply-a-basic-audit-policy-on-a-file-or-folder
        accessed: "2026-08-13"

  - id: inference-api-log
    name: Local inference API access log
    kind: network
    enable: >-
      Per runtime. Several of the local servers in this catalog log requests to
      stdout or to a file only when started at a raised verbosity, and a runtime
      launched from a desktop UI usually is not.
    default_state: Varies by tool, and is off more often than it is on.
    retention: >-
      Whatever the process was writing to, which for a foreground server is
      often a terminal buffer that does not survive the window closing.
    volatility: rotating
    without_it: >-
      What was asked of a locally hosted model. An unauthenticated inference
      endpoint bound to a routable address is in this catalog as a network row;
      the access log is the only thing that says whether anyone used it.
    covers:
      classes: []
      sigma:
        - webserver
      eventlog: []
    confidence: medium
    references:
      - title: "ai-dfir-toolkit: local inference runtime entries"
        url: https://github.com/depalmar/ai-dfir-toolkit/tree/main/artifacts/catalog
        accessed: "2026-08-13"

  - id: live-response
    name: Live response - running processes and open sockets
    kind: live
    enable: >-
      Nothing, but it has to happen while the host is still running. A process
      list and a socket table taken during triage, before isolation reboots the
      machine.
    default_state: Available until the process exits or the host reboots.
    retention: >-
      None. This is the source with no retention at all - it is a snapshot, and
      the only copy is the one you took.
    volatility: live
    without_it: >-
      Which agents and which MCP servers were running at the time, and what they
      were connected to. Every other source answers this in the past tense.
    covers:
      classes:
        - process
        - network
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: "RFC 3227: Guidelines for Evidence Collection and Archiving"
        url: https://www.rfc-editor.org/rfc/rfc3227
        accessed: "2026-08-13"

  # ---- Host telemetry beyond Windows -------------------------------------
  # The first nine sources were written against a Windows host. Most of the
  # catalog runs on macOS and Linux too, and the process and network rows there
  # were being credited to Sysmon, which cannot see them. These are the sources
  # that can.

  - id: edr-telemetry
    name: EDR process, network and file telemetry
    kind: eventlog
    enable: >-
      An EDR or XDR sensor on the host, with process, network and file events
      forwarded rather than only alerts. Every mainstream sensor records process
      creation with command line on all three platforms; file-open and
      network-connection events are usually tiered or sampled, so check what the
      estate's licence actually ships before assuming the row is there.
    default_state: >-
      Present wherever the estate has a sensor, which on developer workstations
      is less often than anywhere else - the machines running these agents are
      the ones with the most exceptions.
    retention: >-
      Set by the vendor's cloud tenancy, not by the host, and typically the
      shortest window in the estate - a week to a month of raw telemetry, with
      only alerts kept longer. Export what you need during the incident; the raw
      events will not wait for the report.
    volatility: rotating
    without_it: >-
      Cross-platform process lineage. This is the only source that answers
      "what did the agent spawn" on a macOS or Linux host without Sysmon,
      auditd or an Endpoint Security client having been set up beforehand, and
      the only one that ties a credential-file read to the process that did it.
    covers:
      classes:
        - process
        - network
      sigma:
        - process_creation
        - network_connection
        - file_event
        - file_access
      eventlog: []
    confidence: medium
    references:
      - title: "MITRE ATT&CK data source DS0009: Process"
        url: https://attack.mitre.org/datasources/DS0009/
        accessed: "2026-11-02"
      - title: "MITRE ATT&CK data source DS0029: Network Traffic"
        url: https://attack.mitre.org/datasources/DS0029/
        accessed: "2026-11-02"

  - id: macos-endpoint-security
    name: macOS Endpoint Security events and the unified log
    kind: eventlog
    enable: >-
      A client of Apple's Endpoint Security framework - an EDR sensor, osquery
      with its es_process_events table, or Santa - subscribed to process exec,
      fork and exit. The unified log needs nothing switched on but records
      far less about an arbitrary process; it is the fallback, not the plan.
    default_state: >-
      The unified log is always on. Endpoint Security events exist only while a
      client is running and subscribed; a stock Mac has none.
    retention: >-
      Endpoint Security events live wherever the client sends them. The unified
      log prunes by size, age and entry type together, and on a busy laptop the
      persisted store covers days, not weeks - collect it with log collect, or
      from a disk image, early.
    volatility: rotating
    without_it: >-
      Process execution on a Mac. Roughly a third of this catalog's process
      rows name a macOS process, and nothing in the default install records that
      the agent binary, or the node and python interpreters that host most of
      these tools, ever ran.
    covers:
      classes:
        - process
      os:
        - macos
      sigma:
        - process_creation
      eventlog: []
    confidence: medium
    references:
      - title: Endpoint Security - Apple Developer Documentation
        url: https://developer.apple.com/documentation/endpointsecurity
        accessed: "2026-11-02"
      - title: ES_EVENT_TYPE_NOTIFY_EXEC - Apple Developer Documentation
        url: https://developer.apple.com/documentation/endpointsecurity/es_event_type_notify_exec
        accessed: "2026-11-02"
      - title: osquery schema (es_process_events)
        url: https://osquery.io/schema/
        accessed: "2026-11-02"
      - title: "Inside the Unified Log 3: log storage and attrition (The Eclectic Light Company)"
        url: https://eclecticlight.co/2025/09/29/inside-the-unified-log-3-log-storage-and-attrition/
        accessed: "2026-11-02"

  - id: linux-audit
    name: Linux auditd execve and Sysmon for Linux
    kind: eventlog
    enable: >-
      auditd with an execve rule for both syscall ABIs - the usual pair is
      -a always,exit -F arch=b64 -S execve and its arch=b32 twin - or Sysmon for
      Linux, which writes its Event ID 1 process creation records to syslog with
      the same fields as the Windows build. Either one logs every subprocess of
      every agent, so filter on the user or key rather than switching it off.
    default_state: >-
      auditd is installed on most server distributions and on few developer
      desktops, and ships with no execve rule either way. Sysmon for Linux is
      never present unless somebody installed it.
    retention: >-
      auditd rotates by size: max_log_file is small in every distribution's
      default configuration, and the compiled default for num_logs is zero,
      which is no rotation at all - distributions commonly set five. Sysmon for
      Linux inherits syslog's rotation, usually a week of dailies. Both are days
      on a host that runs a coding agent.
    volatility: rotating
    without_it: >-
      Process execution on Linux, where the self-hosted engines in this catalog
      - vLLM, Open WebUI, Langflow, n8n, Dify - actually run. Without it a
      container that spawned a shell left a process row in the catalog and no
      record on the host.
    covers:
      classes:
        - process
      os:
        - linux
      sigma:
        - process_creation
      eventlog: []
    confidence: medium
    references:
      - title: auditd.conf(5) - Linux manual page
        url: https://man7.org/linux/man-pages/man5/auditd.conf.5.html
        accessed: "2026-11-02"
      - title: Sysmon - Sysinternals (includes Sysmon for Linux)
        url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
        accessed: "2026-11-02"

  - id: shell-history
    name: Shell history - bash, zsh, fish and PSReadLine
    kind: file
    enable: >-
      Nothing. Every interactive shell writes it unless the user turned it off,
      which is exactly the first thing an intruder who knows the host does.
      PSReadLine keeps ConsoleHost_history.txt under the user's AppData; zsh and
      bash keep ~/.zsh_history and ~/.bash_history.
    default_state: >-
      On. macOS's system zshrc sets a 2000-line in-memory and 1000-line saved
      history; PowerShell's MaximumHistoryCount defaults to 4096 entries.
    retention: >-
      A fixed number of lines, not a period. A developer who lives in the
      terminal can roll a 1000-line zsh history in a day. Timestamps are present
      only if EXTENDED_HISTORY or HISTTIMEFORMAT was set beforehand.
    volatility: rotating
    without_it: >-
      How the agent was invoked, and by whom. claude --dangerously-skip-
      permissions, aider --yes and ollama serve are command lines, and on a host
      without process auditing the shell history is the only place they were
      ever written down.
    covers:
      classes:
        - process
      sigma: []
      eventlog: []
    confidence: medium
    references:
      - title: about_History (PowerShell) - MaximumHistoryCount
        url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_history
        accessed: "2026-11-02"
      - title: "zsh-users: macOS /etc/zshrc history defaults"
        url: https://www.zsh.org/mla/users/2025/msg00228.html
        accessed: "2026-11-02"

  - id: windows-execution-artifacts
    name: Windows execution artifacts - Prefetch, Amcache, SRUM
    kind: file
    enable: >-
      Nothing. These are side effects of running a program on Windows: Prefetch
      records the executable and its recent run times, Amcache its hash and
      first-seen, and SRUM per-application network bytes in hourly buckets.
      Prefetch is disabled on some server SKUs and on systems with it switched
      off for SSD reasons, so check the setting before concluding from silence.
    default_state: On for workstation editions.
    retention: >-
      Prefetch keeps a bounded number of recent executables and a busy
      developer host cycles through it in weeks. SRUM holds roughly thirty days
      and purges older data on the next boot. Amcache persists until the entry
      is overwritten.
    volatility: rotating
    without_it: >-
      Execution evidence on a Windows host that had no Sysmon and no 4688.
      Prefetch says the agent ran and when; SRUM says how much it talked to the
      network, per binary and per hour, which is the only host-side volume
      measure for a tool that uploads context.
    covers:
      classes:
        - process
        - network
      os:
        - windows
      sigma: []
      eventlog: []
    confidence: medium
    references:
      - title: "System Resource Usage Monitor (SRUM) - Digital Forensics Artifact Knowledge Base"
        url: https://artifacts-kb.readthedocs.io/en/latest/sources/windows/SystemResourceUsageMonitor.html
        accessed: "2026-11-02"
      - title: "System Resource Utilization Monitor (SANS ISC)"
        url: https://isc.sans.edu/diary/21927
        accessed: "2026-11-02"

  - id: network-egress-logs
    name: Network egress logs - proxy, DNS, firewall
    kind: network
    enable: >-
      A forward proxy, DNS resolver or firewall that logs per-connection with
      the hostname - SNI or the proxied Host header - and the source address.
      TLS-inspecting proxies also see the request path, which distinguishes a
      model call from a telemetry beacon to the same vendor.
    default_state: >-
      Enterprise networks usually have at least one of the three; home and
      hotspot networks, where much agent use happens, have none.
    retention: >-
      Set by the proxy or the SIEM it feeds, not by the host, and usually the
      longest-lived telemetry in the estate. The catch is coverage, not
      retention: a laptop off the corporate network leaves nothing here.
    volatility: rotating
    without_it: >-
      Which model endpoints the host talked to and how often, from a vantage
      point the host cannot tamper with. The catalog's network rows name the
      vendor endpoints; this is where a connection to an unexpected one - a
      local runtime pointed at a third-party API, an agent calling a
      non-default base URL - shows up for every host at once.
    covers:
      classes:
        - network
      sigma: []
      eventlog: []
    confidence: medium
    references:
      - title: "MITRE ATT&CK data source DS0029: Network Traffic"
        url: https://attack.mitre.org/datasources/DS0029/
        accessed: "2026-11-02"

  - id: container-runtime-logs
    name: Container runtime logs and layers
    kind: file
    enable: >-
      Nothing for the logs: Docker's default json-file driver captures each
      container's stdout and stderr under /var/lib/docker/containers/<id>/.
      The writable layer and named volumes hold the engine's own state and
      survive a container stop; they do not survive docker rm.
    default_state: >-
      On, with no rotation. The json-file driver's max-size defaults to
      unlimited and max-file to one, so the log grows until the disk fills or
      somebody deletes the container.
    retention: >-
      Until the container is removed, which is exactly what a remediation runbook
      does first. Collect the log file and the volume before anyone recreates
      the stack from compose.
    volatility: rotating
    without_it: >-
      The request log of a self-hosted engine. Open WebUI, vLLM, Langflow, n8n,
      Dify and Flowise are deployed as containers more often than not, and the
      container log is where their access and error output went.
    covers:
      classes:
        - disk
        - credential
      os:
        - docker
        - container
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: JSON File logging driver - Docker Docs
        url: https://docs.docker.com/engine/logging/drivers/json-file/
        accessed: "2026-11-02"

  - id: version-control-history
    name: Version control history - commits and reflog
    kind: file
    enable: >-
      Nothing. A coding agent's edits land in the working tree and, if it or the
      user committed, in the repository's history. Several agents add a trailer
      or a distinctive author to the commits they make, and the reflog records
      resets and rebases that rewrote what the agent did.
    default_state: On in every repository.
    retention: >-
      Commits persist until history is rewritten and garbage-collected. The
      reflog expires: ninety days for reachable entries and thirty for
      unreachable ones by default, so an agent's commit that was later reset
      away has a month before gc can drop it.
    volatility: rotating
    without_it: >-
      What the agent changed. The repo-scoped rows in this catalog - CLAUDE.md,
      .cursor/rules, .aider.chat.history.md, .mcp.json - are the instructions
      and transcripts; the history is the diff they produced, and in a supply-
      chain case it is the artifact.
    covers:
      classes: []
      locators:
        - repo
        - project
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: git-config documentation (gc.reflogExpire, gc.reflogExpireUnreachable)
        url: https://git-scm.com/docs/git-config
        accessed: "2026-11-02"

  - id: package-registry-logs
    name: Package manager caches and logs
    kind: file
    enable: >-
      Nothing. npm writes a debug log per invocation under the _logs directory
      of its cache and keeps the packages that npx fetched to run - which is how
      most MCP servers are started - in the same cache. pip and uv keep
      equivalent caches.
    default_state: On. npm keeps the ten most recent logs by default (logs-max).
    retention: >-
      Ten invocations for the logs, which on a host running several MCP servers
      is a single session. The cached packages persist until the cache is
      cleaned.
    volatility: rotating
    without_it: >-
      Which MCP server packages were actually fetched and run, as opposed to
      configured. The MCP config names a package; the npm cache holds the exact
      version that executed and the log records when it was installed - the
      evidence in a poisoned-server case.
    covers:
      classes: []
      hosts:
        - registry.npmjs.org
      sigma: []
      eventlog: []
    confidence: high
    references:
      - title: Logging - npm Docs
        url: https://docs.npmjs.com/cli/v10/using-npm/logging
        accessed: "2026-11-02"

  # ---- Provider-side logs -----------------------------------------------------
  # The host's record of a model call is a connection. The provider's record is
  # the request. These sources sit in somebody else's tenancy and are tied to
  # the catalog by the endpoints the network rows name.

  - id: anthropic-org-audit
    name: Anthropic organization audit logs and Compliance API
    kind: network
    enable: >-
      An Enterprise organization - the vendor's help centre states audit logs
      are available to Enterprise organizations only - and for programmatic
      access the Compliance API, which has to be enabled for the organization
      before a Compliance Access Key can be created. Every endpoint lives under
      /v1/compliance/ on api.anthropic.com. Team and individual plans have
      neither.
    default_state: >-
      Off for individual and Team plans. On an Enterprise organization the
      audit log is kept by Anthropic; the Compliance API is enabled on request.
    retention: >-
      The audit log can be exported for the past 180 days, per the vendor's
      help centre. Nothing says what happens to older entries, so pull the
      export or the Compliance API activity feed into your own store if the
      retention matters.
    volatility: rotating
    without_it: >-
      The account-side view of Claude Code, Claude Desktop and the API: which
      user authenticated, which API keys were created or revoked, which
      conversations and projects exist. The host shows a token file; only the
      provider shows what the token did.
    covers:
