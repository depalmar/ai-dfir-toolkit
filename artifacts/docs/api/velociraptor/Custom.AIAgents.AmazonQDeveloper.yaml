name: Custom.AIAgents.AmazonQDeveloper
description: |
  AWS coding assistant. Node-based language server (aws-lsp-codewhisperer). CodeWhisperer folded in 2024-04-30; IDE plugins EOL 2027-04-30.

  Generated from the AI agent artifact catalog (AIRT-0008). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\.vscode\extensions\amazonwebservices.amazon-q-vscode-*', 'C:\Users\*\.aws\amazonq\cli-agents\*.json', 'C:\Users\*\.aws\sso\cache\*.json', 'C:\Users\*\.aws\amazonq\mcp.json', 'C:\Users\*\.aws\amazonq\default.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.aws/amazonq/cli-agents/*.json', '/Users/*/.aws/sso/cache/*.json', '/Users/*/.aws/amazonq/mcp.json', '/Users/*/.aws/amazonq/default.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.aws/amazonq/cli-agents/*.json', '/home/*/.local/share/amazon-q/data.sqlite3', '/home/*/.local/share/amazon-q/settings.json', '/home/*/.aws/sso/cache/*.json', '/home/*/.aws/amazonq/mcp.json', '/home/*/.aws/amazonq/default.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
