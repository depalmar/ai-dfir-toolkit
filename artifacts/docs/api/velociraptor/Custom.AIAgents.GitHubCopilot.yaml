name: Custom.AIAgents.GitHubCopilot
description: |
  copilot-language-server binary + Copilot CLI. Agent mode runs multi-step tasks with tool calls; bundles a GitHub MCP server.

  Generated from the AI agent artifact catalog (AIRT-0003). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\.copilot\**', 'C:\Users\*\.copilot\mcp-config.json', 'C:\Users\*\.copilot\agents\*.agent.md', 'C:\Users\*\.vscode\extensions\github.copilot-*', 'C:\Users\*\.copilot\config.json', 'C:\Users\*\.copilot\mcp-oauth-config\**', 'C:\Users\*\.copilot\mcp-secrets\**', 'C:\Users\*\AppData\Local\github-copilot\apps.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.copilot/**', '/Users/*/.copilot/mcp-config.json', '/Users/*/.copilot/agents/*.agent.md', '/Users/*/.copilot/config.json', '/Users/*/.copilot/mcp-oauth-config/**', '/Users/*/.copilot/mcp-secrets/**', '/Users/*/.config/github-copilot/apps.json', '/Users/*/.config/github-copilot/hosts.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.copilot/**', '/home/*/.copilot/mcp-config.json', '/home/*/.copilot/agents/*.agent.md', '/home/*/.copilot/config.json', '/home/*/.copilot/mcp-oauth-config/**', '/home/*/.copilot/mcp-secrets/**', '/home/*/.config/github-copilot/apps.json', '/home/*/.config/github-copilot/hosts.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
