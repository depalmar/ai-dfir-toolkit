name: Custom.AIAgents.ZedAI
description: |
  Rust GPUI editor with a built-in Agent Panel and native MCP support. Settings are a single JSON file rather than a per-extension store, and MCP servers live in 

  Generated from the AI agent artifact catalog (AIRT-0050). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\AppData\Roaming\Zed\settings.json', 'C:\Users\*\AppData\Local\Zed\extensions', 'C:\Users\*\.config\zed\settings.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.config/zed/settings.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.config/zed/settings.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
