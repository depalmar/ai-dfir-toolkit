name: Custom.AIAgents.Cline
description: |
  VS Code extension ID saoudrizwan.claude-dev (formerly Claude Dev). Agentic file edit + terminal execution.

  Generated from the AI agent artifact catalog (AIRT-0039). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\AppData\Roaming\Code\User\globalStorage\saoudrizwan.claude-dev\settings\cline_mcp_settings.json', 'C:\Users\*\.cline\data\**']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json', '/Users/*/.cline/data/**']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.config/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json', '/home/*/.cline/data/**']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
