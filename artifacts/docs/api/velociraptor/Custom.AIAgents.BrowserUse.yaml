name: Custom.AIAgents.BrowserUse
description: |
  Python library giving LLM agents DOM-level browser control via Playwright.

  Generated from the AI agent artifact catalog (AIRT-0032). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\.config\browseruse\cloud_auth.json', 'C:\Users\*\.config\browseruse\config.json', 'C:\Users\*\.config\browseruse\profiles\default', 'C:\Users\*\.config\browseruse\gmail_credentials.json', 'C:\Users\*\.config\browseruse\gmail_token.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.config/browseruse/cloud_auth.json', '/Users/*/.config/browseruse/config.json', '/Users/*/.config/browseruse/profiles/default', '/Users/*/.config/browseruse/gmail_credentials.json', '/Users/*/.config/browseruse/gmail_token.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.config/browseruse/cloud_auth.json', '/home/*/.config/browseruse/config.json', '/home/*/.config/browseruse/profiles/default', '/home/*/.config/browseruse/gmail_credentials.json', '/home/*/.config/browseruse/gmail_token.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
