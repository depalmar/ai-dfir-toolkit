name: Custom.AIAgents.OpenWebUI
description: |
  Self-hosted web interface for local and remote LLMs, formerly Ollama WebUI. Multi-user with RBAC, RAG document ingestion, and a Tools/Functions system that exec

  Generated from the AI agent artifact catalog (AIRT-0042). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\AppData\Local\Programs\open-webui\**', 'C:\Users\*\AppData\Local\open-webui-updater\**', 'C:\Users\*\AppData\Roaming\open-webui\**', 'C:\Users\*\AppData\Roaming\open-webui\config.json', 'C:\Users\*\AppData\Roaming\open-webui\data\**', 'C:\Users\*\AppData\Roaming\open-webui\data\webui.db', 'C:\Users\*\AppData\Roaming\open-webui\data\uploads\**', 'C:\Users\*\AppData\Roaming\open-webui\data\vector_db\**', 'C:\Users\*\AppData\Roaming\open-webui\data\.key']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/app/backend/data/**', '/app/backend/data/webui.db', '/app/backend/data/.webui_secret_key', '/app/backend/data/config.json', '/app/backend/data/uploads/ and vector store directory']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
