name: Custom.AIAgents.Credentials
description: |
  Plaintext credential stores written by AI agents and LLM runtimes. Treat the output as credential material.

  Generated from the AI agent artifact catalog (multiple entries). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\.aider\oauth-keys.env', 'C:\Users\*\.autogenstudio\.env', 'C:\Users\*\.autogenstudio\database.sqlite', 'C:\Users\*\.aws\sso\cache\*.json', 'C:\Users\*\.claude.json', 'C:\Users\*\.claude\.credentials.json', 'C:\Users\*\.codeium\config.json', 'C:\Users\*\.codeium\windsurf\mcp_config.json', 'C:\Users\*\.codex\auth.json', 'C:\Users\*\.config\browseruse\cloud_auth.json', 'C:\Users\*\.config\browseruse\config.json', 'C:\Users\*\.config\browseruse\gmail_credentials.json', 'C:\Users\*\.config\browseruse\gmail_token.json', 'C:\Users\*\.config\browseruse\profiles\default', 'C:\Users\*\.config\goose\secrets.yaml', 'C:\Users\*\.continue\.env', 'C:\Users\*\.continue\auth.json', 'C:\Users\*\.continue\config.json', 'C:\Users\*\.continue\config.yaml', 'C:\Users\*\.copilot\config.json', 'C:\Users\*\.copilot\mcp-oauth-config\**', 'C:\Users\*\.copilot\mcp-secrets\**', 'C:\Users\*\.cursor\mcp.json', 'C:\Users\*\.flowise\database.sqlite', 'C:\Users\*\.flowise\encryption.key', 'C:\Users\*\.gemini\.env', 'C:\Users\*\.gemini\google_accounts.json', 'C:\Users\*\.gemini\oauth_creds.json', 'C:\Users\*\.mcp_auth\**', 'C:\Users\*\.n8n\database.sqlite', 'C:\Users\*\.ollama\id_ed25519', 'C:\Users\*\.openhands\agent_settings.json', 'C:\Users\*\.openhands\secrets.json', 'C:\Users\*\.openhands\settings.json', 'C:\Users\*\.openinterpreter\.credentials.json', 'C:\Users\*\.openinterpreter\auth.json', 'C:\Users\*\.openinterpreter\secrets\codex_auth.age', 'C:\Users\*\.openinterpreter\secrets\local.age', 'C:\Users\*\.openinterpreter\secrets\mcp_oauth.age', 'C:\Users\*\.skyvern\.env', 'C:\Users\*\.skyvern\credential_vault\.fernet_key', 'C:\Users\*\.skyvern\credential_vault\creditem_*.bin', 'C:\Users\*\.skyvern\data.db', 'C:\Users\*\.supermaven\config.json', 'C:\Users\*\AppData\Local\github-copilot\apps.json', 'C:\Users\*\AppData\Local\open-interpreter\open-interpreter\profiles\default.yaml', 'C:\Users\*\AppData\Roaming\Claude\**', 'C:\Users\*\AppData\Roaming\Cursor\User\globalStorage\state.vscdb', 'C:\Users\*\AppData\Roaming\Windsurf\User\globalStorage\state.vscdb', 'C:\Users\*\AppData\Roaming\com.LangflowDesktop\data\database.db', 'C:\Users\*\AppData\Roaming\open-webui\data\.key', 'C:\Users\*\AppData\Roaming\open-webui\data\webui.db']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.aider/oauth-keys.env', '/Users/*/.anthropic/api_key', '/Users/*/.autogenstudio/.env', '/Users/*/.autogenstudio/database.sqlite', '/Users/*/.aws', '/Users/*/.aws/sso/cache/*.json', '/Users/*/.claude.json', '/Users/*/.codeium/config.json', '/Users/*/.codeium/windsurf/mcp_config.json', '/Users/*/.codex/auth.json', '/Users/*/.config/anthropic/configs/**', '/Users/*/.config/browseruse/cloud_auth.json', '/Users/*/.config/browseruse/config.json', '/Users/*/.config/browseruse/gmail_credentials.json', '/Users/*/.config/browseruse/gmail_token.json', '/Users/*/.config/browseruse/profiles/default', '/Users/*/.config/gcloud/application_default_credentials.json', '/Users/*/.config/github-copilot/apps.json', '/Users/*/.config/github-copilot/hosts.json', '/Users/*/.config/goose/secrets.yaml', '/Users/*/.config/open-interpreter/profiles/default.yaml', '/Users/*/.continue/.env', '/Users/*/.continue/auth.json', '/Users/*/.continue/config.json', '/Users/*/.continue/config.yaml', '/Users/*/.copilot/config.json', '/Users/*/.copilot/mcp-oauth-config/**', '/Users/*/.copilot/mcp-secrets/**', '/Users/*/.cursor/mcp.json', '/Users/*/.flowise/database.sqlite', '/Users/*/.flowise/encryption.key', '/Users/*/.gemini/.env', '/Users/*/.gemini/google_accounts.json', '/Users/*/.gemini/oauth_creds.json', '/Users/*/.langflow/data/database.db', '/Users/*/.mcp_auth/**', '/Users/*/.n8n/database.sqlite', '/Users/*/.ollama/id_ed25519', '/Users/*/.openinterpreter/.credentials.json', '/Users/*/.openinterpreter/auth.json', '/Users/*/.openinterpreter/secrets/codex_auth.age', '/Users/*/.openinterpreter/secrets/local.age', '/Users/*/.openinterpreter/secrets/mcp_oauth.age', '/Users/*/.skyvern/.env', '/Users/*/.skyvern/credential_vault/.fernet_key', '/Users/*/.skyvern/credential_vault/creditem_*.bin', '/Users/*/.skyvern/data.db', '/Users/*/.supermaven/config.json', '/Users/*/Library/Application Support/Claude/**', '/Users/*/Library/Application Support/Cursor/User/globalStorage/state.vscdb', '/Users/*/Library/Application Support/Windsurf/User/globalStorage/state.vscdb', '/Users/*/Library/Application Support/open-interpreter/profiles/default.yaml']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/.openhands/secrets.json', '/.openhands/settings.json', '/app/backend/data/.webui_secret_key', '/home/*/.aider/oauth-keys.env', '/home/*/.anthropic/api_key', '/home/*/.autogenstudio/.env', '/home/*/.autogenstudio/database.sqlite', '/home/*/.aws', '/home/*/.aws/sso/cache/*.json', '/home/*/.claude.json', '/home/*/.claude/.credentials.json', '/home/*/.codeium/config.json', '/home/*/.codeium/windsurf/mcp_config.json', '/home/*/.codex/auth.json', '/home/*/.config/Claude/**', '/home/*/.config/Cursor/User/globalStorage/state.vscdb', '/home/*/.config/TabNine/.refresh_token_v2', '/home/*/.config/Windsurf/User/globalStorage/state.vscdb', '/home/*/.config/anthropic/configs/**', '/home/*/.config/browseruse/cloud_auth.json', '/home/*/.config/browseruse/config.json', '/home/*/.config/browseruse/gmail_credentials.json', '/home/*/.config/browseruse/gmail_token.json', '/home/*/.config/browseruse/profiles/default', '/home/*/.config/cursor/auth.json', '/home/*/.config/gcloud/application_default_credentials.json', '/home/*/.config/github-copilot/apps.json', '/home/*/.config/github-copilot/hosts.json', '/home/*/.config/goose/secrets.yaml', '/home/*/.config/open-interpreter/profiles/default.yaml', '/home/*/.continue/.env', '/home/*/.continue/auth.json', '/home/*/.continue/config.json', '/home/*/.continue/config.yaml', '/home/*/.copilot/config.json', '/home/*/.copilot/mcp-oauth-config/**', '/home/*/.copilot/mcp-secrets/**', '/home/*/.cursor/mcp.json', '/home/*/.flowise/database.sqlite', '/home/*/.flowise/encryption.key', '/home/*/.gemini/.env', '/home/*/.gemini/google_accounts.json', '/home/*/.gemini/oauth_creds.json', '/home/*/.mcp_auth/**', '/home/*/.n8n/database.sqlite', '/home/*/.ollama/id_ed25519', '/home/*/.openhands/agent_settings.json', '/home/*/.openhands/secrets.json', '/home/*/.openhands/settings.json', '/home/*/.openinterpreter/.credentials.json', '/home/*/.openinterpreter/auth.json', '/home/*/.openinterpreter/secrets/codex_auth.age', '/home/*/.openinterpreter/secrets/local.age', '/home/*/.openinterpreter/secrets/mcp_oauth.age', '/home/*/.skyvern/.env', '/home/*/.skyvern/credential_vault/.fernet_key', '/home/*/.skyvern/credential_vault/creditem_*.bin', '/home/*/.skyvern/data.db', '/home/*/.supermaven/config.json', '/home/*/Library/Application Support/open-interpreter/profiles/default.yaml']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
