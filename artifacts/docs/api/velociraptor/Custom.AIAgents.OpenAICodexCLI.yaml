name: Custom.AIAgents.OpenAICodexCLI
description: |
  Terminal coding agent installed via npm @openai/codex (also Homebrew cask / winget). Binary `codex`. Reads AGENTS.md.

  Generated from the AI agent artifact catalog (AIRT-0036). Every glob below is
  derived from a location the catalog has already verified.
author: AI Agent Artifact Catalog (ai-dfir-toolkit)
type: CLIENT
parameters:
  - name: Upload
    description: Upload matching files rather than only recording their metadata.
    type: bool
    default: "N"
sources:
  - name: Windows
    precondition: |
      SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET Globs = ['C:\Users\*\.codex\config.toml', 'C:\Users\*\.codex\history.jsonl', 'C:\Users\*\.codex\sessions\YYYY\MM\DD\rollout-*.jsonl', 'C:\Users\*\.codex\logs\codex-tui.log', 'C:\Users\*\.codex\auth.json']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Macos
    precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET Globs = ['/Users/*/.codex/config.toml', '/Users/*/.codex/history.jsonl', '/Users/*/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl', '/Users/*/.codex/logs/codex-tui.log', '/Users/*/.codex/auth.json', '/etc/codex/config.toml']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
  - name: Linux
    precondition: |
      SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET Globs = ['/home/*/.codex/config.toml', '/home/*/.codex/history.jsonl', '/home/*/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl', '/home/*/.codex/logs/codex-tui.log', '/home/*/.codex/auth.json', '/etc/codex/config.toml']
      LET Hits = SELECT OSPath, Size, Mode.String AS Mode, Mtime, Btime, Ctime
        FROM glob(globs=Globs)
        WHERE NOT IsDir
      SELECT *, if(condition=Upload, then=upload(file=OSPath)) AS Upload
      FROM Hits
