# ForensicArtifacts-format export, generated from the catalog.
# Spec: https://github.com/ForensicArtifacts/artifacts
# Consumable by Plaso, GRR, and Timesketch. Do not hand-edit - regenerate with
# scripts/export_forensicartifacts.py after changing catalog/*.yml.
# Only high-forensic-value file artifacts are exported; registry, network, and
# process artifacts have no clean equivalent in the FILE source type.
---
name: AiderArtifacts
doc: Aider (AIRT-0004) - Python pair-programming agent operating directly on git repos.
  Auto-commits changes.
sources:
- type: FILE
  attributes:
    paths:
    - '%%users.homedir%%/.aider.conf.yml'
    - '%%users.homedir%%/.aider/oauth-keys.env'
    separator: /
  supported_os:
