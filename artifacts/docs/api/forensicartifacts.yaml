name: OpenWebuiArtifacts
doc: Open WebUI (AIRT-0042) - Self-hosted web interface for local and remote LLMs,
  formerly Ollama WebUI. Multi-user with RBAC, RAG document ingestion, and a Tools/Functions
  system that executes Python. Usually deployed via Docker; also installable via pip.
sources:
- type: FILE
  attributes:
    paths:
    - /app/backend/data/.webui_secret_key
    - /app/backend/data/config.json
    - /app/backend/data/uploads/ and vector store directory
    - /app/backend/data/webui.db
    - Tools and Functions Python source stored in webui.db
    - WEBUI_ADMIN_EMAIL / WEBUI_ADMIN_PASSWORD / WEBUI_ADMIN_NAME
    - docker-compose.yml / docker run invocation
    separator: /
  supported_os:
  - Linux
supported_os:
- Linux
urls:
- https://docs.openwebui.com/getting-started/advanced-topics/hardening/
- https://docs.openwebui.com/getting-started/quick-start/
- https://docs.openwebui.com/features/authentication-access/rbac/roles/
