# AI agent artifact catalog entry
# AIRT-0009 - Tabnine
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0009
name: Tabnine
vendor: Tabnine
category: code-completion
description: Completion + agent platform. Editor plugin spawns and supervises a downloaded platform-specific binary.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud, self-hosted, or fully local
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: medium
confidence: medium
abuse_potential: binary_path is configurable = binary substitution risk. Self-hosted deployment adds K8s/Helm footprint.
artifacts:
  disk:
    - path: ~/.tabnine/agent/settings.json
      os:
        - windows
        - macos
        - linux
      artifact_type: agent-definition
      description: User scope
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: IDE plugin
      confidence: high
    - path: "<repo>/.tabnine/agent/settings.json"
      os:
        - windows
        - macos
        - linux
      artifact_type: agent-definition
      description: Project scope - overrides user
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: high
    - path: Downloaded per-platform Tabnine binary (binary_path configurable)
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Binary substitution risk
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: IDE plugin
      confidence: high
    - path: TABNINE_CLI_SYSTEM_SETTINGS_PATH / TABNINE_CLI_SYSTEM_DEFAULTS_PATH
      os:
        - windows
        - macos
        - linux
      artifact_type: env-var
      description: Env var config hijack vector
      forensic_value: medium
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
  network:
    - direction: egress
      indicator: api.tabnine.com, update.tabnine.com
      port: 443/TCP
      description: Optional OTLP telemetry endpoint is configurable
      confidence: medium
  process:
    - name: TabNine.exe / TabNine-deep-local.exe
      os:
        - windows
      typical_parent: Code.exe
      typical_children: "-"
      service_or_daemon: "No"
      persistence: None
      confidence: medium
  registry:
    - key: "HKCU\\Environment"
      value: TABNINE_CLI_SYSTEM_SETTINGS_PATH, TABNINE_CLI_SYSTEM_DEFAULTS_PATH
      type: REG_SZ
      description: >-
        Both redirect Tabnine to settings files outside the default location
      forensic_value: medium
      persistence: false
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with TabNine.exe / TabNine-deep-local.exe"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: ~/.config/TabNine/.refresh_token_v2
    os: [linux, container]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext refresh token. Written and read by Tabnine's own VS Code extension
      (TABNINE_TOKEN_FILE_PATH = TABNINE_CONFIG_DIR + '.refresh_token_v2', where
      TABNINE_CONFIG_DIR = homedir/.config/TabNine). The cloud-environment code path
      also syncs this token into VS Code globalState under key TABNINE_TOKEN_V2, so a
      Codespaces/Gitpod host has it in two places.
    confidence: high
mcp:
  - mechanism: "config-file"
    config_path: "<repo>/.tabnine/mcp_servers.json"
    config_key: "mcpServers"
    spawn_mechanism: "Child process for a stdio server when the agent starts"
    secrets_location: "env block (plaintext)"
    persistence_trigger: "Every agent start - the vendor notes MCP changes need a CLI restart"
    triage_priority: "p1"
    confidence: "medium"
    notes: "Project-scoped, so it travels with the repo. A project folder has to be open for the list to load, which means the file is only live for whoever opens that clone."
  - mechanism: "config-file"
    config_path: "~/.tabnine/mcp_servers.json"
    config_key: "mcpServers"
    spawn_mechanism: "Child process for a stdio server when the agent starts"
    secrets_location: "env block (plaintext)"
    persistence_trigger: "Every agent start"
    triage_priority: "p1"
    confidence: "medium"
    notes: "Collect alongside the already-catalogued ~/.tabnine/agent/settings.json, which records whether the server is actually enabled. Tabnine also ships team-level MCP governance, so an enterprise policy may permit or deny entries this file names."
collection:
  triage_priority: p2
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: Tabnine
  velociraptor_artifact: Custom.AIAgents.Tabnine
atlas_techniques:
  - AML.T0024
attack_techniques:
  - T1071.001
  - T1105
references:
  - title: "Tabnine documentation"
    url: https://docs.tabnine.com/main
    accessed: "2026-08-13"
  - title: "Tabnine docs - understanding MCP servers"
    url: https://docs.tabnine.com/main/getting-started/tabnine-agent/mcp-intro-and-setup
    accessed: "2026-08-13"
  - title: "Tabnine docs - MCP governance"
    url: https://docs.tabnine.com/main/administering-tabnine/managing-your-team/settings/mcp-governance
    accessed: "2026-08-13"
