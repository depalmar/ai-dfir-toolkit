# AI agent artifact catalog entry
# AIRT-0030 - Flowise
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0030
name: Flowise
vendor: FlowiseAI (OSS)
category: workflow-engine
description: Drag-and-drop LangChain flow builder. Default port 3000, flows persisted to local DB.
supported_os:
  - linux
  - windows
  - docker
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: medium
abuse_potential: Custom Function node executes arbitrary JS. Historically shipped with weak/no default auth - frequently found exposed.
artifacts:
  network:
    - direction: listener
      indicator: Flowise UI + prediction API
      port: 3000/TCP
      description: Frequently found internet-exposed
      confidence: medium
      default_bind: "0.0.0.0"
      authentication: Weak/optional historically
      exposure_risk: high
  process:
    - name: node (flowise)
      os:
        - windows
        - macos
        - linux
      typical_parent: systemd / dockerd / npx
      typical_children: node
      service_or_daemon: Optional
      persistence: pm2 / systemd / Docker
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (node (flowise)) and CommandLine contains flowise"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: ~/.flowise/encryption.key
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: encryption-key
    description: >-
      Plaintext AES key file, auto-generated on first run if absent. Decrypts every
      credential in the Flowise credential table (all stored LLM provider and
      third-party tool API keys). Overridden by SECRETKEY_PATH (key file moves to
      <SECRETKEY_PATH>/encryption.key) or by FLOWISE_SECRETKEY_OVERWRITE (no key file at
      all). Note the source also probes several encryption.key locations relative to the
      install dir before falling back to the home directory, so on a git-clone install
      check <install>/packages/server/encryption.key too.
    confidence: high
  - location: /home/node/.flowise/encryption.key
    os: [docker]
    storage: plaintext
    secret_type: encryption-key
    description: >-
      Plaintext AES key inside the official container image, where SECRETKEY_PATH is set
      to /home/node/.flowise. The official compose file bind-mounts host ~/.flowise to
      this path, so the key is readable on the host at ~/.flowise/encryption.key even
      for containerised deployments.
    confidence: high
  - location: ~/.flowise/database.sqlite
    os: [windows, macos, linux]
    storage: sqlite
    secret_type: api-key
    description: >-
      Default SQLite store (DATABASE_PATH, defaults to ~/.flowise). Holds the credential
      table - third-party LLM and tool API keys, AES-encrypted with encryption.key - and
      the login_sessions table used by the Passport session store. Ciphertext only, but
      the decrypting key sits in the same directory. Flow definitions stored here can
      also embed secrets inline.
    confidence: high
  - location: FLOWISE_SECRETKEY_OVERWRITE
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: encryption-key
    description: >-
      Plaintext env var holding the credential-encryption key directly, used instead of
      the key stored at SECRETKEY_PATH. When this is set there is no encryption.key file
      to collect - the key is only in the process environment and in whatever compose
      file or shell profile set it.
    confidence: high
  - location: '<install>/docker/.env'
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: embedded-credentials
    description: >-
      Plaintext env file in the compose working directory. Holds
      FLOWISE_SECRETKEY_OVERWRITE, SECRETKEY_AWS_ACCESS_KEY / SECRETKEY_AWS_SECRET_KEY,
      JWT_AUTH_TOKEN_SECRET, JWT_REFRESH_TOKEN_SECRET, EXPRESS_SESSION_SECRET,
      TOKEN_HASH_SECRET, DATABASE_PASSWORD, REDIS_PASSWORD, SMTP_PASSWORD, and
      S3/Azure/GCS storage credentials.
    confidence: high
  - location: JWT_AUTH_TOKEN_SECRET
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: jwt-signing-key
    description: >-
      Plaintext env var signing the auth JWT that Flowise stores in an HTTP-only cookie
      (v3.0.1+ Passport auth). JWT_REFRESH_TOKEN_SECRET, EXPRESS_SESSION_SECRET and
      TOKEN_HASH_SECRET sit alongside it and are equivalent in value. Disclosure allows
      forging an authenticated session against the instance.
    confidence: high
  - location: '<install>/packages/server/.env'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: admin-credential
    description: >-
      Plaintext app-level auth credentials FLOWISE_USERNAME / FLOWISE_PASSWORD, in the
      .env under packages/server. This is the deprecated pre-v3.0.1 auth mechanism: it
      is documented by the vendor and still present on the many older deployments in the
      wild, but no longer referenced anywhere in current main. Treat a hit here as an
      indicator the instance predates 3.0.1.
    confidence: medium
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  velociraptor_artifact: Custom.AIAgents.Flowise
atlas_techniques:
  - AML.T0053
  - AML.T0081
  - AML.T0086
attack_techniques:
  - T1059
  - T1133
  - T1543
references:
  - title: "FlowiseAI/Flowise"
    url: https://github.com/FlowiseAI/Flowise
    accessed: "2026-08-13"
  - title: "Flowise getting started"
    url: https://docs.flowiseai.com/getting-started
    accessed: "2026-08-13"
