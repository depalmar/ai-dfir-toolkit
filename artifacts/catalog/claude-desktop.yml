    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start (+ Run key)
    triage_priority: p1
    notes: >-
      Used by the EXE installer, and by Store builds declaring
      unvirtualizedResources. Check this path first on either install shape.
  - mechanism: config-file
    config_path: "%LOCALAPPDATA%\\Packages\\Claude_pzs8sxrjxfjjc\\LocalCache\\Roaming\\Claude\\claude_desktop_config.json"
    config_key: mcpServers
    spawn_mechanism: Child process at app launch
    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start
    triage_priority: p1
    notes: >-
      Container-redirected path, present only on packaged builds that do not
