id: AIRT-0011
name: Claude Desktop (MCP host)
aliases:
  - Claude Desktop
  - claude-desktop
  - Claude
vendor: Anthropic
category: mcp-host
description: Desktop chat client that launches arbitrary local MCP servers at app start per claude_desktop_config.json. Bundles a Node.js runtime.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local MCP server exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: The key persistence+execution primitive. Any mcpServers entry silently spawns a child process with inherited env on every app launch.
artifacts:
  disk:
    - path: ~/Library/Application Support/Claude/claude_desktop_config.json
      os:
        - macos
      artifact_type: mcp-config
      description: Primary execution primitive
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: DMG
      confidence: high
    - path: "%APPDATA%\\Claude\\claude_desktop_config.json"
      os:
        - windows
      artifact_type: mcp-config
      description: Primary execution primitive
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: EXE installer
      confidence: high
    - path: "%LOCALAPPDATA%\\Packages\\Claude_pzs8sxrjxfjjc\\LocalCache\\Roaming\\Claude\\claude_desktop_config.json"
      os:
        - windows
      artifact_type: mcp-config
      description: Container-redirected path, absent on builds declaring unvirtualizedResources
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: MS Store
      unverified: true
      confidence: low
    - path: ~/.config/Claude/claude_desktop_config.json
      os:
        - linux
      artifact_type: mcp-config
      description: Primary execution primitive
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: deb/AppImage
      confidence: high
    - path: "*.mcpb (Desktop Extension)"
      os:
        - windows
        - macos
        - linux
      artifact_type: extension-bundle
      description: ZIP archive containing server code + manifest - unpack and review
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: high
    - path: "%APPDATA%\\Claude\\logs\\mcp*.log"
      os:
        - windows
      artifact_type: log
      description: "MCP server stdout/stderr, one file per server as mcp-server-<name>.log"
      forensic_value: high
      evidence_type:
        - timeline
        - execution
      install_method: n/a
      confidence: high
    - path: "~/Library/Logs/Claude/mcp*.log"
      os:
        - macos
      artifact_type: log
      description: MCP server stdout/stderr
      forensic_value: high
      evidence_type:
        - timeline
        - execution
      install_method: n/a
      confidence: medium
  registry:
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Claude"
      value: InstallLocation, DisplayVersion
      type: REG_SZ
      description: >-
        Install metadata for the EXE installer. A Store install creates no
        uninstall key at all, so absence here does not mean the app is absent -
        query Get-AppxPackage before concluding.
      persistence: false
      forensic_value: medium
      unverified: true
      confidence: low
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
      value: Claude
      type: REG_SZ
      description: >-
        Auto-start, which launches every configured MCP server on login. The
        Store build checked carried no Claude value under Run, which is equally
        consistent with the launch-at-login setting being off, so absence here
        is not evidence against the mechanism.
      persistence: true
      forensic_value: high
      confidence: medium
    - key: "HKCU\\Software\\Classes\\claude\\shell\\open\\command"
      value: (Default)
      type: REG_SZ
      description: >-
        The claude:// protocol handler, and a deep-link vector. On a Store
        install its default value is the full WindowsApps path, which yields the
        package full name and version without querying the package manager.
      persistence: true
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Software\\Classes\\ActivatableClasses\\Package\\Claude_pzs8sxrjxfjjc*"
      value: "-"
      type: Key
      description: >-
        Store package registration. The parent ActivatableClasses\Package key
        did not exist under HKCU on the Store install checked, so this location
        is not a reliable indicator of a packaged Claude Desktop.
      persistence: false
      forensic_value: medium
      unverified: true
      confidence: low
  network:
    - direction: egress
      indicator: api.anthropic.com, claude.ai
      port: 443/TCP
      description: Plus any egress initiated by child MCP servers
      confidence: high
    - direction: egress-(indirect)
      indicator: registry.npmjs.org (npx MCP server fetch)
      port: 443/TCP
      description: "npx @scope/server@latest pulls and executes code at every launch - supply-chain risk"
      confidence: high
  process:
    - name: Claude.exe
      os:
        - windows
      typical_parent: explorer.exe
      typical_children: node.exe, npx.cmd, python.exe, docker.exe, uvx
      service_or_daemon: "No"
      persistence: >-
        Run key on installs that register one, which launches every configured
        MCP server at login. The Store build checked registered none.
      confidence: high
    - name: Claude
      os:
        - macos
      typical_parent: launchd
      typical_children: node, npx, python3, docker
      service_or_daemon: "No"
      persistence: LaunchAgent (login items)
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with Claude.exe"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: 'claude_desktop_config.json -> mcpServers.<name>.env'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: embedded-credentials
    description: >-
      Plaintext third-party API keys, PATs and tokens embedded in MCP server
      definitions, in a JSON file readable by any process running as the user. Same four
      per-OS paths already listed in artifacts.disk, including the MSIX virtualized
      %LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\... Path. Treat every literal value
      as an exposed credential and rotate.
    confidence: high
  - location: '~/Library/Application Support/Claude/'
    os: [macos]
    storage: encrypted
    secret_type: oauth-token
    description: OAuth token ciphertext, encrypted under Keychain
    confidence: medium
  - location: '%APPDATA%\Claude\'
    os: [windows]
    storage: encrypted
    secret_type: oauth-token
    description: OAuth token ciphertext, encrypted under DPAPI
    confidence: medium
  - location: '~/.config/Claude/'
    os: [linux]
    storage: encrypted
    secret_type: oauth-token
    description: OAuth token ciphertext in the application-data directory
    confidence: medium
