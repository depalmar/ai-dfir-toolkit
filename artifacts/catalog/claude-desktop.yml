    - path: "/Applications/Claude.app"
      os:
        - macos
      artifact_type: install-dir
      description: >-
        System-folder install, and the documented default - "Claude Desktop
        installs to /Applications and updates automatically". Updating from here
        needs administrator access and write permission to /Applications and
        Claude.app, which is the difference that decides where an estate puts it.
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: pkg (recommended for enterprise) or dmg
      confidence: high
    - path: "~/Applications/Claude.app"
      os:
        - macos
      artifact_type: install-dir
      description: >-
        User-folder install, documented alongside the system one because users
        can update it without administrator privileges. A sweep that only checks
        /Applications reports the tool absent on every host that took this route.
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: pkg (recommended for enterprise) or dmg
      confidence: high
    - path: "~/Library/Preferences/com.anthropic.claudefordesktop.plist"
      os:
        - macos
      artifact_type: config-file
      description: >-
        Preference domain, and the MDM configuration surface. The vendor
        documents the domain itself verbatim - "Claude Desktop reads preferences
        from the domain com.anthropic.claudefordesktop" - for writing enterprise
        profiles. What the vendor does not state is that the domain is also the
        bundle identifier; the Homebrew cask uses it that way and names a helper
        com.anthropic.claudefordesktop.helper, but that equivalence and the
        helper string are third-party. The plist path follows macOS convention
        from the documented domain rather than from the vendor page, so confirm
        it on a Mac before keying collection on it, and expect an
        MDM-managed host to carry the profile under /Library/Managed Preferences
        instead.
      forensic_value: medium
      evidence_type:
        - configuration
        - program-presence
      install_method: pkg (recommended for enterprise) or dmg
      unverified: true
      confidence: medium
  registry:
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Claude"
      value: InstallLocation, DisplayVersion
      type: REG_SZ
      description: >-
        Install metadata for the EXE installer. A packaged MSIX install creates no
        uninstall key at all, so absence here does not mean the app is absent -
        query Get-AppxPackage before concluding.
      persistence: false
      forensic_value: medium
      unverified: true
      confidence: low
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
      value: Claude
      type: REG_SZ
      description: >-
        Auto-start, which launches every configured MCP server on login. The MSIX
        build checked carried no Claude value under Run, which is equally
        consistent with the launch-at-login setting being off, so absence here
        is not evidence against the mechanism.
      persistence: true
      forensic_value: high
      confidence: medium
    - key: "HKCU\\Software\\Classes\\claude\\shell\\open\\command"
      value: (Default)
      type: REG_SZ
      description: >-
        The claude:// protocol handler, and a deep-link vector. On an MSIX
        install its default value is the full WindowsApps path, which yields the
        package full name and version without querying the package manager.
      persistence: true
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Software\\Classes\\ActivatableClasses\\Package\\Claude_pzs8sxrjxfjjc*"
      value: "-"
      type: Key
      description: >-
        Packaged app registration. The parent ActivatableClasses\Package key
        did not exist under HKCU on the MSIX install checked, so this location
        is not a reliable indicator of a packaged Claude Desktop.
      persistence: false
      forensic_value: medium
      unverified: true
      confidence: low
  network:
    - direction: egress
      indicator: api.anthropic.com, claude.ai
      port: 443/TCP
      description: Plus any egress initiated by child MCP servers
      confidence: high
    - direction: egress-(indirect)
      indicator: registry.npmjs.org (npx MCP server fetch)
      port: 443/TCP
      description: "npx @scope/server@latest pulls and executes code at every launch - supply-chain risk"
      confidence: high
  process:
    - name: Claude.exe
      os:
        - windows
      typical_parent: explorer.exe
      typical_children: node.exe, npx.cmd, python.exe, docker.exe, uvx
      service_or_daemon: "No"
      persistence: >-
        Run key on installs that register one, which launches every configured
        MCP server at login. The MSIX build checked registered none.
      confidence: high
    - name: Claude
      os:
        - macos
      typical_parent: launchd
      typical_children: node, npx, python3, docker
      service_or_daemon: "No"
      persistence: LaunchAgent (login items)
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with Claude.exe"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
