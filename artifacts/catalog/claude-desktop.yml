mcp:
  - mechanism: config-file
    config_path: "%APPDATA%\\Claude\\claude_desktop_config.json"
    config_key: "mcpServers.<name>.command + .args"
    spawn_mechanism: Child process at app launch
    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start (+ Run key)
    triage_priority: p1
    notes: >-
      Vendor-documented path, and the live config on a host where it predates a
      later MSIX install. Not authoritative by itself - see the container row.
  - mechanism: config-file
    config_path: "%LOCALAPPDATA%\\Packages\\Claude_pzs8sxrjxfjjc\\LocalCache\\Roaming\\Claude\\claude_desktop_config.json"
    config_key: mcpServers
    spawn_mechanism: Child process at app launch
    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start
    triage_priority: p1
    notes: >-
      MSIX container copy. Precedence is decided per file by install history,
      not by a global switch: the OS opens the container copy first and falls
      back to real AppData, and a file that already existed in AppData before
      the packaged install stays unvirtualized. So this is the live config on a
      host where the packaged build created it fresh, and dormant on a host that
      had it already. Collect both, and the manifest from WindowsApps, then
      resolve precedence per host. Container copies survive uninstall.
  - mechanism: config-file
    config_path: ~/Library/Application Support/Claude/claude_desktop_config.json
    config_key: mcpServers
    spawn_mechanism: Child process at app launch
    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start (LaunchAgent)
    triage_priority: p1
    notes: ""
  - mechanism: config-file
    config_path: ~/.config/Claude/claude_desktop_config.json
    config_key: mcpServers
    spawn_mechanism: Child process at app launch
    secrets_location: "mcpServers.<name>.env"
    persistence_trigger: Every app start
    triage_priority: p1
    notes: ""
  - mechanism: config-file
    config_path: "*.mcpb / *.dxt bundle files"
    config_key: manifest.json inside archive
    spawn_mechanism: Installed then spawned
    secrets_location: manifest user_config
    persistence_trigger: Every app start
    triage_priority: p1
    notes: ZIP archive - unpack and review server code before trusting
collection:
