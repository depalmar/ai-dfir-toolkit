# AI agent artifact catalog entry
# AIRT-0045 - vLLM
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0045
name: vLLM
vendor: vLLM project (PyPI, OSS)
category: llm-runtime
description: High-throughput inference and serving engine for LLMs. `vllm serve` exposes an OpenAI-compatible HTTP API, which is how it is normally deployed.
supported_os:
  - linux
  - docker
execution_model: Local inference server (OpenAI-compatible HTTP API)
capabilities:
  local_code_execution: false
  local_listener: true
  plaintext_credentials: true
  mcp_capable: false
risk: high
confidence: high
abuse_potential: >-
  The server has no authentication unless an API key is set, and binds 0.0.0.0 by
  default, so an instance reachable from anywhere is usable by anyone who finds it -
  for free inference, for model theft via the served weights, and as a cost-based
  denial of service through large max_tokens requests. CVE-2025-32444 (Mooncake
  integration) allowed unauthenticated remote code execution.
artifacts:
  disk:
    - path: "~/.cache/vllm"
      os:
        - linux
      artifact_type: data-dir
      description: >-
        VLLM_CACHE_ROOT default. Compiled kernels and the torch.compile cache. Its mtime
        dates the first successful model load, which is often the only timestamp placing
        the server on the host.
      forensic_value: medium
      evidence_type:
        - program-presence
        - timeline
      install_method: pip install vllm
      confidence: high
    - path: "~/.config/vllm"
      os:
        - linux
      artifact_type: config-dir
      description: >-
        VLLM_CONFIG_ROOT default. Holds usage_stats.json and, when telemetry was
        declined, a do_not_track marker file.
      forensic_value: medium
      evidence_type:
        - configuration
        - program-presence
      install_method: pip install vllm
      confidence: high
    - path: "~/.config/vllm/usage_stats.json"
      os:
        - linux
      artifact_type: log
      description: >-
        Usage telemetry staged for POST to stats.vllm.ai. Useful in reverse - it records
        what was served and when, so it dates activity even where no server log survives.
      forensic_value: high
      evidence_type:
        - timeline
        - program-presence
      confidence: high
    - path: "~/.cache/huggingface/hub"
      os:
        - linux
      artifact_type: data-dir
      description: >-
        Model weights vLLM pulls at startup. Shared with every other Hugging Face
        consumer on the host, so attribute by mtime rather than by presence alone.
      forensic_value: medium
      evidence_type:
        - program-presence
        - timeline
      confidence: high
  network:
    - direction: listener
      indicator: vLLM OpenAI-compatible API
      port: 8000/TCP
      default_bind: 0.0.0.0
      authentication: None by default
      exposure_risk: critical
      description: >-
        Default serving port for `vllm serve`; endpoints under /v1/ mirror the OpenAI API.
        Auth exists only if --api-key or VLLM_API_KEY is set and both default to unset,
        and the server binds all interfaces unless --host is given - so the out-of-the-box
        posture on a routable host is an open inference endpoint.
      confidence: high
    - direction: egress
      indicator: stats.vllm.ai
      port: 443/TCP
      exposure_risk: low
      description: >-
        Usage telemetry destination (VLLM_USAGE_STATS_SERVER), enabled unless a
        do_not_track marker exists. Ordinary traffic, but it confirms a vLLM instance
        ran on the host and roughly when.
      confidence: high
  process:
    - name: vllm  |  python -m vllm.entrypoints.openai.api_server
      os:
        - linux
      typical_parent: shell, systemd, or container runtime
      typical_children: Worker processes per tensor-parallel rank
      service_or_daemon: Commonly run under systemd or Docker
      persistence: Docker restart policy or systemd unit
      confidence: high
credentials:
  - location: VLLM_API_KEY
    os: [linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      PLAINTEXT. The API key the server requires from clients, read from the process
      environment. Unset by default, which means no authentication at all. The --api-key
      CLI flag takes precedence over it, so check the command line as well as the
      environment before concluding the server was unauthenticated.
    confidence: high
  - location: HF_TOKEN
    os: [linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      PLAINTEXT Hugging Face token used to pull gated model weights, read from the
      environment. Grants access to whatever private repositories the account can reach.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: >-
    Establish the authentication posture first, because it decides whether this is an
    exposure: capture the full `vllm serve` command line and the process environment,
    and check for --api-key and VLLM_API_KEY together. Then confirm the bind address
    with `ss -lntp` rather than trusting the config - the default is 0.0.0.0. Collect
    ~/.config/vllm/usage_stats.json before any restart; it is often the only timeline of
    what was served. Note the model cache is shared with other Hugging Face consumers,
    so presence alone does not attribute activity to vLLM.
atlas_techniques:
  - AML.T0011
  - AML.T0024
  - AML.T0029
attack_techniques: []
references:
  - title: vLLM OpenAI-compatible server (--api-key, --host, default port 8000)
    url: https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
    accessed: '2026-08-13'
  - title: CVE-2025-32444 - unauthenticated RCE via the Mooncake integration
    url: https://nvd.nist.gov/vuln/detail/CVE-2025-32444
    accessed: '2026-08-13'
  - title: vllm 0.27.1 package source - envs.py (VLLM_API_KEY, VLLM_CACHE_ROOT, VLLM_CONFIG_ROOT, VLLM_USAGE_STATS_SERVER) and usage_lib.py (usage_stats.json, do_not_track)
    url: https://pypi.org/project/vllm/0.27.1/
    accessed: '2026-08-13' 
