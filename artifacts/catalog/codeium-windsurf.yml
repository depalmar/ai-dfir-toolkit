# AI agent artifact catalog entry
# AIRT-0006 - Codeium / Windsurf
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0006
name: Codeium / Windsurf
vendor: Codeium (Exafunction)
category: coding-agent-ide
description: Windsurf IDE with Cascade agentic flow; Codeium plugins for other editors. Downloads its own language-server binary.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local tool exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: Plugin downloads and executes a remote binary. Cascade runs terminal commands. Indexes entire codebase to cloud.
artifacts:
  disk:
    - path: ~/.codeium/
      os:
        - windows
        - macos
        - linux
      artifact_type: config-dir
      description: API key + downloaded language server
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: IDE plugin
      confidence: high
    - path: "%USERPROFILE%\\.codeium\\windsurf\\mcp_config.json"
      os:
        - windows
      artifact_type: mcp-config
      description: EXECUTION PRIMITIVE
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: Windsurf
      confidence: high
    - path: ~/.codeium/windsurf/mcp_config.json
      os:
        - macos
        - linux
      artifact_type: mcp-config
      description: EXECUTION PRIMITIVE
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: Windsurf
      confidence: high
    - path: "~/.codeium/<version>/language_server_*"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: REMOTE BINARY DOWNLOAD - verify hash
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: IDE plugin
      confidence: medium
    - path: "<repo>/.windsurf/settings.json"
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Indexer scope config
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
    - path: "<repo>/.windsurfrules"
      os:
        - windows
        - macos
        - linux
      artifact_type: rules-file
      description: Prompt-injection surface
      forensic_value: low
      evidence_type:
        - configuration
        - prompt-injection-surface
      install_method: n/a
      confidence: medium
  network:
    - direction: egress
      indicator: "server.codeium.com, *.codeium.com, *.windsurf.com"
      port: 443/TCP
      description: Full-codebase indexing to cloud
      confidence: high
  process:
    - name: Windsurf.exe, language_server_windows_x64.exe
      os:
        - windows
      typical_parent: explorer.exe
      typical_children: cmd.exe, powershell.exe, node.exe
      service_or_daemon: "No"
      persistence: Run key (optional)
      confidence: high
credentials:
  - location: ~/.codeium/config.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Codeium editor plugins persist the account API key here as PLAINTEXT JSON under
      the 'apiKey' field, written directly by the plugin after registration. Also the
      legacy and fallback location for the Windsurf editor's key. Honours
      $XDG_DATA_HOME, so it becomes $XDG_DATA_HOME/.codeium/config.json when that is
      set. This directory is already covered by this repo's shipped credential-access
      Sigma rule.
    confidence: high
  - location: ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb
    os: [macos]
    storage: sqlite
    secret_type: api-key
    description: >-
      Windsurf editor (VS Code fork). The ItemTable row keyed 'windsurfAuthStatus' holds
      JSON containing the live Codeium/Windsurf apiKey UNENCRYPTED inside the SQLite DB.
      This is the current location for modern Windsurf builds; ~/.codeium/config.json is
      the older fallback.
    confidence: medium
  - location: ~/.config/Windsurf/User/globalStorage/state.vscdb
    os: [linux]
    storage: sqlite
    secret_type: api-key
    description: >-
      Linux path for the same Windsurf editor store. ItemTable row 'windsurfAuthStatus'
      holds JSON with the apiKey in the clear inside the SQLite DB.
    confidence: medium
  - location: '%APPDATA%\Windsurf\User\globalStorage\state.vscdb'
    os: [windows]
    storage: sqlite
    secret_type: api-key
    description: >-
      Windows path for the same Windsurf editor store. ItemTable row
      'windsurfAuthStatus' holds JSON with the apiKey in the clear inside the SQLite DB.
    confidence: medium
  - location: ~/.codeium/windsurf/mcp_config.json
    os: [macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Windsurf / Cascade MCP server definitions. The per-server env block routinely
      holds PLAINTEXT API keys and bearer tokens for stdio servers. Windsurf supports
      ${env:VAR} interpolation as an alternative, so absence of a literal key here means
      checking the process environment instead.
    confidence: high
  - location: '%USERPROFILE%\.codeium\windsurf\mcp_config.json'
    os: [windows]
    storage: plaintext
    secret_type: api-key
    description: >-
      Windows path for the same Windsurf/Cascade MCP config, same PLAINTEXT env block
      exposure.
    confidence: high
  - location: '<nvim stdpath(''cache'')>/codeium/config.json'
    os: [macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      The Neovim Codeium/Windsurf plugin keeps its own PLAINTEXT config.json with the
      account api_key, SEPARATE from ~/.codeium/. Defaults to
      ~/.cache/nvim/codeium/config.json. A responder who only collects ~/.codeium/ will
      miss a Neovim user's key entirely.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: CodeiumWindsurf
atlas_techniques:
