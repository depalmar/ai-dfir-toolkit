# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0022
name: text-generation-webui (oobabooga)
aliases:
  - oobabooga
  - textgen
  - TextGen
  - text-generation-webui
vendor: oobabooga (OSS)
category: llm-runtime
description: Gradio UI for local models with an extension system. Renamed to TextGen in 2026 and now ships a native Electron desktop app alongside the browser UI (v4.7.3, 2026-05-03); the repository moved to oobabooga/textgen and the old URL redirects. The paths below were catalogued against the web UI - the desktop build may add Electron app-data locations that are not recorded here.
supported_os:
  - windows
  - macos
  - linux
execution_model: Fully local inference
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: null
  mcp_capable: false
risk: high
confidence: medium
abuse_potential: Extensions execute arbitrary Python. Gradio --share creates a public tunnel to the host - a covert ingress channel.
artifacts:
  disk:
    - path: "text-generation-webui.exe  |  python server.py"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Binary for text-generation-webui (oobabooga)
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: one-click installer / git
      confidence: medium
    - path: "<install>/models/"
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: Models Dir for text-generation-webui (oobabooga)
      forensic_value: medium
      evidence_type:
        - program-presence
        - data-access
      install_method: n/a
      confidence: medium
    - path: "<install>/extensions/"
      os:
        - windows
        - macos
        - linux
      artifact_type: install-dir
      description: Arbitrary Python execution
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
  network:
    - direction: listener
      indicator: Gradio UI / OpenAI-compatible API
      port: 7860/TCP, 5000/TCP
      description: "--share creates a public gradio.live tunnel - covert ingress"
      confidence: medium
      default_bind: "127.0.0.1"
      authentication: Optional
      exposure_risk: high
  process:
    - name: python (server.py), text-generation-webui.exe
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: python (extensions)
      service_or_daemon: "No"
      persistence: None
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (python (server.py), text-generation-webui.exe) and CommandLine contains text-generation-webui"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials: []
mcp: []
