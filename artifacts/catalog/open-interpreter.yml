# AI agent artifact catalog entry
# AIRT-0015 - Open Interpreter
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0015
name: Open Interpreter
aliases:
  - open-interpreter
  - openinterpreter
  - interpreter
vendor: Open Interpreter (OSS)
category: code-execution-agent
description: Natural-language to executed code on the host. Supports --local via llamafile (no API key needed). Everything below is the classic Python build (pip install open-interpreter). A Rust successor, also called Open Interpreter, now lives at openinterpreter/openinterpreter and is built on Codex; its artifact locations have not been verified and are not recorded here, so a host running the Rust build will not match these paths.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference + local exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: By design a code execution primitive. --allow-all-tools / autopilot runs commands with no user confirmation. Effectively a LOLBIN.
artifacts:
  disk:
    - path: "interpreter  (venv: .../open-interpreter/bin/interpreter)"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Python 3.10/3.11
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: pip
      confidence: high
    - path: "...\\open-interpreter\\Scripts\\interpreter.EXE"
      os:
        - windows
      artifact_type: binary
      description: Binary for Open Interpreter
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: pip
      confidence: high
    - path: "~/.config/Open Interpreter/  |  %APPDATA%\\Open Interpreter\\"
      os:
        - windows
        - macos
        - linux
      artifact_type: config-dir
      description: profiles/, config yaml
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: pip
      confidence: medium
    - path: llamafile artifacts (--local mode)
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: No API key needed - fully offline agent
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
  network:
    - direction: egress
      indicator: api.openai.com or configured base_url; NONE in --local mode
      port: 443/TCP
      description: "--local mode has zero network IOCs - file/process telemetry only"
      confidence: high
  process:
    - name: interpreter / python
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: sh, bash, cmd.exe, powershell.exe, python
      service_or_daemon: "No"
      persistence: None
      confidence: high
  registry:
    - key: "HKCU\\Environment"
      value: OPENAI_API_KEY, ANTHROPIC_API_KEY, INTERPRETER_API_KEY
      type: REG_SZ
      description: >-
        Provider credentials set persistently for the user
      forensic_value: medium
      persistence: false
      confidence: medium
credentials:
  - location: ~/.openinterpreter/auth.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Current (Rust) build - default credential store. Plaintext JSON holding ChatGPT
      sign-in OAuth tokens plus an OPENAI_API_KEY field, personal_access_token, Bedrock
      API key and agent-identity JWT. Created mode 0600 on Unix (no mode enforcement on
      Windows). Relocated by INTERPRETER_HOME; CODEX_HOME is deliberately ignored by
      this product.
    confidence: high
  - location: ~/.openinterpreter/.credentials.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Current (Rust) build - MCP server OAuth tokens (per-server access_token,
      refresh_token, client_id, scopes) in plaintext JSON. This is the fallback store:
      default mode is keyring-preferred, so this file appears when the OS keyring is
      unavailable or fails.
    confidence: high
  - location: 'OS keyring: service "Codex Auth", account "cli|<first 16 hex of SHA-256 of the resolved home path>"'
    os: [windows, macos, linux]
    storage: os-keyring
    secret_type: oauth-token
    description: >-
      Current (Rust) build - non-default but user-selectable via
      cli_auth_credentials_store = "keyring" or "auto". When set, CLI auth is not in a
      file: it is in the OS keychain/credential manager. The service string is still
      "Codex Auth" in the Open Interpreter fork. Requires keychain acquisition rather
      than file collection.
    confidence: high
  - location: '~/.openinterpreter/secrets/codex_auth.age  |  ~/.openinterpreter/secrets/mcp_oauth.age  |  ~/.openinterpreter/secrets/local.age'
    os: [windows, macos, linux]
    storage: encrypted
    secret_type: oauth-token
    description: >-
      Current (Rust) build - age-encrypted secrets files used by the "secrets" keyring
      backend, which is the default backend on Windows when keyring storage is selected.
      The file encryption key lives in the OS keyring, so the file alone is not
      decryptable - collect the files and the keyring entry together or neither is
      useful.
    confidence: high
  - location: 'OPENAI_API_KEY  |  ANTHROPIC_API_KEY  |  <model_providers.*.env_key>'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Current (Rust) build - vendor-documented API-key path for CI and headless hosts.
      Custom OpenAI-compatible providers declare their own variable name via env_key in
      config.toml. Nothing is written to disk in this mode: look at process environment,
      shell rc files, unit files and CI secret stores.
    confidence: high
  - location: '~/.config/open-interpreter/profiles/default.yaml  |  ~/Library/Application Support/open-interpreter/profiles/default.yaml'
    os: [macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Classic Python build (pip install open-interpreter, current PyPI release 0.4.3 -
      this is the build AIRT-0015's pip/venv artifacts describe). Plaintext profile
      YAML. The vendor's own shipped default profile carries a commented "api_key: ..."
      under "llm:", making this the documented place a provider key is persisted. Note
      the directory is lowercase-hyphen "open-interpreter"; the entry's existing
      "~/.config/Open Interpreter/" is the pre-0.2.0 legacy name that the built-in
      migrator still reads.
    confidence: medium
  - location: '%LOCALAPPDATA%\open-interpreter\open-interpreter\profiles\default.yaml'
    os: [windows]
    storage: plaintext
    secret_type: api-key
    description: >-
      Classic Python build - Windows form of the profile YAML above. Derived, not
      vendor-documented: platformdirs.user_config_dir on Windows resolves to
      user_data_dir (local, not roaming) and appends appauthor-then-appname, and
      appauthor defaults to appname, which is why the name appears twice. Note this is
      %LOCALAPPDATA%, not the %APPDATA% currently in the entry. Verify on a live Windows
      host before shipping a collection step.
    unverified: true
    confidence: low
  - location: 'OPENAI_API_KEY  |  ANTHROPIC_API_KEY  |  CEREBRAS_API_KEY  |  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Classic Python build - keys are read from the environment. Important for
      collection: the interactive first-run key prompt does not persist the key to disk;
      it assigns it in memory and instructs the user to append "export
      OPENAI_API_KEY=..." to ~/.zshrc or ~/.bashrc, or run setx on Windows. So there is
      no auth file for this build - collect shell rc files and the HKCU\Environment key
      instead.
    confidence: high
  - location: INTERPRETER_API_KEY
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Classic Python build - shared secret for Open Interpreter's server/async mode, not
      a provider credential. Forensically significant because the auth function returns
      True when the variable is unset: an exposed server-mode instance with no
      INTERPRETER_API_KEY set accepts any caller.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: OpenInterpreter
  velociraptor_artifact: Custom.AIAgents.OpenInterpreter
atlas_techniques:
  - AML.T0053
  - AML.T0054
attack_techniques:
  - T1059
references:
  - title: "OpenInterpreter/open-interpreter releases"
    url: https://github.com/OpenInterpreter/open-interpreter/releases
    accessed: "2026-08-13"
last_verified: "2026-08-13"
