# AI agent artifact catalog entry
# AIRT-0027 - AutoGen
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0027
name: AutoGen
vendor: Microsoft (OSS)
category: agent-framework
description: Multi-agent conversation framework with LocalCommandLineCodeExecutor and DockerCommandLineCodeExecutor.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: LocalCommandLineCodeExecutor runs generated code directly on the host. OAI_CONFIG_LIST is a plaintext JSON key file.
artifacts:
  disk:
    - path: OAI_CONFIG_LIST  (JSON, CWD or env-specified path)
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: PLAINTEXT api_key values
      forensic_value: high
      evidence_type:
        - configuration
      install_method: pip
      confidence: high
    - path: coding/  (default LocalCommandLineCodeExecutor work_dir)
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: AGENT-GENERATED CODE executed on host
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
  process:
    - name: python
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: sh/cmd (LocalCommandLineCodeExecutor), docker
      service_or_daemon: "No"
      persistence: None
      confidence: high
credentials: []
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references: []
