# AI agent artifact catalog entry
# AIRT-0027 - AutoGen
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0027
name: AutoGen
vendor: Microsoft (OSS)
status: legacy
category: agent-framework
description: Multi-agent conversation framework with LocalCommandLineCodeExecutor and DockerCommandLineCodeExecutor. In maintenance mode since October 2025 - bug and security fixes only, community managed, last feature release September 2025. Microsoft Agent Framework is the successor (1.0 GA April 2026). The original authors forked the project as AG2 and control the original PyPI packages, so what `pip install` puts on disk may not be Microsoft's AutoGen - check the installed distribution, not the import name.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: LocalCommandLineCodeExecutor runs generated code directly on the host. OAI_CONFIG_LIST is a plaintext JSON key file.
artifacts:
  disk:
    - path: OAI_CONFIG_LIST  (JSON, CWD or env-specified path)
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Plaintext api_key values
      forensic_value: high
      evidence_type:
        - configuration
      install_method: pip
      confidence: high
    - path: coding/  (default LocalCommandLineCodeExecutor work_dir)
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: Agent-generated code executed on host
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
  process:
    - name: python
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: sh/cmd (LocalCommandLineCodeExecutor), docker
      service_or_daemon: "No"
      persistence: None
      confidence: high
  registry:
    - key: "HKCU\\Environment"
      value: OAI_CONFIG_LIST
      type: REG_SZ
      description: >-
        Points at the JSON file holding model endpoints and their API keys, so
        the variable locates the credential rather than being one
      forensic_value: medium
      persistence: false
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (python) and CommandLine contains autogen"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: 'OAI_CONFIG_LIST  (JSON file in CWD, or env var of the same name)'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext JSON list of model configs, each carrying an `api_key` field. Vendor
      docs state AutoGen looks for the keys in the OAI_CONFIG_LIST file in the current
      working directory, or in the OAI_CONFIG_LIST environment variable - so the
      variable may hold the JSON itself, not just a path. Collect the process
      environment as well as the CWD.
    confidence: high
  - location: OPENAI_API_KEY / AZURE_OPENAI_API_KEY / ANTHROPIC_API_KEY
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext provider keys in the process environment. Autogen-ext's OpenAI client
      documents api_key as "Required if 'OPENAI_API_KEY' is not found in the environment
      variables"; the Studio gallery builder enumerates all three names. This is the
      fallback path when no OAI_CONFIG_LIST is present.
    confidence: high
  - location: ~/.autogenstudio/database.sqlite
    os: [windows, macos, linux]
    storage: sqlite
    secret_type: api-key
    description: >-
      AutoGen Studio application database. The Settings table stores a SettingsConfig
      JSON blob holding the default model client config (which carries `api_key`) plus
      user-defined environment variables - so provider keys live in the DB, not in a
      keyring. Default appdir is ~/.autogenstudio, overridable via --appdir or
      AUTOGENSTUDIO_APPDIR; --database-uri can relocate it to Postgres/MySQL entirely.
    unverified: true
    confidence: low
  - location: ~/.autogenstudio/.env
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext env file in the AutoGen Studio appdir. Web/initialization.py calls
      load_dotenv() on it at startup, and the vendor README states .env files in that
      directory are used to set environment variables for the app. Follows --appdir /
      AUTOGENSTUDIO_APPDIR if relocated.
    confidence: high
mcp: []
mcp:
  - mechanism: in-code
    indicator: Import of autogen_ext.tools.mcp - McpWorkbench, StdioServerParams, StdioMcpToolAdapter
    config_key: StdioServerParams command and args
    spawn_mechanism: Child process per stdio server, started by the script
    secrets_location: StdioServerParams env, so the script or its environment
    persistence_trigger: Every script run
    triage_priority: p2
    confidence: high
    notes: The vendor documents StdioServerParams as executing commands in the local environment and warns to connect only to trusted servers, which makes the parameter literal in the source the thing to read
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  velociraptor_artifact: Custom.AIAgents.AutoGen
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references:
  - title: "microsoft/autogen"
    url: https://github.com/microsoft/autogen
    accessed: "2026-08-13"
  - title: "AutoGen reference - autogen_ext.tools.mcp"
    url: https://microsoft.github.io/autogen/stable//reference/python/autogen_ext.tools.mcp.html
    accessed: "2026-08-13"
