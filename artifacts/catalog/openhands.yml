# AI agent artifact catalog entry
# AIRT-0043 - OpenHands
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0043
name: OpenHands
aliases:
  - OpenDevin
vendor: All Hands AI (OSS)
category: agent-framework
description: Autonomous software-engineering agent (formerly OpenDevin) with a web UI, running agent code in Docker sandbox containers. Deployed via Docker, Docker Compose, or from source.
supported_os:
  - linux
  - windows
  - docker
execution_model: Cloud or local inference + sandboxed exec
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: The documented run command mounts /var/run/docker.sock into the container - that is host-root-equivalent, so an agent or an attacker reaching the container controls the Docker daemon and therefore the host. Port 3000 has no authentication in the default local deployment.
artifacts:
  disk:
    - path: ~/.openhands/config.toml
      os:
        - linux
        - docker
      artifact_type: config-file
      description: "[core] workspace_base, [llm] model/api_key/base_url. Plaintext api_key. Base_url is an inference-redirection vector."
      forensic_value: high
      evidence_type:
        - configuration
      install_method: Docker/source
      confidence: high
    - path: ~/.openhands-state/  |  /.openhands-state
      os:
        - linux
        - docker
      artifact_type: data-dir
      description: Persistent agent state across container restarts. Older deployments use this path; newer ones mount ~/.openhands.
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: Docker
      confidence: high
    - path: ~/.openhands/  |  /.openhands
      os:
        - linux
        - docker
      artifact_type: data-dir
      description: Current state directory. Also holds user skills at ~/.openhands/skills/.
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: Docker
      confidence: high
    - path: workspace_base (default ./workspace, mounted to /opt/workspace_base)
      os:
        - linux
        - docker
      artifact_type: data-dir
      description: Agent-generated and agent-modified files. Treat as unknown-origin content during triage.
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: Docker/source
      confidence: high
    - path: ~/.openhands/skills/ ; ~/.agents/skills/
      os:
        - linux
        - docker
      artifact_type: agent-definition
      description: Custom skill definitions loaded by the agent
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
    - path: docker-compose.yml / docker run invocation
      os:
        - linux
        - docker
      artifact_type: config-file
      description: "Critical triage artifact: check for -v /var/run/docker.sock:/var/run/docker.sock, which is host-root-equivalent"
      forensic_value: high
      evidence_type:
        - configuration
      install_method: Docker
      confidence: high
    - path: ghcr.io/openhands/agent-server ; docker.openhands.dev/openhands/openhands
      os:
        - linux
        - docker
      artifact_type: container
      description: Sandbox runtime image pulled per session. Older tags use docker.all-hands.dev/all-hands-ai/.
      forensic_value: high
      evidence_type:
        - program-presence
      install_method: Docker
      confidence: high
  network:
    - direction: listener
      indicator: OpenHands web UI + API (uvicorn)
      port: 3000/TCP
      description: "Documented quick start publishes -p 3000:3000. Frontend dev server on 3001 when run from source."
      confidence: high
      default_bind: 0.0.0.0 (container)
      authentication: None in default local deploy
      exposure_risk: critical
    - direction: listener
      indicator: Sandbox VS Code server
      port: 41234/TCP (SANDBOX_VSCODE_PORT)
      description: Published when the in-sandbox editor is used
      confidence: medium
      default_bind: "0.0.0.0"
      authentication: None
      exposure_risk: high
    - direction: egress
      indicator: docker.openhands.dev, ghcr.io, docker.all-hands.dev
      port: 443/TCP
      description: Runtime image pulls
      confidence: high
    - direction: egress
      indicator: LLM_BASE_URL / LLM_OLLAMA_BASE_URL configured endpoint
      port: 443/TCP, 11434/TCP
      description: Endpoint-override variables - a modified value redirects all agent traffic
      confidence: high
  process:
    - name: "python (uvicorn openhands.server.listen:app)"
      os:
        - linux
        - docker
      typical_parent: dockerd / shell
      typical_children: docker (sandbox spawn), node
      service_or_daemon: YES (container)
      persistence: Docker restart policy
      confidence: high
credentials:
  - location: ~/.openhands/agent_settings.json
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext LLM provider api_key. Vendor CLI docs list this file as holding 'LLM
      configuration and agent settings' (model, API credentials, base URL). The CLI
      agent store serialises the agent spec with
      model_dump_json(context={'expose_secrets': True}) before writing, so the key is
      written unredacted. No OS keyring is involved.
    confidence: high
  - location: ~/.openhands/settings.json  |  /.openhands/settings.json
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext LLM api_key for the server / Docker deployment. Vendor Docker install
      docs instruct 'Set up ~/.openhands/settings.json with your LLM configuration'. The
      app server's FileSettingsStore defaults to path 'settings.json' and stores with
      model_dump_json(context={'expose_secrets': True, 'persist_settings': True}); the
      app image sets FILE_STORE=local and FILE_STORE_PATH=/.openhands, and the
      documented run command mounts -v ~/.openhands:/.openhands.
    confidence: high
  - location: ~/.openhands/secrets.json  |  /.openhands/secrets.json
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext git provider tokens (GitHub / GitLab) plus any user-defined custom
      secrets the operator added for the agent. The app server's FileSecretsStore
      defaults to filename 'secrets.json' and writes
      model_dump_json(context={'expose_secrets': True}) with no encryption layer. Same
      file-store root as settings.json (FILE_STORE_PATH=/.openhands).
    confidence: high
  - location: '<project>/config.toml  ([llm] api_key)'
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext api_key under the [llm] section of config.toml (legacy V0 / CLI /
      headless / development mode). Vendor docs place this file 'in the same directory
      from which the command is run', or at a path given with --config-file - not
      necessarily at the ~/.openhands/config.toml the catalog disk row lists. Current
      vendor docs show ~/.openhands/config.toml only for the [plugins] section, so
      collect both locations and treat the working-directory copy as the likely one.
    confidence: high
  - location: LLM_API_KEY
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext provider key in the process environment; vendor environment-variable
      reference documents it as 'API key for your LLM provider'. Usually supplied on the
      documented docker run line, so it also survives in the container config (docker
      inspect), any compose file, and shell history. Related documented credential vars
      in the same table: LLM_AWS_ACCESS_KEY_ID, LLM_AWS_SECRET_ACCESS_KEY,
      SANDBOX_API_KEY, GITHUB_TOKEN, TAVILY_API_KEY.
    confidence: high
  - location: 'SANDBOX_ENV_*  (e.g. SANDBOX_ENV_OPENAI_API_KEY)'
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: unknown
    description: >-
      Plaintext pass-through variables. Vendor docs: 'Variables prefixed with
      SANDBOX_ENV_ are passed through to the sandbox environment' - so any secret named
      this way on the host is injected into the agent's sandbox container and is
      readable by anything the agent runs there. Enumerate them from the container
      environment during triage.
    confidence: high
  - location: JWT_SECRET
    os: [linux, windows, docker]
    storage: plaintext
    secret_type: jwt-signing-key
    description: >-
      Plaintext session-token signing secret, documented as 'JWT secret for
      authentication', default auto-generated. The V0 config equivalent is jwt_secret in
      config.toml, which the vendor docs tell operators to set to their own value. Theft
      permits forging a session against the port 3000 UI/API; rotation invalidates
      existing sessions.
    confidence: high
mcp:
  - mechanism: config-file
    config_path: ~/.openhands/config.toml
    config_key: "[mcp] section"
    spawn_mechanism: Child process at agent start
    secrets_location: config.toml plaintext
    persistence_trigger: Every agent session
    triage_priority: p1
    notes: TOML not JSON
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  velociraptor_artifact: Custom.AIAgents.OpenHands
atlas_techniques: []
attack_techniques: []
references:
  - title: "OpenHands/OpenHands"
    url: https://github.com/OpenHands/OpenHands
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
