# AI agent artifact catalog entry
# AIRT-0013 - AgentGPT
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0013
name: AgentGPT
vendor: Reworkd (OSS)
status: unmaintained
category: agent-framework
description: Browser-based autonomous agent, self-hostable via Docker. Repository archived 2026-01-28; the hosted site still loads but receives no updates or security patches.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: false
risk: medium
confidence: low
abuse_potential: Self-hosted instance exposes a web UI; API keys in .env.
artifacts: {}
credentials:
  - location: '<install>/next/.env'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Canonical env file, plaintext (confirms the VERIFICATION.md correction).
      Docker-compose bind-mounts it into the frontend container and passes it to the
      backend as env_file. Contents: REWORKD_PLATFORM_OPENAI_API_KEY,
      REWORKD_PLATFORM_SERP_API_KEY, REWORKD_PLATFORM_REPLICATE_API_KEY,
      GOOGLE/GITHUB/DISCORD_CLIENT_SECRET, NEXTAUTH_SECRET, and the MySQL user, password
      and DATABASE_URL.
    confidence: high
  - location: '<install>/platform/.env'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      Second full copy of the same plaintext secrets. The setup CLI writes
      byte-identical content to next/.env and platform/.env, and the FastAPI backend's
      pydantic Settings independently reads env_file ".env" from its own directory
      (env_prefix REWORKD_PLATFORM_). A collection step that takes only next/.env leaves
      a complete duplicate of every key on disk.
    confidence: high
  - location: 'NEXTAUTH_SECRET  (set in <install>/next/.env)'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: jwt-signing-key
    description: >-
      NextAuth session/JWT signing key, generated by the setup CLI as 32 random bytes
      base64 and written in plaintext. Distinct from the API keys in the same file
      because its compromise means forged authenticated sessions against the self-hosted
      UI, so it belongs on the rotate-first list.
    confidence: high
  - location: '<install>/docker-compose.yml'
    os: [docker, linux, macos, windows]
    storage: plaintext
    secret_type: embedded-credentials
    description: >-
      Ships hardcoded MySQL credentials in the repo itself: MYSQL_USER, MYSQL_PASSWORD
      and MYSQL_ROOT_PASSWORD for the agentgpt_db container, with the same application
      user and password repeated in the platform service's environment block. Unchanged
      on a default self-host, so the database password on a live instance is a published
      constant.
    confidence: high
  - location: 'Browser Local Storage, key "agentgpt-settings-storage-v2" (browser profile Local Storage LevelDB, AgentGPT origin - http://localhost:3000 self-hosted)'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Client-side, not on the server. The user's own OpenAI key entered in the Settings
      dialog (ModelSettings.customApiKey) is persisted by a zustand persist store into
      browser localStorage, and the store's partialize spreads the whole modelSettings
      object so the key is included. It therefore lives unencrypted in the browser
      profile's Local Storage LevelDB, not in any AgentGPT file. Collect the browser
      profile of the user who ran the agent, not just the host running the containers.
    confidence: high
  - location: 'MySQL database "reworkd_platform", table Account (docker volume agentgpt_db -> /var/lib/mysql in container agentgpt_db)'
    os: [docker]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      NextAuth Account table stores third-party provider refresh_token, access_token and
      id_token in unencrypted text columns for every user who signed in with Google,
      GitHub or Discord. Mysql:8.0 container named agentgpt_db, named docker volume
      agentgpt_db, MYSQL_TCP_PORT 3307 published on host 3308.
    confidence: high
  - location: 'REWORKD_PLATFORM_SECRET_SIGNING_KEY  (read from <install>/platform/.env)'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: encryption-key
    description: >-
      The Fernet key that protects the OauthCredentials rows above. Read via pydantic
      Settings with env_prefix REWORKD_PLATFORM_. The setup CLI's generated env file
      does not emit this variable, so on a default install it stays at the shipped
      default - check whether the operator set it before concluding the stored tokens
      were ever protected.
    confidence: high
mcp: []
collection:
  triage_priority: p2
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references:
  - title: "reworkd/AgentGPT"
    url: https://github.com/reworkd/AgentGPT
    accessed: "2026-08-13"
last_verified: "2026-08-13"
