# AI agent artifact catalog entry
# AIRT-0008 - Amazon Q Developer (ex-CodeWhisperer)
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0008
name: Amazon Q Developer (ex-CodeWhisperer)
aliases:
  - CodeWhisperer
  - Amazon Q Developer
  - amazon-q-developer
  - amazonq
vendor: AWS
category: coding-agent-ide
description: AWS coding assistant. Node-based language server (aws-lsp-codewhisperer). CodeWhisperer folded in 2024-04-30; IDE plugins EOL 2027-04-30.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local agent
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: medium
confidence: low
abuse_potential: SSO token cache in ~/.aws/sso/cache. Agent can execute local commands in newer builds.
artifacts:
  disk:
    - path: node .../language-server/build/aws-lsp-codewhisperer-token-binary.js --stdio
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: "npm pkg @aws/lsp-codewhisperer"
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: IDE extension
      confidence: high
    - path: "%USERPROFILE%\\.vscode\\extensions\\amazonwebservices.amazon-q-vscode-*"
      os:
        - windows
      artifact_type: install-dir
      description: Extension Dir for Amazon Q Developer (ex-CodeWhisperer)
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: VS Code
      confidence: high
    - path: "<repo>/.amazonq/rules/*.md"
      os:
        - windows
        - macos
        - linux
      artifact_type: rules-file
      description: Rules File for Amazon Q Developer (ex-CodeWhisperer)
      forensic_value: low
      evidence_type:
        - configuration
        - prompt-injection-surface
      install_method: n/a
      confidence: medium
    - path: "$XDG_RUNTIME_DIR/qlog/cli.log"
      os:
        - linux
      artifact_type: log
      description: >-
        CLI debug log. Records argv for every invocation, telemetry events
        naming the subcommand run, and Builder ID token lookups against the
        secret store. Created only when Q_LOG_LEVEL is debug or trace - error,
        warn, info and unset produce no file and no directory, so an absent
        qlog is not evidence the CLI went unused. Vendor troubleshooting
        documentation gives this location as %TEMP%\qlog\, which matches
        neither branch of the source and is a documentation error.
      forensic_value: high
      evidence_type:
        - execution
        - user-activity
        - timeline
      install_method: zip installer
      retention: >-
        Volatile. $XDG_RUNTIME_DIR is tmpfs, so the directory and its contents
        are lost on reboot or session end and never reach a disk image. Collect
        live or not at all.
      confidence: high
      last_verified: "2026-08-14"
    - path: "~/.local/share/amazon-q/data.sqlite3"
      os:
        - linux
      artifact_type: database
      description: >-
        SQLite state database created on the first CLI run, before any
        authentication and regardless of Q_LOG_LEVEL. Its presence proves the
        CLI executed on the host even when no log was ever written and the user
        never signed in, which makes it the more reliable execution witness of
        the two.
      forensic_value: high
      evidence_type:
        - execution
        - program-presence
      install_method: zip installer
      confidence: high
      last_verified: "2026-08-14"
    - path: "~/.local/share/amazon-q/settings.json"
      os:
        - linux
      artifact_type: config-file
      description: >-
        CLI settings file, written as an empty object on first run and
        populated as the user changes settings. Co-located with the state
        database and created in the same first-run write.
      forensic_value: low
      evidence_type:
        - configuration
        - program-presence
      install_method: zip installer
      confidence: high
      last_verified: "2026-08-14"
  network:
    - direction: egress
      indicator: "q.us-east-1.amazonaws.com, codewhisperer.*.amazonaws.com, *.awsapps.com/start"
      port: 443/TCP
      description: HTTPS_PROXY honored
      confidence: high
  process:
    - name: node (aws-lsp-codewhisperer-token-binary.js)
      os:
        - windows
        - macos
        - linux
      typical_parent: Code.exe / idea
      typical_children: "-"
      service_or_daemon: "No"
      persistence: None
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (node (aws-lsp-codewhisperer-token-binary.js)) and CommandLine contains aws-lsp-codewhisperer"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: "~/.aws/sso/cache/*.json"
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: aws-sso-token
    description: SSO access tokens - credential-theft target
    confidence: high
mcp:
  - mechanism: config-file
    config_path: "~/.aws/amazonq/mcp.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start
    secrets_location: env block
    persistence_trigger: Every CLI invocation
    triage_priority: p1
    notes: >-
      Global scope. The CLI reads this and the workspace file together and takes
      the union, so checking one path alone under-reports what the agent could run.
  - mechanism: config-file
    config_path: "<repo>/.amazonq/mcp.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start in the workspace
    secrets_location: env block
    persistence_trigger: Every CLI invocation in the workspace
    triage_priority: p1
    notes: Workspace scope. Travels with the repo.
  - mechanism: config-file
    config_path: "<repo>/.amazonq/default.json"
    config_key: mcpServers
    spawn_mechanism: Child process at agent start
    secrets_location: env block
    persistence_trigger: Every agent start
    triage_priority: p1
    confidence: high
    notes: >-
      Current-format workspace scope, and the file the vendor says wins - "Q
      Developer gives precedence to workspace level configurations". The catalog
      carried the other three and missed this one, so the highest-precedence
      config was the one not collected.
  - mechanism: config-file
    config_path: "~/.aws/amazonq/default.json"
    config_key: Agent configuration, global scope in the IDE
    spawn_mechanism: Child process at IDE start
    secrets_location: env block
    persistence_trigger: Every IDE start
    triage_priority: p2
    notes: Where the IDE stores a server added at global scope
collection:
  triage_priority: p2
  guidance: >-
    Collect config and credential paths before any reboot or agent restart;
    several agents rotate or truncate session logs. Capture the MCP config
    before remediation - it records what the agent was authorised to run. There
    is no native Windows build of the command-line client, so on a Windows host
    the CLI runs inside WSL and its log and state database live in the distro
    filesystem, reachable live at \\wsl$\<distro>\home\<user>\ and at rest
    inside the distro ext4.vhdx under %LOCALAPPDATA%\Packages. Collecting
    %TEMP% on the Windows side returns nothing for this tool.
  kape_target: AmazonQDeveloper
  velociraptor_artifact: Custom.AIAgents.AmazonQDeveloper
atlas_techniques:
  - AML.T0051
  - AML.T0053
  - AML.T0080
  - AML.T0081
attack_techniques:
