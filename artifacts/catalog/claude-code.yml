# AI agent artifact catalog entry
# AIRT-0001 - Claude Code
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0001
name: Claude Code
aliases:
  - claude-code
  - claude
vendor: Anthropic
category: coding-agent-cli
description: Terminal-native agentic coding assistant. Reads/writes files, runs shell commands, invokes MCP servers.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local tool exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: "Documented ITW: Anthropic GTG-2002 'vibe hacking' - autonomous recon, credential harvesting, exploit dev, extortion against 17+ orgs."
artifacts:
