      forensic_value: low
      evidence_type:
        - user-activity
        - data-access
      install_method: n/a
      confidence: high
  registry:
    - key: "HKLM\\SOFTWARE\\Microsoft\\Cryptography"
      value: MachineGuid
      type: REG_SZ
      description: Read (not written) for device fingerprinting / licensing telemetry
      persistence: false
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Environment"
      value: OPENAI_API_KEY, ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, OPENAI_BASE_URL, GOOGLE_API_KEY, HF_TOKEN
      type: REG_SZ
      description: "Persistent user-level secrets. A modified *_BASE_URL silently redirects all inference to an attacker proxy."
      persistence: false
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*"
      value: DisplayName contains Cursor/Windsurf/Copilot
      type: REG_SZ
      description: Shadow-AI IDE inventory sweep
      persistence: false
      forensic_value: medium
      confidence: high
  network:
    - direction: egress
      indicator: api.anthropic.com
      port: 443/TCP
      description: ANTHROPIC_BASE_URL can redirect to a gateway/proxy - check for overrides
      confidence: high
    - direction: egress
      indicator: claude.ai (installer), statsig.anthropic.com (telemetry)
      port: 443/TCP
      description: install.sh source
      confidence: high
  process:
    - name: node.exe (claude)
      os:
        - windows
      typical_parent: cmd.exe / powershell.exe / WindowsTerminal.exe
      typical_children: cmd.exe, powershell.exe, git.exe, python.exe, npx
      service_or_daemon: "No"
      persistence: None (user-invoked)
      confidence: high
    - name: claude / node
      os:
        - macos
        - linux
      typical_parent: bash / zsh / tmux
      typical_children: sh, bash, git, python3, node (MCP)
      service_or_daemon: "No"
      persistence: None (user-invoked)
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (node.exe (claude)) and CommandLine contains claude-code"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: 'macOS login Keychain (~/Library/Keychains/login.keychain-db)'
    os: [macos]
    storage: os-keyring
    secret_type: oauth-token
    description: >-
      Not A file on macOS. The /login OAuth credential lives in the encrypted login
      Keychain, so it needs keychain acquisition rather than file collection. The
      generic-password item is widely reported as 'Claude Code-credentials'.
    confidence: high
  - location: ~/.claude/.credentials.json
    os: [linux, windows]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext OAuth credential file. Mode 0600 on Linux; on Windows the path is
      %USERPROFILE%\.claude\.credentials.json and it inherits user-profile ACLs.
      Vendor-documented for Linux and Windows only, not macOS.
    confidence: high
  - location: $CLAUDE_CONFIG_DIR/.credentials.json
    os: [linux, windows]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      plaintext. When CLAUDE_CONFIG_DIR is set, .credentials.json lives under that
      directory instead of ~/.claude. Check the variable before concluding no credential
      file exists.
    confidence: high
  - location: ANTHROPIC_API_KEY
    os: [windows, macos, linux, docker, container, cloud]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext Anthropic API key read from the process environment; sent as the
      X-Api-Key header. Ranks above the /login credential once approved, so it can
      silently replace the interactive identity.
    confidence: high
  - location: ANTHROPIC_AUTH_TOKEN
    os: [windows, macos, linux, docker, container, cloud]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext bearer token read from the process environment; sent as the
      Authorization: Bearer header when routing through an LLM gateway or proxy.
      Outranks apiKeyHelper and the /login credential.
    confidence: high
  - location: CLAUDE_CODE_OAUTH_TOKEN
    os: [windows, macos, linux, docker, container, cloud]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext long-lived (one year) OAuth token minted by 'claude setup-token'.
      Intended for CI and scripts, so expect it in pipeline secrets, shell profiles and
      container env rather than on the user's disk.
    confidence: high
  - location: ~/.claude.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: embedded-credentials
    description: >-
      Plaintext third-party secrets embedded in local- and user-scoped MCP server
      definitions: mcpServers.<name>.env values and mcpServers.<name>.headers (for
      example an Authorization: Bearer PAT). 'claude mcp add --env KEY=value' and header
      flags write the value straight into this file
    confidence: high
  - location: '<project>/.mcp.json'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: embedded-credentials
    description: >-
      Plaintext third-party secrets in project-scoped MCP server definitions (env and
      headers blocks). Travels with the repo and is commonly committed, so treat any
      literal value here as an exposed credential; ${VAR} expansion is optional, not
      enforced.
    confidence: high
  - location: ~/.config/anthropic/configs/
    os: [macos, linux]
    storage: unknown
    secret_type: oauth-token
    description: >-
      Anthropic profile configuration directory (Windows: %APPDATA%\Anthropic\configs\).
      Holds named profiles written by 'ant auth login' (auth mode user_oauth) or set up
      for Workload Identity Federation (oidc_federation). A named profile outranks the
      /login credential, so this can be the credential actually in use. On-disk format
      not stated by the vendor page - storage left unknown deliberately.
    confidence: high
  - location: 'macOS login Keychain (MCP remote-server OAuth credentials)'
    os: [macos]
    storage: os-keyring
    secret_type: oauth-token
    description: >-
      OAuth client secrets and tokens for remote (HTTP/SSE) MCP servers are held in the
      system keychain, not in ~/.claude.json or .mcp.json - so an MCP config with no
      visible secret does not mean no credential exists. Vendor names the keychain but
      not the item; on Linux/Windows it says only 'a credentials file'.
    confidence: high
mcp:
  - mechanism: config-file
    config_path: ~/.claude.json
    config_key: mcpServers (user scope)
    spawn_mechanism: Child process on CLI start
    secrets_location: env block
    persistence_trigger: Every CLI invocation
    triage_priority: p1
    notes: User-scoped, applies to all projects
  - mechanism: config-file
    config_path: "<repo>/.mcp.json"
    config_key: mcpServers (project scope)
    spawn_mechanism: Child process on CLI start in repo
    secrets_location: env block
    persistence_trigger: Every CLI invocation in repo
    triage_priority: p1
    notes: Travels with the repo - review on every clone/PR
  - mechanism: config-file
    config_path: "<repo>/.claude/settings.local.json"
    config_key: enabledMcpjsonServers
    spawn_mechanism: Approval gate for .mcp.json
    secrets_location: "-"
    persistence_trigger: "-"
    triage_priority: p2
    notes: Records which project servers the user approved - consent evidence
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: ClaudeCode
  velociraptor_artifact: Custom.AIAgents.ClaudeCode
