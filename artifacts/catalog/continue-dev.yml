      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Current format
      forensic_value: high
      evidence_type:
        - configuration
      install_method: IDE extension
      confidence: high
    - path: ~/.continue/config.json
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Legacy format
      forensic_value: high
      evidence_type:
        - configuration
      install_method: IDE extension
      confidence: high
    - path: ~/.continue/config.ts
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Advanced - EXECUTES TYPESCRIPT
      forensic_value: high
      evidence_type:
        - configuration
      install_method: IDE extension
      confidence: medium
    - path: "<repo>/.continue/rules/*.md"
      os:
        - windows
        - macos
        - linux
      artifact_type: rules-file
      description: Prompt-injection surface
      forensic_value: low
      evidence_type:
        - configuration
        - prompt-injection-surface
      install_method: n/a
      confidence: high
    - path: "<repo>/.continuerc.json"
      os:
        - windows
        - macos
        - linux
