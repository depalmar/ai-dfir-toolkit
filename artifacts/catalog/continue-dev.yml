      description: Project Config for Continue.dev
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
  network:
    - direction: egress
      indicator: Configured provider base_url (arbitrary)
      port: 443/TCP
      description: config.yaml can name ANY endpoint - inspect base_url values
      confidence: high
  process:
    - name: node (extension host)
      os:
        - windows
        - macos
        - linux
      typical_parent: Code.exe
      typical_children: node (MCP servers)
      service_or_daemon: "No"
      persistence: None
      confidence: high
