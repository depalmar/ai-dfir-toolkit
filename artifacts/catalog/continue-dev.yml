id: AIRT-0005
name: Continue.dev
vendor: Continue (OSS)
category: coding-agent-ide
description: VS Code / JetBrains extension with agent mode, custom models, and MCP support.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: config.yaml can point at ANY base_url including attacker-controlled inference proxies. Rules files = injection surface.
artifacts:
