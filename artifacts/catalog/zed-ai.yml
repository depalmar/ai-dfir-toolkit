    url: https://zed.dev/docs/assistant/model-context-protocol
    accessed: "2026-08-13"
  - title: Zed docs - Agent Settings
    url: https://zed.dev/docs/ai/agent-settings
    accessed: "2026-08-13"
  - title: Zed docs - Configuring Zed
    url: https://zed.dev/docs/configuring-zed
    accessed: "2026-08-13"
  - title: Zed docs - External Agents
    url: https://zed.dev/docs/ai/external-agents
    accessed: "2026-08-13"
