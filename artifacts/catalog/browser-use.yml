# AI agent artifact catalog entry
# AIRT-0032 - Browser-Use
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0032
name: Browser-Use
vendor: Browser Use (OSS)
category: browser-agent
description: Python library giving LLM agents DOM-level browser control via Playwright.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local browser
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: medium
abuse_potential: Drives real, logged-in browser profiles. Spawns Playwright/Chromium children under a Python parent - a distinctive process tree.
artifacts:
  network:
    - direction: egress
      indicator: Configured LLM provider + arbitrary target sites
      port: 443/TCP
      description: Agent-driven browsing produces anomalous, machine-paced web traffic
      confidence: medium
  process:
    - name: python
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: node, chromium, headless_shell
      service_or_daemon: "No"
      persistence: None
      confidence: medium
  registry:
    - key: "HKCU\\Environment"
      value: BROWSER_USE_API_KEY
      type: REG_SZ
      description: >-
        Cloud credential set persistently for the user
      forensic_value: medium
      persistence: false
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (python) and CommandLine contains browser-use"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: ~/.config/browseruse/cloud_auth.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext JSON holding `api_token` (an OAuth2 device-authorization-grant access
      token for Browser Use Cloud), `user_id` and `authorized_at`. Written via json.dump
      by the cloud sync auth flow, which then attempts chmod 0600. Check existence and
      mode; do not read contents.
    confidence: high
  - location: ~/.config/browseruse/config.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext LLM provider keys. The DB-style config holds LLMEntry records carrying
      an `api_key` field. Resolved as $XDG_CONFIG_HOME/browseruse/config.json,
      defaulting to ~/.config on every platform including Windows;
      BROWSER_USE_CONFIG_DIR overrides the directory.
    confidence: high
  - location: ~/.config/browseruse/profiles/default
    os: [windows, macos, linux]
    storage: unknown
    secret_type: session-state
    description: >-
      Default Chromium user_data_dir for agent sessions - a live, logged-in browser
      profile, and the highest-value item for this tool. Cookies sit in Default/Cookies
      (SQLite) with values encrypted under an OS-keyring-derived key, so the profile
      plus the user's keyring reconstitutes authenticated sessions and bypasses MFA.
      Collect the directory as a unit; do not decrypt cookie values.
    confidence: high
  - location: '~/.config/browseruse/gmail_credentials.json  |  ~/.config/browseruse/gmail_token.json'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Optional Gmail integration (used to retrieve 2FA codes). Gmail_credentials.json is
      the Google OAuth client secret; gmail_token.json is the resulting access/refresh
      token. Default filenames inside the browser-use config dir; present only when that
      integration is configured. Their presence indicates the agent could read the
      user's mail.
    confidence: high
  - location: BROWSER_USE_API_KEY
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext Browser Use Cloud API key in the process environment, sent as the
      X-Browser-Use-API-Key header. Documented in the vendor README and used by the
      cloud SDK when no argument is passed.
    confidence: high
  - location: '<project>/.env'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext keys. The vendor README shows BROWSER_USE_API_KEY and provider keys
      written to a project .env, and the shipped examples load it with dotenv.
    confidence: high
  - location: OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY / DEEPSEEK_API_KEY / GROK_API_KEY / NOVITA_API_KEY / AZURE_OPENAI_KEY
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext provider keys read from the process environment by
      browser_use/config.py. Note the Azure variable is AZURE_OPENAI_KEY here (paired
      with AZURE_OPENAI_ENDPOINT), not the AZURE_OPENAI_API_KEY name other tools use.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  velociraptor_artifact: Custom.AIAgents.BrowserUse
atlas_techniques:
  - AML.T0086
  - AML.T0053
attack_techniques:
  - T1185
  - T1539
  - T1552
references:
  - title: "browser-use/browser-use"
    url: https://github.com/browser-use/browser-use
    accessed: "2026-08-13"
last_verified: "2026-08-13"
