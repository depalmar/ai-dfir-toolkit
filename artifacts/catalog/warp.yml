# AI agent artifact catalog entry
# AIRT-0046 - Warp
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0046
name: Warp
aliases:
  - warp-terminal
  - Warp Terminal
vendor: Warp Dev, Inc.
category: coding-agent-cli
description: Agentic terminal. Every command, its output, exit code, working directory and timing is recorded in a local SQLite database rather than in a shell history file, and an in-terminal agent can propose and run commands.
website: https://www.warp.dev
status: active
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local command execution in the user's shell
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: false
  mcp_capable: true
risk: high
confidence: medium
abuse_potential: >-
  The command database is a near-complete narrative of operator activity on the
  host, including commands typed into a pane and never saved to shell history,
  which makes it a collection target for an attacker as well as for a responder.
  The agent can also propose and execute commands, so a prompt-injection surface
  exists wherever it reads untrusted output.
artifacts:
  disk:
    - path: "~/Library/Group Containers/2BBY89MBSN.dev.warp/Library/Application Support/dev.warp.Warp-Stable/warp.sqlite"
      os:
        - macos
      artifact_type: database
      description: >-
        Command history, output, exit codes, working directories and timings. This is
        the highest-value artifact the tool produces and it has no shell-history
        equivalent - commands run in Warp do not reach .zsh_history. Collect the -wal
        and -shm siblings with it or recent activity is lost.
      forensic_value: high
      evidence_type:
        - user-activity
        - execution
        - timeline
      confidence: medium
    - path: "%LOCALAPPDATA%\\warp\\Warp\\data\\warp.sqlite"
      os:
        - windows
      artifact_type: database
      description: Windows location of the command database. Same contents as the macOS path.
      forensic_value: high
      evidence_type:
        - user-activity
        - execution
        - timeline
      confidence: medium
    - path: "~/.local/state/warp-terminal/warp.sqlite"
      os:
        - linux
      artifact_type: database
      description: >-
        Linux location of the command database, under XDG_STATE_HOME when that is set.
        The warp.sqlite-wal beside it holds writes not yet checkpointed.
      forensic_value: high
      evidence_type:
        - user-activity
        - execution
        - timeline
      confidence: medium
    - path: "%LOCALAPPDATA%\\warp\\Warp\\config\\settings.toml"
      os:
        - windows
      artifact_type: config-file
      description: Settings, including any configured AI and MCP behaviour
      forensic_value: medium
      evidence_type:
        - configuration
      confidence: medium
    - path: "~/.config/warp-terminal/settings.toml"
      os:
        - linux
      artifact_type: config-file
      description: Settings on Linux. The macOS equivalent lives inside the group container above.
      forensic_value: medium
      evidence_type:
        - configuration
      confidence: medium
  network:
    - direction: egress
      indicator: app.warp.dev
      description: >-
        Cloud sync and inference endpoint. Traffic from the terminal process is expected;
        the forensic question is what was synced, which is answered server-side rather
        than on the host.
      confidence: low
      unverified: true
  process:
    - name: warp
      os:
        - linux
        - macos
      typical_children: The user's shell and every command run in it
      persistence: None (user-invoked)
      confidence: medium
credentials: []
mcp: []
collection:
  triage_priority: p1
  guidance: >-
    Collect warp.sqlite together with its -wal and -shm siblings before the
    application is closed or the host is rebooted, or the most recent commands are
    lost. Treat the database as the primary execution timeline for this host - it
    records commands that never reach shell history. Cloud sync means the local
    copy may not be the whole record; scope the account as well as the endpoint.
  kape_target: Warp
  velociraptor_artifact: Custom.AIAgents.Warp
atlas_techniques:
  - AML.T0053
attack_techniques:
  - T1059
references:
  - title: "Warp file and folder locations"
    url: https://docs.warp.dev/terminal/settings/file-locations/
    accessed: "2026-08-13"
  - title: "Warp command history"
    url: https://docs.warp.dev/terminal/entry/command-history/
    accessed: "2026-08-13"
last_modified: "2026-08-13"
