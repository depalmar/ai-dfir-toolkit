    url: https://github.com/Kilo-Org/kilocode
    accessed: "2026-08-13"
  - title: "kilocode-legacy - file locations"
    url: https://github.com/Kilo-Org/kilocode-legacy/blob/main/docs/file-locations.md
    accessed: "2026-08-13"
