# AI agent artifact catalog entry
# AIRT-0018 - LM Studio
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0018
name: LM Studio
aliases:
  - lm-studio
  - lmstudio
vendor: LM Studio (Element Labs)
category: llm-runtime
description: GUI local model runner with OpenAI-compatible server, CLI (lms), and daemon (llmster). MCP host capable.
supported_os:
  - windows
  - macos
  - linux
execution_model: Fully local inference
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: null
  mcp_capable: true
risk: high
confidence: high
abuse_potential: "'Serve on Local Network' / LMS_SERVER_HOST=0.0.0.0 exposes the API. Model download = unvetted binary blobs on disk."
artifacts:
  disk:
    - path: "%LOCALAPPDATA%\\Programs\\LM Studio\\LM Studio.exe"
      os:
        - windows
      artifact_type: binary
      description: Binary for LM Studio, in a directory named with a space
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: EXE installer
      confidence: high
    - path: ~/.lmstudio/bin/lms  |  ~/.lmstudio/bin/lms.exe
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Headless control CLI
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: Created after first GUI run
      confidence: high
    - path: llmster
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Background service process
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: medium
    - path: ~/.lmstudio/models/
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: "Publisher/model/*.gguf layout"
      forensic_value: medium
      evidence_type:
        - program-presence
        - data-access
      install_method: n/a
      confidence: high
    - path: ~/.lmstudio/settings.json
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Server bind address and port, absent on Windows 0.3.22
      forensic_value: high
      evidence_type:
        - configuration
      install_method: n/a
      unverified: true
      confidence: low
    - path: ~/.lmstudio/.internal/
      os:
        - windows
      artifact_type: config-dir
      description: Real config surface, roughly 20 JSON files including MCP state
      forensic_value: high
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
    - path: ~/.lmstudio/.internal/last-synced-mcp-state.json
      os:
        - windows
      artifact_type: mcp-config
      description: Last synced MCP server state
      forensic_value: high
      evidence_type:
        - configuration
        - execution
      install_method: n/a
      confidence: high
    - path: ~/.lmstudio/credentials/
      os:
        - windows
      artifact_type: config-dir
      description: Credential store directory, empty on the host checked
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: high
  registry:
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\<LM Studio GUID>"
      value: InstallLocation
      type: REG_SZ
      description: >-
        Install metadata. The key name is a bare GUID, so it cannot be found by
        name - enumerate the subkeys and match DisplayName, which reads
        "LM Studio <version>" and carries the version for free.
      persistence: false
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Software\\Classes\\lmstudio\\shell\\open\\command"
      value: (Default)
      type: REG_SZ
      description: The lmstudio:// protocol handler, naming the install path
      persistence: true
      forensic_value: medium
      confidence: high
    - key: "HKCU\\Environment"
      value: LMS_SERVER_HOST
      type: REG_SZ
      description: 0.0.0.0 = network exposure of the OpenAI-compatible API
      persistence: false
      forensic_value: medium
      confidence: medium
  network:
    - direction: listener
      indicator: OpenAI-compatible API
      port: 1234/TCP
      description: ""
      confidence: high
      default_bind: "127.0.0.1 (0.0.0.0 if 'Serve on Local Network')"
      authentication: NONE
      exposure_risk: high
    - direction: egress
      indicator: huggingface.co, lmstudio.ai
      port: 443/TCP
      description: Model downloads
      confidence: high
  process:
    - name: LM Studio.exe, llmster.exe, lms.exe
      os:
        - windows
      typical_parent: explorer.exe
      typical_children: "-"
      service_or_daemon: llmster daemon
      persistence: Run key (optional)
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with LM Studio.exe, llmster.exe, lms.exe"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials: []
mcp:
  - mechanism: config-file
    config_path: ~/.lmstudio/mcp.json
    config_key: mcpServers
    spawn_mechanism: Child process at app start, and on save - the file is hot reloaded
    secrets_location: env block (plaintext)
    persistence_trigger: Every app start
    triage_priority: p1
    confidence: high
    notes: Cursor's mcp.json notation. This is the documented path; see the row below before concluding it is absent.
  - mechanism: config-file
    config_path: ~/.cache/lm-studio/mcp.json
    config_key: mcpServers
    spawn_mechanism: Child process at app start
    secrets_location: env block (plaintext)
    persistence_trigger: Every app start
    triage_priority: p1
    confidence: medium
    unverified: true
    notes: Where the file actually was on macOS in an open vendor bug report, against a documented ~/.lmstudio. Check both before recording a miss.
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: LMStudio
  velociraptor_artifact: Custom.AIAgents.LMStudio
atlas_techniques:
  - AML.T0024
  - AML.T0029
  - AML.T0054
attack_techniques:
  - T1543
  - T1133
  - T1105
  - T1590
