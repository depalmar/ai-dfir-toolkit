    url: https://lmstudio.ai/docs/app
    accessed: "2026-08-13"
  - title: "lms - LM Studio CLI"
    url: https://lmstudio.ai/docs/cli
    accessed: "2026-08-13"
  - title: "lmstudio-ai/docs"
    url: https://github.com/lmstudio-ai/docs
