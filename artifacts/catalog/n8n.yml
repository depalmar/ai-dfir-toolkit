# AI agent artifact catalog entry
# AIRT-0025 - n8n (AI Agent / LangChain nodes)
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0025
name: n8n (AI Agent / LangChain nodes)
aliases:
  - n8n
vendor: n8n GmbH
category: workflow-engine
description: Self-hostable workflow automation with native AI Agent / SQL Agent LangChain nodes and MCP support.
supported_os:
  - linux
  - windows
  - docker
execution_model: Cloud or local inference + workflow exec
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: Code node = arbitrary JS/Python execution. Exposed 5678 without auth = full workflow + credential compromise. Webhook nodes are ingress.
artifacts:
  disk:
    - path: "~/.n8n/  |  /home/node/.n8n"
      os:
        - windows
        - macos
        - linux
      artifact_type: data-dir
      description: database.sqlite, config, encryptionKey
      forensic_value: medium
      evidence_type:
        - program-presence
      install_method: npm / Docker
      confidence: high
    - path: N8N_ENCRYPTION_KEY
      os:
        - windows
        - macos
        - linux
      artifact_type: env-var
      description: High-value secret
      forensic_value: high
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
  registry:
    - key: "HKCU\\Environment"
      value: N8N_ENCRYPTION_KEY
      type: REG_SZ
      description: Decrypts all stored n8n credentials - crown jewel
      persistence: false
      forensic_value: medium
      confidence: high
  network:
    - direction: listener
      indicator: n8n editor UI + REST API + webhooks
      port: 5678/TCP
      description: Exposed 5678 without auth = full workflow + credential compromise. Webhooks are unauthenticated ingress by design.
      confidence: high
      default_bind: "0.0.0.0"
      authentication: Basic auth OPTIONAL
      exposure_risk: critical
  process:
    - name: node (n8n)
      os:
        - linux
        - docker
      typical_parent: systemd / dockerd
      typical_children: node (task runner), python (Code node)
      service_or_daemon: "YES"
      persistence: "systemd unit or Docker restart:always"
      confidence: high
credentials:
  - location: ~/.n8n/database.sqlite
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: encryption-key
    description: Credentials encrypted with N8N_ENCRYPTION_KEY - key theft = full cred compromise
    confidence: high
mcp:
  - mechanism: database
    indicator: Workflow JSON in database.sqlite containing node type n8n-nodes-langchain.toolmcp or n8n-nodes-langchain.mcptrigger
    config_key: workflow nodes
    spawn_mechanism: Connection opened when the workflow executes
    secrets_location: n8n credential store, encrypted with ~/.n8n/encryptionKey
    persistence_trigger: Every workflow execution, including schedule and webhook triggers
    triage_priority: p1
    confidence: medium
    notes: The MCP Server Trigger node makes the n8n instance an MCP server as well as a client, so the same database answers both directions
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: n8n
  velociraptor_artifact: Custom.AIAgents.n8n
atlas_techniques:
  - AML.T0053
  - AML.T0081
  - AML.T0086
attack_techniques:
  - T1059
  - T1133
  - T1543
references:
  - title: "n8n-io/n8n"
    url: https://github.com/n8n-io/n8n
    accessed: "2026-08-13"
  - title: "n8n-io/n8n-docs"
    url: https://github.com/n8n-io/n8n-docs
    accessed: "2026-08-13"
  - title: "n8n docs - MCP Client Tool node"
    url: https://docs.n8n.io/integrations/builtin/cluster-nodes/sub-nodes/n8n-nodes-langchain.toolmcp
    accessed: "2026-08-13"
  - title: "n8n docs - MCP Server Trigger node"
    url: https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-langchain.mcptrigger
    accessed: "2026-08-13"
