id: AIRT-0023
name: KoboldCpp
vendor: LostRuins (OSS)
category: llm-runtime
description: Single-binary llama.cpp derivative with a built-in web UI.
supported_os:
  - windows
  - macos
  - linux
execution_model: Fully local inference
capabilities:
  local_code_execution: false
  local_listener: true
  plaintext_credentials: null
  mcp_capable: false
risk: medium
confidence: medium
abuse_potential: Single portable .exe - trivially dropped and run without install. Named in Splunk strt local-LLM analytics.
artifacts:
  network:
    - direction: listener
      indicator: Kobold API + web UI
      port: 5001/TCP
      description: ""
      confidence: medium
      default_bind: "127.0.0.1"
      authentication: NONE
      exposure_risk: medium
  process:
    - name: koboldcpp.exe
      os:
        - windows
      typical_parent: explorer.exe / shell
      typical_children: "-"
      service_or_daemon: "No"
      persistence: None - PORTABLE SINGLE BINARY
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with koboldcpp.exe"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials: []
mcp: []
collection:
  triage_priority: p2
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
