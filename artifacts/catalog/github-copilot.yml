      indicator: api.github.com, copilot-proxy.githubusercontent.com, api.githubcopilot.com
      port: 443/TCP
      description: Token exchange at api.github.com/copilot_internal/v2/token
      confidence: high
  process:
    - name: copilot-language-server / node
      os:
        - windows
        - macos
        - linux
      typical_parent: Code.exe / cursor / nvim
      typical_children: git, gh, node (MCP)
      service_or_daemon: "No"
      persistence: None
      confidence: high
