# AI agent artifact catalog entry
# AIRT-0003 - GitHub Copilot (Agent Mode / CLI)
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0003
name: GitHub Copilot (Agent Mode / CLI)
aliases:
  - GitHub Copilot
  - github-copilot
  - copilot
  - github.copilot-
vendor: GitHub/Microsoft
category: coding-agent-ide
description: copilot-language-server binary + Copilot CLI. Agent mode runs multi-step tasks with tool calls; bundles a GitHub MCP server.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local tool exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: Custom .agent.md files define autonomous behavior. Token exchange via api.github.com/copilot_internal/v2/token.
artifacts:
  disk:
    - path: copilot-language-server (per-platform native binary)
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: github/copilot-language-server-release
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: IDE extension / release artifact
      confidence: high
    - path: "node <pkg>/@github/copilot-language-server/dist/language-server.js --stdio"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Node variant; also --node-ipc
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: npm
      confidence: high
    - path: ~/.copilot/
      os:
        - windows
        - macos
        - linux
      artifact_type: config-dir
      description: mcp-config.json, lsp-config.json, agents/
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: Copilot CLI
      confidence: high
    - path: ~/.copilot/mcp-config.json
      os:
        - windows
        - macos
        - linux
      artifact_type: mcp-config
      description: Execution primitive
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: Copilot CLI
      confidence: high
    - path: "~/.copilot/agents/*.agent.md  |  <repo>/.github/agents/*.agent.md"
      os:
        - windows
        - macos
        - linux
      artifact_type: agent-definition
      description: Custom autonomous agent definitions - review on clone
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: n/a
      confidence: high
    - path: "%USERPROFILE%\\.vscode\\extensions\\github.copilot-*"
      os:
        - windows
      artifact_type: install-dir
      description: Extension Dir for GitHub Copilot (Agent Mode / CLI)
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: VS Code
      confidence: high
  network:
    - direction: egress
      indicator: api.github.com, copilot-proxy.githubusercontent.com, api.githubcopilot.com
      port: 443/TCP
      description: Token exchange at api.github.com/copilot_internal/v2/token
      confidence: high
  process:
    - name: copilot-language-server / node
      os:
        - windows
        - macos
        - linux
      typical_parent: Code.exe / cursor / nvim
      typical_children: git, gh, node (MCP)
      service_or_daemon: "No"
      persistence: None
      confidence: high
  registry:
    - key: "HKCU\\Environment"
      value: COPILOT_HOME, COPILOT_PROVIDER_API_KEY
      type: REG_SZ
      description: >-
        COPILOT_HOME relocates the CLI configuration directory including
        mcp-config.json, so an absence at the default path is not evidence of
        absence until this is read
      forensic_value: medium
      persistence: false
      confidence: medium
credentials:
  - location: 'OS keyring: service `copilot-cli` (macOS Keychain, Windows Credential Manager, Linux libsecret/GNOME Keyring/KWallet)'
    os: [windows, macos, linux]
    storage: os-keyring
    secret_type: oauth-token
    description: >-
      Default for Copilot CLI. Vendor: 'the CLI stores your OAuth token in your
      operating system's keychain under the service name copilot-cli'. Not a file -
      requires keychain acquisition, not file collection.
    confidence: high
  - location: ~/.copilot/config.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext fallback for the Copilot CLI OAuth token. Vendor: when the system
      keychain is unavailable (e.g. Headless Linux without libsecret) the CLI prompts to
      store the token in a plaintext configuration file here. The same file also holds
      CLI-managed internal application state including authentication data. Relocated
      wholesale if COPILOT_HOME is set.
    confidence: high
  - location: '~/.copilot/mcp-oauth-config/'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      plaintext. Vendor-documented Copilot CLI directory holding MCP OAuth token,
      registration, and PKCE fallback files for MCP servers the agent connects to. Scope
      is per-MCP-server, so this is where third-party service tokens land.
    confidence: high
  - location: '~/.copilot/mcp-secrets/'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: unknown
    description: >-
      plaintext. Vendor-documented Copilot CLI directory containing fallback file
      storage and an index for MCP secret placeholders.
    confidence: high
  - location: COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN
    os: [windows, macos, linux, docker, container, cloud]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      Plaintext environment variables. Vendor-documented credential precedence for
      Copilot CLI: these are checked in this order before the OS keychain, so an env-var
      token overrides the keyring and leaves no file artifact. Collect process
      environment, shell rc files and CI job definitions.
    confidence: high
  - location: COPILOT_PROVIDER_API_KEY
    os: [windows, macos, linux, docker, container, cloud]
    storage: plaintext
    secret_type: api-key
    description: >-
      Plaintext environment variable. BYOK provider API key. Vendor: when BYOK provider
      env vars (COPILOT_PROVIDER_BASE_URL, COPILOT_PROVIDER_API_KEY) are configured the
      CLI uses them for model requests regardless of authentication status - so prompts
      and code context go to whatever endpoint COPILOT_PROVIDER_BASE_URL names.
    confidence: high
  - location: '~/.config/github-copilot/apps.json'
    os: [macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      plaintext. Copilot editor OAuth token written by the copilot-language-server used
      by the VS Code, JetBrains and Neovim integrations. Distinct from the Copilot CLI
      store. Not vendor-documented, but read as the canonical token location by numerous
      independent projects.
    confidence: medium
  - location: '%LOCALAPPDATA%\github-copilot\apps.json'
    os: [windows]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      plaintext. Windows location of the Copilot editor OAuth token (same file as the
      Unix ~/.config/github-copilot/apps.json). Four independent implementations resolve
      Windows via LOCALAPPDATA; one outlier uses AppData\Roaming, so check both if the
      Local path is absent.
    confidence: medium
  - location: '~/.config/github-copilot/hosts.json'
    os: [macos, linux]
    storage: plaintext
    secret_type: oauth-token
    description: >-
      plaintext. Legacy predecessor of apps.json, still present on hosts authenticated
      by older plugin versions. Consumers routinely check hosts.json and apps.json in
      turn, so collect both. Windows equivalent sits in the same
      %LOCALAPPDATA%\github-copilot\ directory.
    confidence: medium
mcp:
  - config_path: "~/.copilot/mcp-config.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start
    secrets_location: env block
    persistence_trigger: Every CLI invocation
    triage_priority: p1
    notes: >-
      Copilot CLI, read natively by the agent host. COPILOT_HOME relocates the
      whole directory, so a responder checking only the default path misses a
      moved config - read the environment before concluding there is none.
  - config_path: "<repo>/.mcp.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start in the workspace
    secrets_location: env block
    persistence_trigger: Every CLI invocation in the workspace
    triage_priority: p1
    notes: >-
      Workspace scope, and portable across the agent host and other Copilot
      tools. Travels with the repo.
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: GitHubCopilot
  velociraptor_artifact: Custom.AIAgents.GitHubCopilot
atlas_techniques: []
attack_techniques: []
references:
  - title: "GitHub Copilot documentation"
    url: https://docs.github.com/en/copilot
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
