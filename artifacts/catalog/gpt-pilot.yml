# AI agent artifact catalog entry
# AIRT-0016 - GPT Pilot
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0016
name: GPT Pilot
aliases:
  - gpt-pilot
  - Pythagora
vendor: Pythagora (OSS)
category: agent-framework
description: Python agent that scaffolds and runs full applications, executing generated code.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: false
risk: high
confidence: low
abuse_potential: Runs generated code on host. Thin public sourcing on canonical paths - inventory by Python process command line.
artifacts:
  registry:
    - key: "HKCU\\Environment"
      value: OPENAI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY
      type: REG_SZ
      description: >-
        Provider credentials. Relevant to the AIRT-CS-0001 supply-chain case: the
        payload harvested whatever credentials the host held, and a persistently
        set user variable is reachable by any process running as that user.
      forensic_value: medium
      persistence: false
      confidence: medium
credentials:
  - location: '<install>/config.json'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Primary credential file. Plaintext JSON with llm.<provider>.api_key for openai /
      anthropic / azure / groq. Created by the vendor's documented setup step "cp
      example-config.json config.json"; the --config argument defaults to the bare
      string "config.json", so it resolves relative to the working directory the agent
      is launched from - normally the repo root. The same file's db.url carries an
      embedded user:password when the operator switches from the default sqlite to
      PostgreSQL. Listed in .gitignore, so it is present on disk but absent from the
      repo.
    confidence: high
  - location: '<install>/pilot/.env'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Legacy plaintext env file from pre-rewrite gpt-pilot: OPENAI_API_KEY,
      ANTHROPIC_API_KEY, GROQ_API_KEY, AZURE_API_KEY, OPENROUTER_API_KEY plus matching
      *_ENDPOINT values. Still forensically live - the current build's importer reads
      this path on startup when config.json does not yet exist and copies the keys into
      config.json, so an upgraded host can hold the same live key in both files. Collect
      both.
    confidence: high
  - location: '<install>/data/database/pythagora.db'
    os: [windows, macos, linux]
    storage: sqlite
    secret_type: jwt-signing-key
    description: >-
      Default project-state sqlite DB (confirms the VERIFICATION.md path correction).
      Holds secrets, not just state: when the agent decides the application it is
      scaffolding needs authentication it mints jwt_secret and refresh_token_secret - 32
      random bytes hex each - and persists them into the knowledge_base.user_options
      JSON column. These are the generated application's signing keys, stored inside the
      agent's own database.
    confidence: high
  - location: 'OPENAI_API_KEY  |  ANTHROPIC_API_KEY  |  GROQ_API_KEY'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      Documented fallback: when llm.<provider>.api_key is null in config.json the
      provider SDK reads its standard environment variable instead. A host with a
      config.json full of nulls is not a host without credentials - check the
      environment, shell rc files and any systemd/Docker env for the running python
      process.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references:
  - title: "Pythagora-io/gpt-pilot"
    url: https://github.com/Pythagora-io/gpt-pilot
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
