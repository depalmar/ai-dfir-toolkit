# AI agent artifact catalog entry
# AIRT-0036 - OpenAI Codex CLI
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0036
name: OpenAI Codex CLI
aliases:
  - openai-codex-cli
  - codex
  - "@openai/codex"
vendor: OpenAI
category: coding-agent-cli
description: "Terminal coding agent installed via npm @openai/codex (also Homebrew cask / winget). Binary `codex`. Reads AGENTS.md."
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local tool exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: ~/.codex/auth.json holds a ChatGPT OAuth token in plaintext. Session rollout files capture full prompt+response history including source code.
artifacts:
  disk:
    - path: "codex  (npm -g @openai/codex; brew cask; winget)"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Binary for OpenAI Codex CLI
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: npm/brew/winget
      confidence: high
    - path: ~/.codex/config.toml
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: "Contains [mcp_servers] blocks - execution primitive"
      forensic_value: high
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
    - path: ~/.codex/history.jsonl
      os:
        - windows
        - macos
        - linux
      artifact_type: session-artifact
      description: Prompt history - forensic timeline source
      forensic_value: high
      evidence_type:
        - user-activity
        - timeline
      install_method: n/a
      confidence: high
    - path: "~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl"
      os:
        - windows
        - macos
        - linux
      artifact_type: session-artifact
      description: Full session transcript incl. Source code - high-value exfil scoping artifact.
      forensic_value: high
      evidence_type:
        - user-activity
        - data-access
        - timeline
      install_method: n/a
      confidence: high
    - path: ~/.codex/logs/codex-tui.log
      os:
        - windows
        - macos
        - linux
      artifact_type: log
      description: Log for OpenAI Codex CLI
      forensic_value: high
      evidence_type:
        - timeline
        - execution
      install_method: n/a
      confidence: high
    - path: CODEX_HOME
      os:
        - windows
        - macos
        - linux
      artifact_type: env-var
      description: Relocates the entire artifact set - check before concluding absence
      forensic_value: medium
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
    - path: AGENTS.md
      os:
        - windows
        - macos
        - linux
      artifact_type: rules-file
      description: Prompt-injection surface, travels with repo
      forensic_value: low
      evidence_type:
        - configuration
        - prompt-injection-surface
      install_method: n/a
      confidence: high
  network:
    - direction: egress
      indicator: api.openai.com, chatgpt.com (OAuth)
      port: 443/TCP
      description: ""
      confidence: high
  process:
    - name: codex / node
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: sh, bash, cmd.exe, powershell.exe, git, node (MCP)
      service_or_daemon: "No"
      persistence: None
      confidence: high
  registry:
    - key: "HKCU\\Environment"
      value: CODEX_HOME
      type: REG_SZ
      description: >-
        Relocates the entire Codex configuration directory, config.toml and MCP
        servers included. Set persistently here it survives reboots, and a
        responder who checks only ~/.codex concludes there is no configuration
        at all. Read this before reporting an absence.
      forensic_value: high
      persistence: false
      confidence: medium
credentials:
  - location: ~/.codex/auth.json
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: oauth-token
    description: Plaintext ChatGPT OAuth token
    confidence: high
mcp:
  - config_path: "~/.codex/config.toml"
    config_key: "[mcp_servers.<name>] command + args, or url for HTTP servers"
    spawn_mechanism: stdio child process at CLI start
    secrets_location: env block; HTTP servers name an env var in bearer_token_env_var
    persistence_trigger: Every CLI invocation
    triage_priority: p1
    notes: User scope. TOML not JSON.
  - config_path: "<repo>/.codex/config.toml"
    config_key: "[mcp_servers.<name>]"
    spawn_mechanism: stdio child process at CLI start in the project
    secrets_location: env block
    persistence_trigger: Every CLI invocation in the project
    triage_priority: p1
    notes: >-
      Project scope, applied only to trusted projects. Travels with the repo, so
      review it on every clone.
  - config_path: "/etc/codex/config.toml"
    config_key: "[mcp_servers.<name>]"
    spawn_mechanism: stdio child process at CLI start
    secrets_location: env block
    persistence_trigger: Every CLI invocation by any user
    triage_priority: p1
    notes: >-
      System scope on Unix, and the one most likely to be missed - it applies to
      every user on the host, not just the one under investigation
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: OpenAICodexCLI
  velociraptor_artifact: Custom.AIAgents.OpenAICodexCLI
atlas_techniques:
  - AML.T0051
  - AML.T0053
  - AML.T0081
attack_techniques:
  - T1059
  - T1552.001
  - T1071.001
references:
  - title: "openai/codex"
    url: https://github.com/openai/codex
    accessed: "2026-08-13"
  - title: "OpenAI Codex help centre article"
    url: https://help.openai.com/en/articles/11096431-openai-codex
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
