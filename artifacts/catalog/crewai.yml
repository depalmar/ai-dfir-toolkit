# AI agent artifact catalog entry
# AIRT-0028 - CrewAI
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0028
name: CrewAI
vendor: CrewAI Inc. (OSS)
category: agent-framework
description: Role-based multi-agent orchestration. The crewai CLI scaffolds src/<name>/config/agents.yaml + tasks.yaml and src/<name>/crew.py.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: medium
abuse_potential: Crewai-tools includes code-execution and file-read tools. YAML defines autonomous agent goals - a tamper target.
artifacts:
  disk:
    - path: "<project>/src/<name>/config/agents.yaml  |  <project>/src/<name>/config/tasks.yaml"
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: >-
        Autonomous goal definitions. Scaffolded under src/<name>/config/, not the
        project root - collecting <project>/config/ finds nothing on a real install.
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: crewai create crew
      confidence: high
    - path: "<project>/src/<name>/crew.py"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Entrypoint for CrewAI
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: crewai create crew
      confidence: medium
  process:
    - name: python / crewai
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: python, sh
      service_or_daemon: "No"
      persistence: None
      confidence: medium
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image is a shared interpreter (python / crewai) and CommandLine contains crewai"
      description: >-
        Proves the agent ran, which disk presence does not. The image name is not
        the discriminator here, because the process is a shared interpreter that
        hosts much of this catalog - key on the command line instead. The child
        processes of this event are what the agent actually did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: "<project>/.env"
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: api-key
    description: Provider keys via LiteLLM
    confidence: medium
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references:
  - title: "crewAIInc/crewAI"
    url: https://github.com/crewAIInc/crewAI
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
