# AI agent artifact catalog entry
# AIRT-0042 - Open WebUI
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0042
name: Open WebUI
aliases:
  - open-webui
vendor: Open WebUI (OSS)
category: llm-runtime
description: >-
  Self-hosted web interface for local and remote LLMs, formerly Ollama WebUI.
  Multi-user with RBAC, RAG document ingestion, and a Tools/Functions system that
  executes Python. Usually deployed via Docker; also installable via pip.
website: https://openwebui.com
status: active
supported_os:
  - linux
  - docker
  - windows
  - macos
execution_model: Local or remote inference, self-hosted multi-user server
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: >-
  The first account registered on a fresh instance is automatically the
  administrator, so an instance reachable before its owner registers can be taken
  over outright by whoever signs up first. Tools and Functions execute Python
  server-side. The OpenAI router exposes a catch-all proxy that forwards requests
  upstream using the admin-configured API key, turning an authenticated account
  into free use of the organisation's inference spend. Multiple RCE, ssrf, and
  information-disclosure CVEs have shipped against it.

artifacts:
  disk:
    - path: /app/backend/data/
      os: [linux, docker]
      artifact_type: data-dir
      description: >-
        Root of all persistent state. DATA_DIR relocates it. If the volume was
        never mounted, all state lives in the container's writable layer and is
        lost on recreation - check before concluding data was deleted.
      forensic_value: high
      evidence_type: [data-access, configuration]
      confidence: high
    - path: /app/backend/data/webui.db
      os: [linux, docker]
      artifact_type: database
      description: >-
        Primary SQLite database - users, roles, chats, API keys, Tools and
        Functions source, RAG metadata. The single highest-value artifact on the
        host; contains full conversation history and stored Python.
      forensic_value: high
      evidence_type: [user-activity, data-access, timeline, credential-access]
      confidence: high
    - path: /app/backend/data/.webui_secret_key
      os: [linux, docker]
      artifact_type: credential-file
      description: >-
        Auto-generated JWT signing key, written here when WEBUI_SECRET_KEY is not
        set in the environment and reloaded on restart
      forensic_value: high
      evidence_type: [credential-access]
      confidence: high
    - path: /app/backend/data/config.json
      os: [linux, docker]
      artifact_type: config-file
      description: >-
        Persisted application config. Note the tiered config model - database
        settings override environment variables unless ENABLE_PERSISTENT_CONFIG is
        false, so the running config may not match the env you were shown.
      forensic_value: high
      evidence_type: [configuration]
      confidence: high
    - path: /app/backend/data/uploads/ and vector store directory
      os: [linux, docker]
      artifact_type: data-dir
      description: >-
        RAG document uploads and embedding store. Scope data exposure here - users
        commonly upload internal documents.
      forensic_value: high
      evidence_type: [data-access]
      confidence: medium
    - path: .env (deployment directory)
      os: [linux, docker, windows, macos]
      artifact_type: credential-file
      description: >-
        Deployment env file. Commonly holds WEBUI_SECRET_KEY, OPENAI_API_KEY,
        OLLAMA_BASE_URL, and WEBUI_ADMIN_PASSWORD in plaintext.
      forensic_value: high
      evidence_type: [credential-access, configuration]
      confidence: high
    - path: docker-compose.yml / docker run invocation
      os: [linux, docker]
      artifact_type: config-file
      description: >-
        Records port mapping, volume mounts, and env injection. Establishes whether
        the instance was network-exposed and whether state was persisted.
      forensic_value: high
      evidence_type: [configuration]
      confidence: high
    - path: '%LOCALAPPDATA%\Programs\open-webui\'
      os: [windows]
      artifact_type: install-dir
      description: Electron desktop app root
      forensic_value: medium
      evidence_type: [program-presence]
      install_method: EXE installer
      confidence: high
    - path: '%LOCALAPPDATA%\open-webui-updater\'
      os: [windows]
      artifact_type: install-dir
      description: Update staging, holds the downloaded installer
      forensic_value: low
      evidence_type: [program-presence]
      install_method: EXE installer
      confidence: high
    - path: '%APPDATA%\open-webui\'
      os: [windows]
      artifact_type: config-dir
      description: Electron user data, with the backend state under data
      forensic_value: high
      evidence_type: [program-presence, configuration]
      install_method: n/a
      confidence: high
    - path: '%APPDATA%\open-webui\config.json'
      os: [windows]
      artifact_type: config-file
      description: Desktop app configuration
      forensic_value: high
      evidence_type: [configuration]
      install_method: n/a
      confidence: high
    - path: '%APPDATA%\open-webui\data\'
      os: [windows]
      artifact_type: data-dir
      description: Desktop equivalent of the container DATA_DIR
      forensic_value: high
      evidence_type: [program-presence, data-access]
      install_method: n/a
      confidence: high
    - path: '%APPDATA%\open-webui\data\webui.db'
      os: [windows]
      artifact_type: database
      description: Users, chats, API keys and tool source, same schema as the container
      forensic_value: high
      evidence_type: [data-access, configuration]
      install_method: n/a
      confidence: high
    - path: '%APPDATA%\open-webui\data\uploads\  |  %APPDATA%\open-webui\data\vector_db\'
      os: [windows]
      artifact_type: data-dir
      description: Uploaded documents and the vector store
      forensic_value: high
      evidence_type: [data-access]
      install_method: n/a
      confidence: high
  registry:
    - key: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\<Open WebUI GUID>"
      value: DisplayName, DisplayVersion
      type: REG_SZ
      description: >-
        Install metadata. The key name is a bare GUID, so enumerate subkeys and
        match DisplayName, which reads "Open WebUI" and carries the version.
      persistence: false
      forensic_value: medium
      confidence: high
  network:
    - direction: listener
      indicator: Open WebUI HTTP server (uvicorn)
      port: 8080/TCP in container, commonly published as 3000/TCP on the host
      default_bind: 0.0.0.0 within the container
      authentication: Application login; first registrant becomes admin
      exposure_risk: critical
      description: >-
        Published with -p 3000:8080 in the documented quick start. An instance
        exposed before first registration can be claimed by any visitor.
      confidence: high
    - direction: egress
      indicator: Configured inference backends via OLLAMA_BASE_URL / OPENAI_API_BASE_URL
      port: 443/TCP, 11434/TCP
      description: >-
        Both are endpoint-override variables - a modified value silently redirects
        all prompts and documents to an attacker-controlled proxy
      confidence: high
    - direction: egress
      indicator: Direct Connections to user-supplied OpenAI-compatible servers
      port: 443/TCP
      description: >-
        User-configurable external model servers. The feature behind CVE-2025-64496;
        a hostile server could reach the victim's browser session.
      confidence: high

credentials:
  - location: '%APPDATA%\open-webui\data\.key'
    os: [windows]
    storage: plaintext
    secret_type: jwt-signing-key
    description: >-
      Session signing key on the desktop build. Named .key here, not
      .webui_secret_key as in the container layout - collecting only the
      documented container name misses it entirely.
    confidence: high
  - location: '%APPDATA%\open-webui\data\webui.db'
    os: [windows]
    storage: sqlite
    secret_type: api-key
    description: >-
      Desktop copy of the user and API key tables, plus Tools and Functions
      Python source. Quit the app before acquisition so the WAL is checkpointed.
    confidence: high
  - location: /app/backend/data/.webui_secret_key
    os: [linux, docker]
    storage: plaintext
    secret_type: jwt-signing-key
    description: >-
      Signs session tokens. Theft permits forging a session for any user including
      an administrator. Rotating it invalidates all existing sessions - which is
      also the containment action after suspected theft.
    confidence: high
  - location: webui.db (user and API key tables)
    os: [linux, docker]
    storage: sqlite
    secret_type: api-key
    description: >-
      Per-user API keys and hashed passwords. Admin-configured upstream provider
      keys are also reachable through the application.
    confidence: high
  - location: WEBUI_ADMIN_EMAIL / WEBUI_ADMIN_PASSWORD / WEBUI_ADMIN_NAME
    os: [linux, docker]
    storage: plaintext
    secret_type: admin-credential
    description: >-
      Headless admin creation on first startup. The password is hashed before
      storage, but the environment variable itself is frequently left in plaintext
      in compose files, shell history, and container inspect output.
    confidence: high
  - location: Tools and Functions Python source stored in webui.db
    os: [linux, docker]
    storage: sqlite
    secret_type: embedded-credentials
    description: >-
      Tool source commonly embeds hard-coded API keys and internal service URLs.
      This is exactly what CVE-2026-70491 exposed to non-admin users.
    confidence: high

mcp:
  - mechanism: database
    indicator: Tool server registrations in webui.db - added per user in Settings or globally in Admin Settings
    config_key: tool servers
    spawn_mechanism: HTTP call to the proxy, not a child process - Open WebUI reaches MCP through mcpo rather than speaking it directly
    secrets_location: Tool server auth in webui.db; the MCP servers' own secrets sit in the mcpo config
    persistence_trigger: Every chat that invokes the tool
    triage_priority: p1
    confidence: medium
    notes: Registration is per user as well as global, so an admin view of the tool list is not the whole list
  - mechanism: config-file
    config_path: <mcpo config> (Claude Desktop format, path set at mcpo launch)
    config_key: mcpServers
    spawn_mechanism: mcpo spawns each MCP server over stdio and republishes it as REST
    secrets_location: env block (plaintext)
    persistence_trigger: Every mcpo start, and on hot reload
    triage_priority: p1
    confidence: medium
    unverified: true
    notes: Separate process from Open WebUI, frequently a separate container - collecting the Open WebUI volume alone misses it entirely
collection:
  triage_priority: p1
  guidance: >-
    Snapshot the whole DATA_DIR volume before touching the container - recreating
    a container without the volume destroys everything. webui.db is the priority
    artifact; it carries chats, users, API keys, and stored Python in one file.
    Capture the compose file or docker run invocation to establish exposure and
    whether persistence was configured. Record the version, since which CVEs apply
    is version-dependent. If .webui_secret_key may have been read, rotate it and
    force re-authentication. On the Windows desktop build the same state sits
    under %APPDATA%\open-webui\data\, and the session signing key is named .key
    rather than .webui_secret_key - collecting only the container name misses it.
  kape_target: OpenWebUI
  velociraptor_artifact: Custom.AIAgents.OpenWebUI

atlas_techniques: [AML.T0024, AML.T0029, AML.T0082]
