# AI agent artifact catalog entry
# AIRT-0037 - Google Gemini CLI
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0037
name: Google Gemini CLI
aliases:
  - google-gemini-cli
  - gemini
  - "@google/gemini-cli"
  - gemini-cli
vendor: Google
category: coding-agent-cli
description: "Terminal agent installed via npm @google/gemini-cli. Binary `gemini`. Supports system-wide policy config."
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference + local tool exec
capabilities:
  local_code_execution: true
  local_listener: false
  plaintext_credentials: true
  mcp_capable: true
risk: critical
confidence: high
abuse_potential: ~/.gemini/oauth_creds.json stores access + refresh + id tokens with expiry and scope in plaintext. System-level /etc/gemini-cli/settings.json is a privileged tamper target.
artifacts:
  disk:
    - path: "gemini  (npm -g @google/gemini-cli)"
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Binary for Google Gemini CLI
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: npm
      confidence: high
    - path: ~/.gemini/settings.json
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Auth type at security.auth.selectedType; MCP servers
      forensic_value: high
      evidence_type:
        - configuration
      install_method: n/a
      confidence: high
    - path: /etc/gemini-cli/settings.json
      os:
        - linux
      artifact_type: config-file
      description: System-level policy - privileged tamper/persistence target
      forensic_value: high
      evidence_type:
        - execution
        - persistence
        - configuration
      install_method: n/a
      confidence: high
  network:
    - direction: egress
      indicator: generativelanguage.googleapis.com, oauth2.googleapis.com, accounts.google.com
      port: 443/TCP
      description: ""
      confidence: high
  process:
    - name: gemini / node
      os:
        - windows
        - macos
        - linux
      typical_parent: shell
      typical_children: sh, bash, git, node (MCP)
      service_or_daemon: "No"
      persistence: None
      confidence: high
  eventlog:
    - channel: Microsoft-Windows-Sysmon/Operational
      event_id: "1"
      selector: "Image ends with gemini / node"
      description: >-
        Proves the agent ran, which disk presence does not. The child processes of
        this event are what the agent actually did, and the parent tells you
        whether a human started it or something else did.
      requires: >-
        Sysmon deployed with process creation logging. Security 4688 is the
        fallback where it is not, but it carries CommandLine only when Include
        command line in process creation events is enabled - so on a host
        without that setting one interpreter process is indistinguishable from
        another.
      evidence_type:
        - execution
        - timeline
      os:
        - windows
      forensic_value: high
      confidence: medium
credentials:
  - location: ~/.gemini/oauth_creds.json
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: oauth-token
    description: Plaintext access + refresh + id tokens, expiry, scope
    confidence: high
  - location: ~/.gemini/google_accounts.json
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: api-key
    description: Bound Google account identity - user attribution artifact
    confidence: high
  - location: ~/.gemini/.env  (plus cwd-upward .env search)
    os:
      - windows
      - macos
      - linux
    storage: plaintext
    secret_type: api-key
    description: GEMINI_API_KEY distinct from Vertex GOOGLE_API_KEY
    confidence: high
mcp:
  - mechanism: config-file
    config_path: "~/.gemini/settings.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start
    secrets_location: >-
      env block; the CLI expands environment variables here, so the value on disk
      may be a reference rather than the secret itself
    persistence_trigger: Every CLI invocation
    triage_priority: p1
    notes: User scope
  - mechanism: config-file
    config_path: "<repo>/.gemini/settings.json"
    config_key: mcpServers
    spawn_mechanism: Child process at CLI start in the workspace
    secrets_location: env block
    persistence_trigger: Every CLI invocation in the workspace
    triage_priority: p1
    notes: Workspace scope. Travels with the repo.
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: GoogleGeminiCLI
  velociraptor_artifact: Custom.AIAgents.GoogleGeminiCLI
atlas_techniques:
  - AML.T0051
  - AML.T0053
  - AML.T0081
attack_techniques:
  - T1059
  - T1552.001
  - T1071.001
references:
  - title: "google-gemini/gemini-cli"
    url: https://github.com/google-gemini/gemini-cli
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
