# AI agent artifact catalog entry
# AIRT-0026 - LangChain / LangGraph
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0026
name: LangChain / LangGraph
vendor: LangChain Inc. (OSS)
category: agent-framework
description: Dominant agent-building library. Deployed as bespoke services - no fixed install path.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud or local inference
capabilities:
  local_code_execution: true
  local_listener: true
  plaintext_credentials: true
  mcp_capable: true
risk: high
confidence: high
abuse_potential: Shell/Python REPL tools are standard. No canonical path = inventory by process command line and imported module names.
artifacts: {}
credentials:
  - location: '<project>/langgraph.json'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      LangGraph CLI project config. Its `env` field accepts an INLINE JSON object of
      environment variables, so provider API keys are frequently stored PLAINTEXT inside
      this file itself (vendor example shows an OPENAI_API_KEY entry under `env`).
      Present only for LangGraph CLI / Platform projects.
    confidence: high
  - location: '<project>/.env'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: api-key
    description: >-
      PLAINTEXT provider and LangSmith keys. Vendor README documents `"env": "./.env"`
      in langgraph.json; the CLI helper `_parse_env_from_config` resolves the `env`
      field or falls back to a .env file.
    confidence: high
  - location: 'LANGSMITH_API_KEY  |  LANGCHAIN_API_KEY'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      PLAINTEXT LangSmith tracing key in the process environment; LANGCHAIN_API_KEY is
      the legacy alias and is still read. Forensically important beyond the key itself:
      if tracing was enabled, full prompts and responses were shipped to LangSmith, so
      this key indicates an off-host copy of agent activity exists.
    confidence: high
  - location: 'OPENAI_API_KEY / ANTHROPIC_API_KEY (and per-provider equivalents)'
    os: [windows, macos, linux, docker]
    storage: plaintext
    secret_type: api-key
    description: >-
      PLAINTEXT provider keys read from the process environment by the langchain-*
      partner packages. langchain_openai documents that the key "can be inferred from
      the OPENAI_API_KEY environment variable". LangChain ships no managed credential
      file - the environment and .env ARE the credential store, so collect process
      environment blocks.
    confidence: high
mcp: []
collection:
  triage_priority: p1
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0053
  - AML.T0086
attack_techniques:
  - T1059
  - T1552.001
references: []
