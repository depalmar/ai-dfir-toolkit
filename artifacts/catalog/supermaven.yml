# AI agent artifact catalog entry
# AIRT-0010 - Supermaven
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0010
name: Supermaven
vendor: Supermaven
category: code-completion
description: Low-latency completion agent with very large context window. Downloads its own agent binary. Integrated in Zed and VS Code.
supported_os:
  - windows
  - macos
  - linux
execution_model: Cloud inference
capabilities:
  local_code_execution: false
  local_listener: false
  plaintext_credentials: true
  mcp_capable: false
risk: medium
confidence: low
abuse_potential: Large context = large code egress per request. Thin public sourcing on canonical paths.
artifacts:
  disk:
    - path: Downloaded Supermaven agent binary (editor-managed)
      os:
        - windows
        - macos
        - linux
      artifact_type: binary
      description: Thin sourcing - validate locally
      forensic_value: medium
      evidence_type:
        - execution
        - program-presence
      install_method: Editor extension
      confidence: low
      unverified: true
    - path: "~/.config/zed/settings.json"
      os:
        - windows
        - macos
        - linux
      artifact_type: config-file
      description: Zed config, with supermaven named under inline_completion_provider
      forensic_value: low
      evidence_type:
        - program-presence
      install_method: Zed
      confidence: medium
  network:
    - direction: egress
      indicator: "*.supermaven.com"
      port: 443/TCP
      description: ""
      confidence: low
      unverified: true
credentials:
  - location: ~/.supermaven/config.json
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: unknown
    description: >-
      Plaintext account key written by the sm-agent binary. Field names observed in a
      real-world instance: api_key, api_key_obtained_at, link_id. ~/.supermaven is
      confirmed as Supermaven's data root by the vendor's own Neovim plugin (falls back
      to $XDG_DATA_HOME/supermaven when that variable is set, so check there too).
      Single-quality-source on the credential file itself - verify before relying on it.
    unverified: true
    confidence: low
  - location: '<project>/.supermaven/config.json'
    os: [windows, macos, linux]
    storage: plaintext
    secret_type: unknown
    description: >-
      plaintext. Same config file, created relative to the working directory rather than
      under $HOME - reported on the vendor's own repo as sm-agent creating
      .supermaven/config.json in the project dir on startup. Forensically material
      because an account key can land inside a repo working tree and be committed. Worth
      a repo-wide sweep when Supermaven is in scope.
    unverified: true
    confidence: low
mcp: []
collection:
  triage_priority: p2
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
  kape_target: Supermaven
  velociraptor_artifact: Custom.AIAgents.Supermaven
atlas_techniques:
  - AML.T0024
attack_techniques:
  - T1071.001
  - T1105
references:
  - title: "supermaven-inc/supermaven-nvim"
    url: https://github.com/supermaven-inc/supermaven-nvim
    accessed: "2026-08-13"
last_verified: "2026-08-13"
last_modified: "2026-08-11"
