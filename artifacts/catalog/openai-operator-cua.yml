# AI agent artifact catalog entry
# AIRT-0034 - OpenAI Operator / CUA
# Schema: ../schema/artifact.schema.json
# Defensive reference. Artifact locations for IR collection and analysis.

id: AIRT-0034
name: OpenAI Operator / CUA
aliases:
  - OpenAI Operator
  - CUA
  - openai-operator-cua
vendor: OpenAI
status: eol
category: computer-use-agent
description: Cloud-hosted computer-using agent operating a remote browser. Folded into ChatGPT agent mode during 2025 and the standalone operator.chatgpt.com preview was sunset, so the capability survives inside ChatGPT while this entry's own surface does not. Kept because historic network telemetry still contains the old domain and a responder working an older window needs to know what it was.
supported_os:
  - cloud
execution_model: Fully cloud-hosted
capabilities:
  local_code_execution: false
  local_listener: false
  plaintext_credentials: false
  mcp_capable: false
risk: low
confidence: medium
abuse_potential: Minimal endpoint footprint; credentials handed to a remote agent session. Network/DLP telemetry only.
artifacts:
  network:
    - direction: egress
      indicator: "operator.chatgpt.com (sunset)"
      port: 443/TCP
      description: >-
        Dead domain. It served the standalone Operator preview, which was
        retired after the capability moved into ChatGPT agent mode, so a hit on
        this in current traffic is not Operator - but a hit in retained 2025
        telemetry dates the activity precisely.
      confidence: medium
    - direction: egress
      indicator: "chatgpt.com, *.openai.com"
      port: 443/TCP
      description: >-
        Where the capability lives now. Indistinguishable from ordinary ChatGPT
        use at the network layer, which is the point worth recording: after the
        merge there is no endpoint or network artifact that separates agent mode
        from a normal session.
      confidence: medium
credentials: []
mcp: []
collection:
  triage_priority: p3
  guidance: Collect config and credential paths before any reboot or agent restart; several agents rotate or truncate session logs. Capture the MCP config before remediation - it records what the agent was authorised to run.
atlas_techniques:
  - AML.T0086
attack_techniques:
  - T1113
  - T1185
  - T1071.001
references:
  - title: "Introducing ChatGPT agent: bridging research and action"
    url: https://openai.com/index/introducing-chatgpt-agent/
    accessed: "2026-08-13"
  - title: "ChatGPT agent - OpenAI Help Center"
    url: https://help.openai.com/en/articles/11752874-chatgpt-agent
    accessed: "2026-08-13"
  - title: "Introducing Operator"
    url: https://openai.com/index/introducing-operator/
    accessed: "2026-08-13"
