{
  "queries": {
    "aiagent_agent_processes": {
      "query": "SELECT p.name, p.path, p.cmdline, p.uid, u.username, p.start_time FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.name IN ('ollama','lms','llmster','jan','gpt4all','llama-server','llama-cli','koboldcpp','claude','codex','gemini','goose','aider','interpreter','kiro','langflow','openhands');",
      "interval": 3600,
      "platform": "posix",
      "description": "Inventory running AI agents and local LLM runtimes."
    },
    "aiagent_agent_listeners": {
      "query": "SELECT l.address, l.port, l.protocol, p.name, p.path, p.cmdline FROM listening_ports l JOIN processes p ON l.pid = p.pid WHERE l.port IN (11434,1234,1337,4891,5001,5678,7860,3000,8000,8080);",
      "interval": 1800,
      "description": "AI service listeners. Rows where address is not 127.0.0.1 or ::1 are network-exposed and, for most of these runtimes, unauthenticated."
    },
    "aiagent_mcp_configs": {
      "query": "SELECT path, size, mtime, uid FROM file WHERE path LIKE '/Users/%/Library/Application Support/Claude/claude_desktop_config.json' OR path LIKE '/Users/%/.cursor/mcp.json' OR path LIKE '/home/%/.config/Claude/claude_desktop_config.json' OR path LIKE '/home/%/.cursor/mcp.json' OR path LIKE '/Users/%/.kiro/settings/mcp.json' OR path LIKE '/home/%/.kiro/settings/mcp.json';",
      "interval": 3600,
      "platform": "posix",
      "description": "MCP configuration inventory. Track mtime for change detection."
    },
    "aiagent_plaintext_credentials": {
      "query": "SELECT path, size, mtime, mode, uid FROM file WHERE path LIKE '/Users/%/.codex/auth.json' OR path LIKE '/home/%/.codex/auth.json' OR path LIKE '/Users/%/.gemini/oauth_creds.json' OR path LIKE '/home/%/.gemini/oauth_creds.json' OR path LIKE '/Users/%/.aider/oauth-keys.env' OR path LIKE '/home/%/.aider/oauth-keys.env' OR path LIKE '/Users/%/.config/goose/secrets.yaml' OR path LIKE '/home/%/.config/goose/secrets.yaml';",
      "interval": 3600,
      "platform": "posix",
      "description": "Plaintext AI credential files. Check mode - anything group- or world-readable is an immediate finding."
    },
    "aiagent_model_files": {
      "query": "SELECT path, size, mtime FROM file WHERE path LIKE '/Users/%/.ollama/models/blobs/%' OR path LIKE '/usr/share/ollama/.ollama/models/blobs/%' OR path LIKE '/Users/%/.lmstudio/models/%';",
      "interval": 86400,
      "platform": "posix",
      "description": "Model file inventory. Note the Ollama systemd service runs as its own user, so models live under /usr/share/ollama, not the invoking user's home."
    },
    "aiagent_agent_autostart_macos": {
      "query": "SELECT name, path, program, program_arguments, run_at_load FROM launchd WHERE name LIKE '%claude%' OR name LIKE '%ollama%' OR name LIKE '%cursor%' OR name LIKE '%kiro%';",
      "interval": 3600,
      "platform": "darwin",
      "description": "AI agent persistence via LaunchAgents and LaunchDaemons."
    }
  }
}