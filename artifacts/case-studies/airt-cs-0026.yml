  - type: pattern
    value: "Files named artex-probe- followed by a five-digit number, with various extensions"
    description: A default artefact of the framework, reported by an incident response team in an intrusion by a different user of it. Not reported for this actor, and an operator can change it
  - type: pattern
    value: Accounts created with ArtexProbe in the name, and web shells with short incrementing names of the form cl1217.jsp, f1219a.jsp, z1219.jsp
    description: As above. The framework numbers what it creates, so one find points to its neighbours
  - type: malware
    value: WISP
    description: Open-source remote-access tool used for persistence and lateral movement. The post gives no file name, path or hash
  - type: malware
    value: vshell
    description: As above
  - type: malware
    value: AdaptixC2
    description: As above
  - type: behavior
    value: A web server or application process running netcat or curl to fetch a file from an address it has not contacted before
    description: How the remote-access tools arrived. The post's own hunt baselines curl targets over a week and reports new ones, and notes curl has legitimate uses
  - type: behavior
    value: Many varied requests to one internet-facing application in a short time, with failures retried or abandoned at machine tempo, from Nmap, curl, wget, Python or headless Chromium user agents
    description: The scanning signature the post attributes to agentic tooling. Operators change user agents readily, so it identifies and does not block
response_actions:
  - phase: contain
    action: Search proxy, firewall and web server logs for all nine addresses, including both forms of the disputed one, across at least the period since 19 October 2026. On any server that contacted them, capture memory and the process tree before restarting anything, since none of the three tools has a published on-disk indicator.
  - phase: eradicate
    action: On affected web servers, list files created by the web server's account in the upload and temporary directories, cron entries and services added since the first contact, and outbound connections that persist. Remove what is found and close the upload or request-forgery flaw that let it in.
  - phase: recover
    action: Rotate credentials stored on or reachable from the compromised servers, including database and cloud credentials in application configuration, and review authentication from those servers to internal systems for the lateral movement the post reports.
  - phase: harden
    action: Require authentication on file upload endpoints, restrict what internet-facing applications may request on the server's behalf, and alert when a web server process starts a download tool or a shell.
lesson: >-
  This is the case the guide's "where did the AI run" section exists for. The
  agent was on the actor's server and what reached the victim was scanning, an
  exploited web application and a conventional remote-access tool, so the
  catalog has no row and the investigation is an ordinary web server
  compromise run faster. The published indicators are all network addresses
  with a short life, and one of them is printed two ways in the source. The
  one rule linked here matches a default file name the framework leaves, taken
  from another party's intrusion report, which makes it a tripwire for a
  careless operator and nothing more.
