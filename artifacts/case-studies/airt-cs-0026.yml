  basis: >-
    Microsoft says the cluster primarily targets financial organisations in
    Southeast Asia and a smaller number of large financial organisations
    globally. It names no country and gives no count.
summary: >-
  Microsoft reports that in October 2026 Storm-3358, which it describes as a
  financially motivated, Cambodia-based intrusion cluster, began using the
  agentic offensive framework ARTEX against financial organisations. The
  actor runs ARTEX alongside conventional automated tools to scan
  internet-facing systems and exploit flaws that include anonymous file
  upload and server-side request forgery. ARTEX agents were then seen using
  netcat and curl to fetch remote-access tools onto the compromised systems,
  and the actor used three open-source ones - WISP, vshell and AdaptixC2 -
  for persistence and lateral movement. The post lists ARTEX's default tools
  as Nmap, curl, wget, Python HTTP clients, a web-fetch SDK and headless
  Chromium driven by Playwright, and says their default user agents and
  signatures can help identify the traffic.
