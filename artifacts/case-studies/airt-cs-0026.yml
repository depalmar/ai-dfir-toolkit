# AI agent artifact case study
# AIRT-CS-0026 - Storm-3358 and ARTEX: Agent-Driven Scanning and Exploitation of Financial Organisations

id: AIRT-CS-0026
title: "Storm-3358 and ARTEX - Agent-Driven Scanning and Exploitation of Financial Organisations"
date_range: Oct 2026 to at least 6 Nov 2026, when every published indicator was still active
disclosed: "2026-11-06"
affects: Internet-facing web applications of the targeted organisations - no catalogued endpoint tool
confidence: medium
basis: >-
  One reporting party, read from the page itself, and a short account. The
  post gives no victim count, no outcome, no vulnerability identifier and no
  host artifact for any of the three remote-access tools it names. It names
  no model and says only that some published addresses are ARTEX servers. Its
  figure showing the download commands is an image whose text could not be
  read for this entry. Several of its statements describe ARTEX-related
  attacks in general, not this actor, and are kept out of the indicators for
  that reason.
contested: >-
  The post's indicator table and its own hunting query disagree on one
  address: the table lists 178.16.54[.]129 and the query lists
  178.15.54[.]129. Nothing in the post says which is right, so both are
  recorded here and neither should be dropped from a search. The post does
  not say whether Storm-3358 is connected to Storm-0940, the other actor
  Microsoft reports using the same framework.
