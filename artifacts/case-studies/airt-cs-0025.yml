# AI agent artifact case study
# AIRT-CS-0025 - ARTEX Harvests Exposed Secrets From Public Repositories and Signs In as the Application

id: AIRT-CS-0025
title: "ARTEX Harvests Exposed Secrets From Public Repositories and Signs In as the Application"
date_range: Aug 2026 (repository searches first observed) onward; application sign-ins from 28 Oct 2026
disclosed: "2026-11-05"
affects: Application secrets and AI service keys exposed in public repositories, and the Entra ID and Azure resources they unlock - no catalogued endpoint tool
confidence: medium
basis: >-
  One reporting party, read from the page itself. Microsoft attributes the
  activity to no one: it calls the network indicators unattributed and two of
  the addresses only "potentially associated" with the campaign, and one of
  the four is a Tor exit node. The post gives no victim count, sector or
  country, names no model and does not say where the framework ran. It
  credits one other vendor with reporting a similar campaign from the same
  addresses; that report was not read for this entry.
