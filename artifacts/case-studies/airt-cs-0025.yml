# AI agent artifact case study
# AIRT-CS-0025 - ARTEX Harvests Exposed Secrets From Public Repositories and Signs In as the Application

id: AIRT-CS-0025
title: "ARTEX Harvests Exposed Secrets From Public Repositories and Signs In as the Application"
date_range: Aug 2026 (repository searches first observed) onward; application sign-ins from 28 Oct 2026, still under way on 3 Nov 2026
disclosed: "2026-11-03"
affects: Application secrets and AI service keys exposed in public repositories, and the Entra ID and Azure resources they unlock - no catalogued endpoint tool
confidence: medium
basis: >-
  Two parties writing from their own data, both read from the page. A managed
  security provider published the campaign on 3 November from what it saw in
  its customers' tenants, and Microsoft's post two days later credits that
  report and adds the repository searches and the framework. The intrusion,
  its scale and the data taken are the provider's first-hand account. That an
  agentic framework drove it is Microsoft's: the provider first put AI
  involvement at low confidence and then said Microsoft's findings matched its
  assessment, which is agreement and not a second observation. Nobody
  attributes the activity to an actor. Microsoft calls the network indicators
  unattributed and two of the addresses only "potentially associated", and no
  source names a model or says where the framework ran.
contested: >-
  Whether this is the same operation as the October compromise of a backup
  vendor's applications (AIRT-CS-0024). The provider that saw both assesses
  them as unrelated. Microsoft places both under the same framework and
  attributes this one to nobody, and a shared open-source tool is not a shared
  operator. The two sources also describe one address differently: Microsoft
  flags 199.19.77[.]18 as a Tor exit node, and the provider reports password
  spraying through the Azure command-line client from it and from
  65.87.223[.]26, linked to the operator with low to moderate confidence.
