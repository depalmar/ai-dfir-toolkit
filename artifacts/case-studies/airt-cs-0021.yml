summary: Anthropic reports a single French-speaking actor who used Claude to develop and debug
  a WordPress re-installation race exploit, build a Rust scanner that validated exposed API
  keys, and manage agents for reconnaissance and post-authentication work. Anthropic counts
  42 targets, internal access to at least 14, and 12 to 26 GB exfiltrated. The haul included
  political membership and donor records. Reported persistence included web shells hidden
  in font assets and credential-harvesting WordPress must-use plugins.
