response_actions:
- phase: contain
  action: Hunt the published addresses and onion services, and inspect wp-content/mu-plugins
    and font asset directories on WordPress estates for unexpected PHP.
- phase: eradicate
  action: Restore from backups verified clean. The actor poisoned backups, so check backup
    integrity before relying on one.
- phase: recover
  action: Rotate every API key found in public repositories or containers the actor's scanner
    could have validated.
lesson: One operator with a model ran a campaign that used to need a team. The persistence
  was ordinary, but its placement (fonts, must-use plugins, backups) was chosen to survive
  a routine clean-up.
