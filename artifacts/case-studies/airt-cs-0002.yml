# AI agent artifact case study
# AIRT-CS-0002 - postmark-mcp npm Backdoor - First In-the-Wild Malicious MCP Server

id: AIRT-CS-0002
title: postmark-mcp npm Backdoor - First In-the-Wild Malicious MCP Server
date_range: 2025-09-17 (published) to ~2025-09-25 (removed)
disclosed: 2025-09
affects: MCP ecosystem
confidence: high
basis: >-
  Discovered and published by Koi Security, with the backdoored version, the
  publishing account and the exfiltration address all recoverable from the npm
  registry record, and corroborated independently by Snyk and Qualys.
atlas:
  - AML.T0010
  - AML.T0104
summary: "npm package postmark-mcp v1.0.16, published by user 'phanpak', silently BCC'd every email processed through it to an attacker-controlled address. 1,643 downloads before removal. Koi Security called it the first real-world sighting of a malicious MCP server."
iocs:
  - type: package
    value: "postmark-mcp@1.0.16"
    description: Backdoored version
  - type: npm-user
    value: phanpak
    description: Publishing account
  - type: email
    value: "phan@giftshop[.]club"
    description: BCC exfiltration destination
response_actions:
  - Enumerate every MCP config for postmark-mcp and pin/remove.
  - Treat all email processed through the server during the window as disclosed.
  - "Audit MCP configs for @latest version specifiers, which would have pulled the backdoor automatically."
lesson: An MCP server sits inside the trust boundary of the agent and inherits its credentials. Version-pinning MCP servers is not hygiene, it is a control.
references:
  - title: "The Hacker News - First Malicious MCP Server Found Stealing Emails in Rogue Postmark-MCP Package"
    url: https://thehackernews.com/2025/09/first-malicious-mcp-server-found.html
  - title: "Snyk - Malicious MCP Server on npm: postmark-mcp harvests emails"
    url: https://snyk.io/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/
  - title: "Dark Reading - Sneaky, Malicious MCP Server Exfiltrates Secrets via BCC"
    url: https://www.darkreading.com/application-security/malicious-mcp-server-exfiltrates-secrets-bcc
