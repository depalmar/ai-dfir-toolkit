  basis: 'Anthropic: a technology provider, an airline, an energy company, around 200 downstream
    SaaS customers, a French retail chain and a French ISP dataset.'
summary: Anthropic reports operators suspected to be ShinyHunters affiliates running a vibe-hacking
  loop. They gave Claude a general goal, such as using a stolen credential or retrieving data,
  then let it evaluate the environment and write and run scripts until the goal was met. Reported
  losses include more than 1 TB from one technology provider, tens of millions of passenger
  records from an airline, and data from around 200 downstream SaaS customers. The operators
  also ran credential-validation pipelines on EC2 workers, scanned decompiled mobile apps
  for secrets with TruffleHog, and moved stolen data through Telegram.
