title: GTG-50014 - ShinyHunters Affiliates Vibe-Hacking SaaS Estates
date_range: 2026 (activity window not stated)
disclosed: '2026-09-10'
affects: Claude models on the actor's side - no catalogued tool on victim hosts
confidence: medium
basis: A single reporting party with a published indicator set of 40 addresses, domains and
  Telegram identifiers. The ShinyHunters link is Anthropic's suspicion of affiliation, not
  an identification.
contested: Anthropic describes the operators as suspected affiliates of the ShinyHunters collective,
  not as the group itself.
