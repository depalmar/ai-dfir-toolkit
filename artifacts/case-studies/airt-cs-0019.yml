response_actions:
- phase: contain
  action: Block and hunt the published addresses and domains, and alert on outbound traffic
    to the listed exfiltration storage URL.
- phase: contain
  action: Inventory keys embedded in shipped mobile apps and any AWS SES or SNS credentials,
    which the actor validated at scale and abused.
- phase: recover
  action: Rotate SaaS integration tokens and cloud keys reachable from compromised tenants,
    and notify downstream customers whose data transited them.
lesson: The operator supplied goals and the model supplied the hands-on-keyboard work. The
  evidence that a tenant was worked this way is an unusually fast, unusually broad burst of
  API calls and ad-hoc scripts from one credential, not any single call.
