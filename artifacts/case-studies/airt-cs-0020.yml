response_actions:
- phase: contain
  action: Hunt the published egress addresses in web and WAF logs for the May to June 2026
    window.
- phase: harden
  action: Treat model-gateway and evaluation endpoints as internet-exposed attack surface,
    with the same testing and rate limits as the product itself.
lesson: AI companies are now a target class in their own right. What is being stolen is model
  access and pre-release weights, which a victimology built only on data theft would miss.
