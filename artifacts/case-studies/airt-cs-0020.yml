  basis: 'Anthropic: hotel booking platforms, then around 30 AI companies in about four days.'
summary: Anthropic reports a Russian-speaking, financially motivated actor with a history
  of intrusions against hotel booking and fintech platforms. It built a containerised pentest
  platform with a local model gateway and worker agents that tested injection, XSS, authentication
  bypass and SSRF. It then turned the pipeline on around 30 AI companies in about four days,
  with the stated goal of reaching a pre-release model.
