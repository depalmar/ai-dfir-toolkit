response_actions:
- phase: contain
  action: Block and hunt the published domains and addresses, and search mail logs for the
    two phishing persona senders.
- phase: contain
  action: Hunt for the published implant file names and SHA-256 hashes, including msedgeupdate_v3.exe
    and WUEngine.exe.
- phase: eradicate
  action: Review identity-provider sign-in logs for device-code authentication from unfamiliar
    clients during the window, and revoke refresh tokens for affected accounts.
- phase: harden
  action: Restrict the device-code authentication flow by Conditional Access where it has
    no business use.
lesson: The AI sits on the operator's side here; the victim sees ordinary espionage artefacts,
  just more of them, faster. The case belongs in this catalog because the operator's skill
  files are what drove it. If an operator's workstation is ever seized, the agent's skills
  directory and session store are its playbook, which is the reverse of the usual collection
  problem.
