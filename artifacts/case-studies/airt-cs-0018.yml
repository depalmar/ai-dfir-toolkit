summary: 'Anthropic reports a Russian-speaking operator whose tradecraft and targeting it
  assesses as consistent with Russian state-nexus espionage. Between December 2025 and August
  2026 the operator used Claude models across reconnaissance, device-code phishing infrastructure,
  bulk collection and keeping access. The human operator mostly edited the Claude Code skills
  that drove the workflows and let the workflows run. Victim-side artefacts are conventional:
  Windows implants, phishing domains and device-code phishing infrastructure.'
