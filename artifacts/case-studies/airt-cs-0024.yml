  - type: account
    value: 3f9cd7a0-127a-4ed4-bf06-2f830d5616b7
    description: Tenant id of the vendor's home tenant, as one responder published it. Service principal sign-in records carry the owning tenant, which finds the vendor's applications without a list of ids
  - type: pattern
    value: "User agents Python-urllib/3.12 and python-requests/2.31 on application sign-ins; Microsoft adds python-requests/2.34.2, curl/7.88.1 and azure-toolkit/1.0"
    description: The first two are the vendor's own findings. One responder did not see azure-toolkit/1.0 at all. Ordinary strings that legitimate automation also sends, so they narrow a search and prove nothing alone
  - type: pattern
    value: "User agent norma/0.4"
    description: Seen by a cloud security vendor in the overlapping activity against other software vendors, in a list it warns is otherwise noisy. The one string in that list with no ordinary sender
  - type: pattern
    value: The applications' normal sign-ins present a kiota-dotnet user agent from private Azure IPv6 addresses
    description: The baseline the vendor published. A sign-in for one of these applications from a public address with a Python client is outside it
  - type: behavior
    value: One application signing in to many tenants in ascending order of tenant id, one to six minutes apart
    description: Reported by a provider with sight of many customer tenants. A single tenant sees one sign-in; the ordering is visible only across tenants
  - type: behavior
    value: An application adding a credential to itself or to another application, or being added to a directory role, with an application as the initiator
    description: The persistence and privilege steps reported after a successful sign-in. In the audit log these are the operations the vendor lists - credential and secret management on an application, added service principal credentials, added owners, role members, app role assignments, delegated permission grants and consent
  - type: behavior
    value: One identity making twenty or more successful Key Vault secret reads within fifteen minutes across three or more vaults
    description: The shape of the bulk secret reads, as Microsoft's hunting guidance frames it
response_actions:
  - phase: contain
    action: Keep the affected vendor connections disabled, and do not delete the enterprise applications as the first step - the vendor's own guidance says the same, because deletion removes the configuration and the service principal the evidence is keyed to. Export Entra sign-in and audit logs, Microsoft 365 audit records and Graph activity logs now, because the default retention is days to weeks. Inventory all eight application ids in every tenant where they were ever consented to, including tenants that no longer use the product.
  - phase: eradicate
    action: Review service principal sign-ins for those applications from at least 1 October, successful and failed separately, and do not limit the review to the published addresses - the persistence activity one responder saw came from private Azure addresses. In the audit log, look for credentials, owners, role assignments and consent grants added by or to those applications, and to any other application in the tenant on the same days, and remove the ones nobody can account for once they are recorded.
  - phase: recover
    action: Rotate every secret in any Key Vault the applications could read and treat mail and files the applications could reach as exposed where post-sign-in activity is found. Confirm with the vendor that the replacement identities no longer use a shared secret before re-enabling the connection - it reports moving to federated credentials - and check that backup and restore still work.
  - phase: harden
    action: Review what each multitenant vendor application is permitted to do in the tenant and reduce it, alert on credential additions and role assignments made by applications, and restrict application sign-ins by location where the licence allows.
lesson: >-
  The AI in this case ran on the actor's infrastructure, so there is no agent
  transcript, config file or token on a victim host to collect, and the
  catalog has no row for it. What the victim holds is identity-provider
  logging with a short retention clock, which is why the telemetry tab lists
  it as a source of its own. It is also the case to read before repeating a
  headline about autonomous attacks: the parties who watched it in tenant logs
  could confirm the intrusion and could not confirm the agent, and the one
  detail that speaks to autonomy cuts against it. Evidence in the tenant
  answers what was done and when. Whether a model chose to do it is on the
  actor's server.
