summary: >-
  Microsoft reports that Storm-0940, which it describes as a China-state
  aligned actor, has used ARTEX since at least September 2026 to automate
  attacks on hundreds of organisations. ARTEX is described as an open-source,
  multi-agent penetration-testing framework that can drive any model and runs
  a test from reconnaissance to exfiltration with little human input. In
  October the actor took control of the identities of several ConnectWise
  cloud applications, among them Cloud Backup, and used the trust customers
  had already granted those applications to attempt sign-ins to more than
  2,250 tenants. Where a sign-in succeeded, the reported follow-on was
  reconnaissance through Microsoft Graph, credentials added to applications
  for persistence, changes to roles and groups including an application
  assigning itself Global Administrator, bulk reads of Key Vault secrets and
  mail access. A password spray from one of the same addresses on 10 to 14
  October hit 327 accounts in eight organisations and, by Microsoft's account,
  authenticated to none. Microsoft says some intrusions went from first
  targeting to privileged access in under three hours.
