# AI agent artifact case study
# AIRT-CS-0024 - Storm-0940 and ARTEX: A Vendor's Application Identities Used Against Its Customers' Tenants

id: AIRT-CS-0024
title: "Storm-0940 and ARTEX - A Vendor's Application Identities Used Against Its Customers' Tenants"
date_range: Sep 2026 (first ARTEX use Microsoft reports) to 16 Oct 2026; password spray 10 to 14 Oct 2026
disclosed: "2026-10-21"
affects: Microsoft Entra ID tenants reached through a vendor's multitenant applications - no catalogued endpoint tool
confidence: medium
basis: >-
  One reporting party, read from the page itself. Every figure is Microsoft's
  own telemetry. The post cites ConnectWise's advisories and one third-party
  write-up, none of which was read for this entry, so nothing here corroborates
  Microsoft independently, and those sources would bear on the application
  compromise, not on the AI. The post names no model, does not say where the
  framework ran, and describes the split between agent and operator only as
  "little needed human interaction". The AI ran on the actor's side, so a
  victim tenant holds sign-in and audit records and nothing that shows a model
  was involved.
contested: >-
  The post is careful about outcome and the reader should be too. It says most
  of the targeting failed, that the password spray produced no successful
  authentication, and that a successful application sign-in "does not
  necessarily indicate that customer data was accessed or exfiltrated". Count
  attempted tenants, authenticated tenants and tenants with post-sign-in
  activity as three different numbers. The post is also inconsistent with
  itself on one point - its text and infographic refer to four application
  credentials and it lists three application ids - so the published list may
  be incomplete.
