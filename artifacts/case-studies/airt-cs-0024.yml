response_actions:
  - phase: contain
    action: Keep the affected vendor connections disabled, and do not delete the enterprise applications first - deletion removes the configuration and the service principal the evidence is keyed to. Export Entra sign-in and audit logs, Microsoft 365 audit records and Graph activity logs now, because the default retention is days to weeks. Inventory the application ids in every tenant where they were ever consented to, including tenants that no longer use the product.
  - phase: eradicate
    action: Review service principal sign-ins for those applications from at least 1 October, successful and failed separately, and do not limit the review to the published addresses. In the audit log, look for credentials, owners, role assignments and consent grants added by or to those applications, and remove the ones nobody can account for once they are recorded.
  - phase: recover
    action: Rotate every secret in any Key Vault the applications could read and treat mail and files the applications could reach as exposed where post-sign-in activity is found. Confirm with the vendor that rotation removed the old credentials before re-enabling the connection, and check that backup and restore still work.
  - phase: harden
    action: Review what each multitenant vendor application is permitted to do in the tenant and reduce it, alert on credential additions and role assignments made by applications, and restrict application sign-ins by location where the licence allows.
lesson: >-
  The AI in this case ran on the actor's infrastructure, so there is no agent
  transcript, config file or token on a victim host to collect, and the
  catalog has no row for it. What the victim holds is identity-provider
  logging with a short retention clock, which is why the telemetry tab lists
  it as a source of its own. The agentic part shows only as tempo and breadth:
  thousands of tenants tried through one trusted identity, and privileged
  access inside three hours where it worked.
