# AI agent artifact case study
# AIRT-CS-0024 - Storm-0940 and ARTEX: A Vendor's Application Identities Used Against Its Customers' Tenants

id: AIRT-CS-0024
title: "Storm-0940 and ARTEX - A Vendor's Application Identities Used Against Its Customers' Tenants"
date_range: Sep 2026 (first ARTEX use Microsoft reports) to 18 Oct 2026; password spray 10 to 14 Oct, application sign-ins 15 Oct, vendor identities disabled 17 Oct 07:00 UTC
disclosed: "2026-10-16"
affects: Microsoft Entra ID tenants reached through a vendor's multitenant applications - no catalogued endpoint tool
confidence: medium
basis: >-
  Two layers with different support. That a vendor's application identities
  were used to sign in to its customers' tenants is established by four
  parties writing from their own data: the vendor's advisory, two managed
  security providers who watched it in their customers' sign-in logs, and
  Microsoft. A cloud security vendor separately reports the same addresses and
  tooling against other software vendors. That an AI agent drove it, and that
  the operator was Storm-0940, rests on Microsoft alone: the vendor says its
  attribution relies on intelligence Microsoft shared, and both providers say
  their telemetry is consistent with Microsoft's account and does not confirm
  it. The entry stays medium for that reason, because the AI is why the case
  is in this catalog. No source names a model or says where the framework ran.
  The AI ran on the actor's side, so a victim tenant holds sign-in and audit
  records and nothing that shows a model was involved.
contested: >-
  How much of this an agent did. Microsoft describes little human interaction.
  One responder puts an LLM's involvement at low-to-medium confidence on its
  own telemetry, medium-to-high given Microsoft's attribution, and reads the
  activity as scripted tooling steered by an operator. Its strongest evidence
  against full autonomy is that after one service principal was deleted,
  requests using it kept arriving every few seconds for 22 minutes, were
  rejected every time and never changed. It also notes that Microsoft does not
  say how it identified ARTEX or what ties the earlier password spray to the
  actor. The numbers measure different things and should not be added:
  Microsoft counts more than 2,250 tenants attempted; one provider counts
  almost 1,000 tenants with sign-in activity and over 300 successful among its
  own customers; the vendor gives no count. On outcome, Microsoft says a
  successful sign-in does not show data was taken, one provider saw tokens
  issued and nothing visibly taken, and another advises treating the
  application's data as exposed. The sources also disagree on which addresses
  did what: Microsoft lists three for application sign-ins, while one
  responder saw application sign-ins from 144.172.64[.]128 only and user
  password spraying from the others. Microsoft lists three application ids,
  the vendor disabled seven and names an eighth, and the root cause at the
  vendor was still under investigation when its advisory was last updated.
