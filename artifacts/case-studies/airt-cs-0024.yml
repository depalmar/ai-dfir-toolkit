  basis: >-
    Microsoft lists the industries the actor targets and counts "hundreds of
    organizations globally" for the ARTEX-driven activity, more than 2,250
    tenants for sign-in attempts through the vendor's applications, and 327
    accounts in eight organisations for the password spray. One managed
    security provider counts almost 1,000 tenants with sign-in activity and
    over 300 with a successful sign-in among its own customers. Nobody names a
    country or gives a count of organisations compromised.
summary: >-
  Microsoft reports that Storm-0940, which it describes as a China-state
  aligned actor, has used ARTEX since at least September 2026 to automate
  attacks on hundreds of organisations. ARTEX is described as an open-source,
  multi-agent penetration-testing framework that can drive any model and runs
  a test from reconnaissance to exfiltration with little human input. In
  October the actor obtained credentials for several ConnectWise cloud
  applications, among them Cloud Backup, and used the consent customers had
  already granted those applications to sign in to their tenants. The vendor
  dates its discovery to 14 October and disabled the affected identities on
  17 October at 07:00 UTC. Responders watching customer tenants saw the
  application sign-ins on 15 October between about 06:13 and 08:34 UTC, from
  one address, presenting a client assertion, and arriving in ascending order
  of tenant id one to six minutes apart, which is what a script walking a
  sorted list looks like. Where a sign-in succeeded, the reported follow-on
  was reconnaissance through Microsoft Graph, credentials added to
  applications for persistence, an application assigning itself Global
  Administrator, bulk reads of Key Vault secrets and mail access. One
  responder saw the persistence steps come from private Azure addresses, not
  from the published ones. A password spray on 10 to 14 October hit 327
  accounts in eight organisations and, by Microsoft's account, authenticated
  to none. Microsoft says some intrusions went from first targeting to
  privileged access in under three hours.
