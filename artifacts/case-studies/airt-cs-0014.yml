# AI agent artifact case study
# AIRT-CS-0014 - ShadowRay: AI Compute Clusters Exploited in the Wild

id: AIRT-CS-0014
title: "ShadowRay - AI Compute Clusters Exploited in the Wild"
date_range: Mar 2024 (first campaign) to Nov 2025 (ShadowRay 2.0)
disclosed: "2024-03-26"
affects: Ray (distributed compute) - no catalogued endpoint tool
confidence: high
basis: >-
  Vendor research by Oligo Security, which observed the exploitation in both
  campaigns and is the only party to have published doing so. What supports
  it from outside is acknowledgement, not a second observation. Anyscale wrote
  in March 2024 that it had been shown evidence of malicious exploitation and
  shipped a checking tool in response, and for the 2025 campaign told the
  press that unauthorised jobs were submitted through exposed endpoints while
  disputing that the fault lay in Ray. GitHub said it removed the accounts
  that hosted the second campaign's payloads. The affected vendor and the
  hosting platform accepting that it happened is why this stays high. The
  ATT&CK campaign and the ATLAS case study both cite Oligo and add nothing
  first-hand, and the trade press this entry used to lean on repeats Oligo.
  The indicators below are from the second campaign and from Oligo alone.
contested: >-
  CVE-2023-48022 is disputed. Anyscale's position is that unauthenticated job
  submission is intended behaviour for a framework meant to run inside a trusted
  network, so the CVE was never directly fixed. That disagreement is why exposure
  persists and why this is an exposure-management finding rather than a patching one.
  The actor link covers the second campaign only. In August 2026 Oligo assessed
  that the group later known as TeamPCP ran ShadowRay 2.0, on shared
  infrastructure and on sign-in records it says the code-hosting platform
  provided, and added that whether this is a rebrand, a shared set of operators
  or collaboration cannot be determined with certainty. Nobody else has
  published that link, and nothing ties the 2024 campaign to the group. CVE-2023-48022
  is not on CISA's KEV catalog. A different and later Ray flaw was added to it
  in August 2026, and the two should not be read as one.
atlas:
  - AML.T0006
  - AML.T0049
  - AML.T0055
  - AML.T0035
  - AML.T0025
  - AML.T0048.000
summary: >-
  Ray's Jobs API accepts job submissions without authentication. Internet-exposed
  clusters therefore give an attacker code execution on machines holding models,
  training data and cloud credentials. Oligo disclosed ShadowRay in March 2024 as
  the first known attack campaign against AI workloads in the wild, with thousands
  of exposed servers already compromised. In November 2025 Oligo documented
  ShadowRay 2.0, a global campaign turning exposed clusters into a self-propagating
  cryptomining botnet - multi-stage Bash and Python payloads that abuse Ray's own
  orchestration to deploy across every node and to spread cluster to cluster,
  running XMRig.
iocs:
  - type: behavior
    value: Job submission to the Ray Jobs API from outside the cluster network
    description: Recorded in Ray dashboard and jobs API access logs
  - type: behavior
    value: Submitted job definition carrying a multi-stage Bash or Python payload
    description: The job definition is the payload record and is retained by Ray
  - type: process
    value: XMRig or equivalent miner on a GPU host
    description: Observed payload in the ShadowRay 2.0 campaign
  - type: behavior
    value: Orchestration used to fan a job out to every node
    description: Ray's own scheduling is the lateral movement mechanism
  - type: behavior
    value: Outbound job submission from one cluster to another
    description: Cluster-to-cluster propagation observed in ShadowRay 2.0
  - type: pattern
    value: Ray dashboard reachable from the internet
    description: The precondition; the exposure is the vulnerability here
  - type: ip
    value: 18.228.3[.]224
    description: Primary command-and-control server for reverse shells in the second campaign, ports 48331 and 3876
  - type: ip
    value: 18.230.118[.]147
    description: Secondary command-and-control server and mining endpoint, ports 443 and 40331
  - type: ip
    value: 67.217.57[.]240
    description: File server for the netsh reverse-shell binary, port 666. Reverse shells to it ran from September to November 2025, and it is the address the later report ties to TeamPCP
  - type: ip
    value: 103.127.134[.]124
    description: Received reverse shells on ports 30654 and 30987. The later report says the same address signed in to the accounts that hosted the payloads
  - type: ip
    value: 45.61.150[.]83
    description: File server for the second-phase dropper, port 80
  - type: ip
    value: 45.95.168[.]100
    description: File server for downloaded binaries, port 8000
  - type: ip
    value: 185.215.180[.]70
    description: File server for downloaded binaries, port 8000
  - type: ip
    value: 162.248.53[.]119
    description: Payload server, port 8000
  - type: url
    value: hxxp://45[.]61[.]150[.]83/1mmy/xd.sh
    description: Second-phase dropper
  - type: hash
    value: 1f6c69403678646a60925dcffe8509d22bb570c611324b93bec9aea72024ef6b
    description: SHA-256 of the second-phase dropper xd.sh. The source also lists a hash for the miner, which is the legitimate XMRig release and proves nothing alone
  - type: domain
    value: masscan[.]cloud
    description: With matrix.masscan[.]cloud, staging infrastructure the later report links to this campaign. A compromised cluster fetched /ep9TS2/ndt.sh from it in July 2025
  - type: domain
    value: pool.supportxmr.com
    description: Primary mining pool, port 443 over TLS. A public pool that other miners also use; gulf.moneroocean.stream on 20128 and eu.zano.k1pool.com on 8866 were the others
  - type: file
    value: /usr/lib/dev/systemdev/dns-filter
    description: The miner under a name chosen to look like a DNS service. /tmp/dns is the alternative location
  - type: file
    value: /var/tmp/.ddns.sh
    description: Persistence script
  - type: file
    value: /etc/init.d/dns-filter
    description: Persistence through init.d
  - type: config
    value: "authorized_keys entry ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHy6WMgqslpdUCaumLmlUcBjBjuAk4KspADxbcAKrzYd root@archtop"
    description: Key appended by the payload for SSH access. Match the key material; the comment is trivially changed
  - type: config
    value: User crontab entry every 15 minutes piping a script named mon.sh from a code-hosting raw URL into bash
    description: Persistence and update channel. The hosting project and its replacement were removed in November 2025, so the entry now fails and is still evidence
  - type: process
    value: "kworker/0:0 or [kworker/0:0] as the name of a userland process"
    description: The miner renames itself by writing to /proc/$$/comm. A real kernel worker has no executable path and no command line
response_actions:
  - "Inventory exposure first. There is no patch to apply, so the finding is which clusters are reachable and from where."
  - Collect Ray dashboard and jobs API access logs, and the submitted job definitions - the definitions hold the payload and are the best evidence available.
  - "Scope the AI-specific impact separately from the miner: model weights, training data and pipeline credentials are what an attacker actually gained."
  - Harvest and rotate every cloud credential reachable from the cluster environment, including instance-profile and mounted secret material.
  - Check neighbouring clusters, since ShadowRay 2.0 propagated cluster to cluster rather than only host to host.
lesson: >-
  Not every AI incident is an AI-native attack. This one is a conventional
  unauthenticated-RCE intrusion whose impact is AI-specific - models, training data
  and pipeline credentials - and it anchors the point that responders need to
  understand the AI stack as infrastructure before reaching for exotic explanations.
  It also shows what a disputed CVE does to a defender: with no fix coming, the only
  control is exposure management, and the artifact of record is an access log rather
  than a patch level.
