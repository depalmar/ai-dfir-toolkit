summary: >-
  On 29 October 2026, from about 02:27 to 13:35 PDT by Cursor's account,
  Cursor's extension marketplace served tampered builds 2.1.312 and 2.1.313 of the extension published as
  anthropic.claude-code. Microsoft reports that on load the extension profiled
  the host and reported to a remote address, added an SSH key to the user's
  authorized keys, tried to enable the SSH service, opened a reverse tunnel to
  the same address and wrote persistence for the tunnel: a LaunchAgent on
  macOS, a crontab entry on Linux, a scheduled task or Startup-folder script on
  Windows. The Visual Studio Marketplace listing and the npm package
  @anthropic-ai/claude-code were not affected, and Anthropic told Microsoft its
  systems were not compromised and that it did not build the package. Cursor
  reported that errors and the need for administrator rights stopped SSH access
  on most macOS and Windows hosts. Cursor later gave the cause as a stolen
  credential used to write to the cache that serves its marketplace, with at
  most 5,000 users exposed and the last attacker activity on 1 November. An
  independent comparison found the tampered file to be the clean 2.1.312
  bundle with one unobfuscated loader of about 7 KB placed in front of it, and
  the build labelled 2.1.313 still identifying itself internally as 2.1.312,
  so the version a host reports is not a reliable test. Nobody attributes the
  activity.
iocs:
  - type: package
    value: anthropic.claude-code 2.1.312 and 2.1.313, installed from Cursor's extension marketplace
    description: The tampered builds, for Apple-silicon macOS and 64-bit Windows only. The same extension id from the Visual Studio Marketplace is not affected. The bundle inside the 2.1.313 package still reports 2.1.312, so match on file content and not on the version
  - type: hash
    value: fcbb327e38e61c4fec795e0d0591f52cd1014b813d20a5912104953c3a17c364
    description: SHA-256 of the tampered VSIX package, 2.1.312 for darwin-arm64, as Cursor published it. A hash of the download, so it finds a cached or archived package and not an installed extension
  - type: hash
    value: 3de1722901165769893bef57c72594e9a54459faa23f3091b136b79966edd081
    description: SHA-256 of the tampered VSIX package, 2.1.312 for win32-x64
  - type: hash
    value: 80402fdcad8799285fd93044976973ca000da7995fb93363f819bb8e4f84ee6c
    description: SHA-256 of the tampered VSIX package, 2.1.313 for darwin-arm64
  - type: hash
    value: 6786ec90cbd45949695bd7805c9fbb26cfc91bc5fc897de0183d9bcb9cb21731
    description: SHA-256 of the tampered VSIX package, 2.1.313 for win32-x64
  - type: ip
    value: 134.209.82[.]225
    description: Configured remote SSH and HTTP destination
  - type: url
    value: hxxp://134[.]209[.]82[.]225:8099/beacon
    description: Host-profiling endpoint; correlate with the address above
  - type: hash
    value: ecb58cb29078d9646ad1dcdbe51526f2d9cfea06be5fb2ab183e8ecc3ab6bf15
    description: SHA-256 of the extension's JavaScript entry point, extension.js, 3,692,922 bytes. The same in all four tampered packages, which makes it the one hash to sweep installed extensions for
  - type: hash
    value: 7e0a52885fadee05544a9e99eb18c792bec05900a5e1a66d68f8383decb0e278
    description: SHA-256 of the decoded tunnel private-key file
  - type: config
    value: "Tunnel identity key, fingerprint SHA256:KOAU57+ZG6u3MG4WwzPzPX2O5YEe9qdOC1Bl+6MVyDQ, connecting as the remote account tunnel"
    description: The key the host used to open the reverse tunnel, distinct from the key added to authorized_keys. Useful where SSH client or server logs record the fingerprint
  - type: config
    value: "authorized_keys entry with the comment svc-telemetry, fingerprint SHA256:0Z6R+DF64Do2nwQic8a7kkfDLNNk4IiK+2U2Rci4htk"
    description: The added key. Check ~/.ssh/authorized_keys, %USERPROFILE%\.ssh\authorized_keys and C:\ProgramData\ssh\administrators_authorized_keys, and verify the key material, not only the comment
  - type: pattern
    value: ".stk_[0-9a-f]{10}"
    description: Hidden temporary file holding the tunnel identity, in the user's temporary directory. The suffix is derived from the host name and home path, so it is stable per host and differs between hosts
  - type: file
    value: ~/Library/LaunchAgents/com.apple.sysmond.plist
    description: macOS persistence; inspect its launch action
  - type: file
    value: ~/.config/.smt and ~/.config/.smtk
    description: macOS and Linux tunnel script and key
  - type: file
    value: "%USERPROFILE%\\.config\\smt.cmd and %USERPROFILE%\\.config\\smtk"
    description: Windows tunnel script and key
  - type: file
    value: "%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\sysmon.cmd"
    description: Windows fallback persistence
  - type: config
    value: Scheduled task named SysMon; user crontab @reboot entry
    description: Windows and Linux persistence for the tunnel. The names imitate monitoring components
  - type: process
    value: "ssh or autossh with -N -R '*:0:localhost:22'"
    description: The reverse tunnel. The identity-file path is redacted in the source
response_actions:
  - phase: contain
    action: List installed Cursor extensions with their versions on every host that ran Cursor on 29 October 2026, and find anthropic.claude-code at 2.1.312 or 2.1.313, recording where each copy was installed from. Then hash extension.js in each copy and compare it with the published value, because the version alone clears nothing and condemns nothing. On those hosts, before removing anything, collect the extension folder, the authorized_keys files, the persistence artifacts and the .stk_ file, then block the remote address and stop any ssh or autossh process carrying the reverse-forward arguments.
  - phase: eradicate
    action: Remove the added key by fingerprint, the LaunchAgent, crontab entry, scheduled task and Startup script, the .smt and .smtk files, and the tampered extension. Check whether the SSH service was enabled by the extension and was not on before.
  - phase: recover
    action: Treat every credential reachable from that user's session as exposed on any host where the tunnel connected, and rotate them. Where the SSH step failed, the profiling beacon still ran, so the host's details were disclosed.
  - phase: harden
    action: Pin or allow-list editor extensions and their marketplaces on managed hosts, and alert on a code editor's process tree adding an SSH key or creating autostart entries. Cursor documents an extension allowlist and an install delay for new versions; a delay of a day would have outlasted this window.
lesson: >-
  An AI coding tool's extension folder is a software supply chain of its own,
  with a marketplace that is not the one the vendor of the extension publishes
  to. The same extension id was clean in one marketplace and tampered in
  another, so the id proves nothing and the version and install source decide
  it, and here not even the version did, since one build misreported its own.
  The catalog has no row for Cursor's extension directory yet, because the
  vendor documents no path for it and none has been confirmed on a host. The
  rule this case links to matches the reverse tunnel it opened; it was written
  for this case and has not been fired against real events.
detections:
  - reverse_ssh_tunnel_exposing_local_sshd.yml
