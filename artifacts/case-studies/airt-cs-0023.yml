# AI agent artifact case study
# AIRT-CS-0023 - Tampered Claude Code Extension in Cursor's Marketplace

id: AIRT-CS-0023
title: "Tampered Claude Code Extension in Cursor's Marketplace - An SSH Backdoor Through an AI Tool's Update Channel"
date_range: 29 Oct 2026, about 02:27 to 13:35 PDT, as Cursor reported it
disclosed: "2026-10-30"
affects: AIRT-0002
confidence: high
basis: >-
  Three parties from their own evidence, each read from the page. Cursor, whose
  marketplace served the builds, published a security notice with the package
  hashes and a later update giving the cause. Microsoft Security Research
  analysed the extension and published the host indicators. A supply-chain
  security vendor compared the tampered bundle byte for byte against the
  clean build it had downloaded itself. The three agree on the versions, the
  window, the destination address and the artifacts. What rests on Cursor
  alone is the cause and the ceiling on affected users, and no party reports
  an operator using the access. The model was not involved at any stage: this
  is conventional malware delivered through an AI tool's extension channel,
  recorded because the extension directory of a catalogued tool is where the
  evidence sits.
contested: >-
  Where the tampering happened was misreported at first. Early accounts
  pointed at Open VSX, the registry Cursor's marketplace mirrors, and were
  withdrawn. Cursor's update of 13 November says an attacker used a credential
  stolen from data exposed in an internal system to place the tampered copies
  directly on the cache that serves its marketplace, and that the upstream
  registry never held them. That is Cursor's account of its own systems and
  nobody outside can check it. The same update puts the ceiling at 5,000
  users, a count of who could have received a build and not of hosts where the
  backdoor worked. Only two platform builds were tampered, Apple-silicon macOS
  and 64-bit Windows, so a Linux or Intel Mac host on the affected version
  numbers is not evidence of compromise.
