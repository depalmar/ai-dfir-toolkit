id: AIRT-TA-0021
name: Storm-0940
kind: state-nexus
nexus: CN
motivation:
- espionage
summary: Microsoft's designation for a China-state aligned actor, active since 2021, that
  targets organisations across many industries for data theft and historically gained access
  by password spraying and by exploiting internet-facing applications. In 2026 Microsoft
  reported it using ARTEX, an open-source multi-agent penetration-testing framework, to
  automate attacks on hundreds of organisations, and assessed it responsible for the compromise
  of a software vendor's multitenant applications that was then used against the vendor's
  customers.
confidence: medium
basis: One attributing party. Microsoft says the actor has no known industry aliases. Two
  other parties report activity that overlaps it without adopting the name - Google tracks
  a campaign using the same framework as UNC7228 and says it overlaps the activity Microsoft
  tracks as Storm-0940, and a cloud security vendor reports the same addresses and tooling
  against other software vendors. Overlap is not an alias, so neither is recorded as one.
  The responders who saw the vendor compromise in tenant logs say their telemetry is consistent
  with Microsoft's attribution and does not confirm it.
