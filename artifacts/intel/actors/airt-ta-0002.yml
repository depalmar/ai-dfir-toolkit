summary: Anthropic's designation for a cluster it assessed with high confidence to be a Chinese
  state-sponsored group. The cluster built a framework around Claude Code and MCP tools that
  ran most of an intrusion campaign against about thirty organisations. MITRE catalogues the
  activity as ATT&CK campaign C0062 and ATLAS case study AML.CS0069.
confidence: medium
basis: One reporting party, the provider whose product was abused. MITRE's adoption corroborates
  that the campaign happened, not the attribution or the autonomy figures.
contested: The degree of autonomy was publicly questioned by independent researchers. See
  AIRT-CS-0004.
