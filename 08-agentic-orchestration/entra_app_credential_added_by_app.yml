title: Entra ID - Credential Added to an Application by an Application
name: entra_app_credential_added_by_app
id: 2d245e9f-b009-44dd-97cd-a064edda8e3c
status: experimental
description: |
    Detects a secret or certificate added to an application registration or a service principal in
    Microsoft Entra ID where the initiator is itself an application. A credential added this way keeps
    working after the credential that was used to add it is rotated, which is why it is the persistence
    step reported in both ARTEX identity campaigns of late 2026: in the vendor application compromise a
    responder saw one application add credentials to two others, and the vendor's own advisory lists these
    two audit operations first among those to review.
    People add credentials through the portal and show up with a user as initiator, which this rule
    ignores. What remains is automation: secret rotation jobs and deployment pipelines. Those are
    regular, come from known applications, and usually add a credential to themselves or to an
    application they own. An application adding a credential to a different application, or doing so for
    the first time, is the finding.
    The AI in those campaigns ran on the actor's infrastructure. This rule reads what the victim tenant
    records, and says nothing about whether a model was involved.
    Not fired against real events. Reasoned from the documented schema of the audit log.
references:
    - https://www.connectwise.com/company/trust/advisories
    - https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
    - https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
    - https://learn.microsoft.com/azure/azure-monitor/reference/tables/auditlogs
    - https://atlas.mitre.org/techniques/AML.T0012
author: Raymond DePalma (@depalmar)
date: 2026-11-17
tags:
    - attack.persistence
    - attack.t1098.001      # Account Manipulation: Additional Cloud Credentials
    - atlas.aml-t0012
logsource:
    product: azure
    service: auditlogs
    definition: 'Microsoft Entra audit logs (Azure Monitor table AuditLogs, diagnostic category AuditLogs). InitiatedBy is a nested object that holds either a user or an app key; the field names below assume the pipeline flattens it with dots.'
detection:
    selection_operation:
        - OperationName: 'Add service principal credentials'
        # The full name is "Update application", a dash that is not an ASCII hyphen, then this phrase,
        # and it has shipped with a trailing space. Matching the phrase avoids all three.
        - OperationName|contains: 'Certificates and secrets management'
    selection_initiated_by_app:
        InitiatedBy.app.servicePrincipalId|exists: true
    condition: all of selection_*
fields:
    - OperationName
    - InitiatedBy.app.displayName
    - InitiatedBy.app.servicePrincipalId
    - TargetResources
    - Result
    - CorrelationId
falsepositives:
    - Scheduled secret rotation and deployment pipelines that manage application credentials with their own identity. Baseline which applications do this and to which targets.
level: medium
