title: Entra ID - Application Sign-In With an Invalid or Expired Client Secret
name: entra_app_signin_invalid_or_expired_secret
id: 9669cf08-5ccf-449b-9700-dc060d6ba0e2
status: experimental
description: |
    Detects an application (service principal) sign-in to Microsoft Entra ID that failed because the client
    secret presented was wrong (AADSTS7000215) or had expired (AADSTS7000222). Either error means somebody
    holds a credential for the application: a deployment nobody updated after a rotation, or a party that
    found an old secret somewhere it should not have been.
    In the campaign Microsoft reported on 5 November 2026, an agentic offensive framework searched public
    code repositories for application secrets and tried them against Entra ID at machine tempo, so a burst
    of these errors against applications whose secrets were once committed to a repository is the first
    trace the tenant gets. A failure followed by a success for the same application, from the same address,
    is the urgent case and is worth a manual look whenever this rule fires.
    Reads the service principal sign-in log (Azure Monitor table AADServicePrincipalSignInLogs, diagnostic
    category ServicePrincipalSignInLogs), which is not exported unless that category is selected. The
    table's documentation describes ResultType as success or failure and ResultSignature as the error
    code, while its own sample queries test ResultType against the numeric code, so both fields are
    matched here.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/
    - https://learn.microsoft.com/azure/azure-monitor/reference/tables/aadserviceprincipalsigninlogs
    - https://learn.microsoft.com/entra/identity-platform/reference-error-codes
    - https://atlas.mitre.org/techniques/AML.T0055
author: Raymond DePalma (@depalmar)
date: 2026-11-17
tags:
    - attack.initial-access
    - attack.t1078.004      # Valid Accounts: Cloud Accounts
    - attack.credential-access
    - attack.t1552.001      # Unsecured Credentials: Credentials In Files
    - atlas.aml-t0055
    - atlas.aml-t0012
logsource:
    product: azure
    service: signinlogs
    definition: 'Microsoft Entra service principal sign-in logs (AADServicePrincipalSignInLogs). Requires the ServicePrincipalSignInLogs diagnostic category to be exported.'
detection:
    selection_result_type:
        ResultType:
            - '7000215'
            - '7000222'
    selection_result_signature:
        ResultSignature:
            - '7000215'
            - '7000222'
    condition: 1 of selection_*
fields:
    - AppId
    - ServicePrincipalId
    - ServicePrincipalName
    - IPAddress
    - UserAgent
    - ResourceDisplayName
    - ResultDescription
falsepositives:
    - An application whose secret expired or was rotated while a deployment still presents the old one. This is common; the address and the application's owner settle it.
    - A developer testing with the secret identifier in place of the secret value.
level: medium
