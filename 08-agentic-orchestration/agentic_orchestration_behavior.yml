title: Agentic Killchain Progression in a Single Session
id: f1a6e29d-4c50-4783-b9e7-08d3c5a2f461
status: experimental
description: |
    Correlation rule: an agent session that exhibits machine-tempo tool invocation AND bulk collection within
    the same hour matches the GTG-1002 pattern of an autonomous chain running reconnaissance through
    exfiltration with minimal human intervention. Either signal alone has benign analogues; together they
    warrant immediate IR review.
references:
    - https://www.anthropic.com/news/disrupting-AI-espionage
author: Raymond DePalma (@depalmar)
date: 2026-08-12
correlation:
    type: temporal
    rules:
        - agent_tool_invocation_tempo_base
        - agent_tool_chain_mass_exfil_base
    group-by:
        - session_id
    timespan: 1h
    condition:
        gte: 2
tags:
    - attack.execution
    - attack.exfiltration
    - atlas.aml-t0096
    - atlas.aml-t0086
level: critical

---
# The pipe syntax these replace carried no time window, so "60 tool calls" was
# unbounded and would fire on any long-running legitimate session. A correlation
# requires a timespan, and the threshold only means "machine tempo" against a short
# one: 60 invocations in 5 minutes is 12/min, which no human drives.
title: Agent Tool Invocation at Machine Tempo
id: 8f2b1c47-6d39-4a5e-9c81-2e7f4a0b6d13
status: experimental
description: >-
    Sustained agent tool-invocation rate consistent with autonomous operation rather
    than human-paced use. Models the GTG-1002 tempo signal.
author: Raymond DePalma (@depalmar)
date: 2026-08-13
correlation:
    type: event_count
    rules:
        - agent_tool_invocation_tempo_base
    group-by:
        - session_id
    timespan: 5m
    condition:
        gt: 60
tags:
    - attack.execution
    - atlas.aml-t0086
level: medium

