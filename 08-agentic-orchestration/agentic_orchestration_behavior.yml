title: Mass Data Collection via Agent Tool Chaining
id: 3c9e5a71-0b48-4f26-8d13-7a6c2f9b4e05
status: experimental
description: >-
    Repeated collection-oriented tool calls inside one agent session, the
    tool-chaining path to bulk exfiltration (ATLAS T0086).
author: Raymond DePalma (@depalmar)
date: 2026-08-13
correlation:
    type: event_count
    rules:
