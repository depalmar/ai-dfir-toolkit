title: Model File Written by Untrusted Process (hash-baseline pre-filter)
id: 5e7fb143-6c8d-9e0f-1a2b-3c4d5e6f7081
status: experimental
description: |
  Flags creation or modification of model files by processes outside the
  trusted ML toolchain. Pure Sigma cannot compare a file's SHA-256 against
  an approved-model baseline, so this rule is a pre-filter: pair it with a
  backend lookup/enrich step that drops events whose hash IS already in the
  baseline. What remains surfaces unauthorized model substitution,
  supply-chain tampering, or undeclared model updates that bypass review.

  Prerequisites:
    1. File integrity monitoring collects SHA-256 of every model file
       (Sysmon EID 15 File Stream, auditd fanotify, Wazuh FIM,
       OSQuery file_events table, or EDR equivalent).
    2. Maintain an approved-hash allowlist in your SIEM as a lookup:
       columns: model_name, sha256, version, approved_date.
    3. This rule flags any HIGH-signal file event; tune the lookup
       correlation in your backend (e.g. an Elastic enrich processor
       or equivalent SIEM lookup).
references:
  - https://atlas.mitre.org/techniques/AML.T0010
  - https://atlas.mitre.org/techniques/AML.T0018
  - https://genai.owasp.org/llmrisk/llm03-supply-chain/
author: Raymond DePalma (ai-dfir-detections)
date: 2026-04-15
tags:
  - attack.persistence
  - attack.initial_access
  - attack.atlas.t0010
  - attack.atlas.t0018
  - owasp.llm03
logsource:
  category: file_event
detection:
  selection_model_file:
    TargetFilename|endswith:
      - '.pt'
      - '.pth'
      - '.bin'
      - '.safetensors'
      - '.gguf'
      - '.onnx'
      - '.h5'
      - '.keras'
      - '.pkl'
      - '.joblib'
      - '.ckpt'
  filter_trusted_writer:
    Image|endswith:
      - '/python'
      - '/python3'
      - '/huggingface-cli'
      - '\python.exe'
  condition: selection_model_file and not filter_trusted_writer
fields:
  - User
  - Image
  - ParentImage
  - TargetFilename
  - Hashes
  - CommandLine
falsepositives:
  - Legitimate model training or download by approved ML pipelines
  - Package manager operations (pip/conda) on ML libraries
  - Backup/sync tools (Dropbox, OneDrive, Time Machine)
level: medium
