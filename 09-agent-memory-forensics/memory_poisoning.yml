title: Agent Instruction File Modified (Persistence via Agent Context)
name: agent_instruction_file_modified
id: 6b41c07e-9a2d-4f83-b5e1-3c8d70a4f2b9
status: experimental
description: |
    Detects modification of the instruction and rules files that agentic coding tools load into context on
    every session (CLAUDE.md, AGENTS.md, MEMORY.md, .cursorrules, .windsurfrules, .clinerules, GEMINI.md).
    These files are re-read at each invocation, so an attacker-controlled line persists across sessions,
    process restarts and conversation resets. This is the file-backed form of MITRE ATLAS AML.T0080
    (AI Agent Context Poisoning) and is the mechanism behind Rules-File-Backdoor style attacks.
    Modification is normal in active development, so alert quality depends on WHO wrote the file: a write
    by a non-interactive process, a background agent, or an unexpected user is the signal.
references:
    - https://atlas.mitre.org/techniques/AML.T0080
    - https://zenity.io/blog/current-events/zenity-labs-and-mitre-atlas-collaborate-to-advances-ai-agent-security-with-the-first-release-of
author: Raymond DePalma (@depalmar)
date: 2026-08-12
tags:
    - attack.persistence
    - atlas.aml-t0080
logsource:
    category: file_event
detection:
    selection_name:
        TargetFilename|endswith:
            - '\CLAUDE.md'
            - '\AGENTS.md'
            - '\AGENT.md'
            - '\MEMORY.md'
            - '\GEMINI.md'
            - '\.cursorrules'
            - '\.windsurfrules'
            - '\.clinerules'
            - '\.aiderrules'
            - '/CLAUDE.md'
            - '/AGENTS.md'
            - '/MEMORY.md'
            - '/.cursorrules'
            - '/.windsurfrules'
    filter_editors:
        # Interactive edits by a developer are expected; tune to your estate.
        Image|endswith:
            - '\Code.exe'
            - '\devenv.exe'
            - '\idea64.exe'
            - '/code'
            - '/vim'
            - '/nvim'
            - '/emacs'
    condition: selection_name and not filter_editors
falsepositives:
    - Legitimate repository updates via git checkout, pull, or merge - correlate with VCS activity.
    - Project scaffolding tools that generate agent instruction files.
level: medium
